<style>
.wrap { max-width: 820px; margin: 0 auto; padding: 0 24px 96px; }
.blog-back { display:inline-flex; align-items:center; gap:6px; margin:22px 0 8px; font-size:.9rem; font-weight:600; color:var(--ink-2); text-decoration:none; }
.blog-back:hover { color:var(--accent); }
.art-head { padding: 8px 0 18px; border-bottom:1px solid var(--line); margin-bottom:26px; }
.art-head h1 { font-size: 2.1rem; font-weight:900; line-height:1.2; letter-spacing:-.01em; }
.art-meta { display:flex; align-items:center; gap:10px; margin-top:14px; font-size:.88rem; color:var(--ink-2); flex-wrap:wrap; }
.art-ava { width:38px; height:38px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-weight:800; }
.article { font-size:1.06rem; line-height:1.85; color:var(--ink); }
.article h1,.article h2,.article h3,.article h4 { font-weight:800; line-height:1.3; margin:1.6em 0 .6em; color:var(--ink); }
.article h1 { font-size:1.7rem; } .article h2 { font-size:1.4rem; } .article h3 { font-size:1.18rem; } .article h4 { font-size:1.04rem; }
.article p { margin:0 0 1.15em; }
.article ul,.article ol { margin:0 0 1.15em; padding-left:1.5em; }
.article li { margin:.3em 0; }
.article a { color:var(--accent); text-decoration:underline; }
.article code { background:var(--surface-2); padding:1px 6px; border-radius:5px; font-size:.92em; font-family:Menlo,Consolas,monospace; }
.article blockquote { border-left:4px solid var(--accent); background:var(--surface-2); margin:0 0 1.15em; padding:10px 18px; border-radius:0 var(--r-md,10px) var(--r-md,10px) 0; color:var(--ink-2); }
.article hr { border:none; border-top:1px solid var(--line); margin:1.8em 0; }
.article img { max-width:100%; border-radius:var(--r-md,10px); }
.article figure { margin:1.6em 0; text-align:center; }
.article figure img { margin:0 auto; }
.article figcaption { font-size:.85rem; color:var(--ink-3); margin-top:8px; font-style:italic; }
.article mjx-container { overflow-x:auto; overflow-y:hidden; max-width:100%; }

/* Like + comments */
.blog-actions { display:flex; align-items:center; gap:14px; margin:34px 0 10px; padding:16px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.like-btn { display:inline-flex; align-items:center; gap:8px; padding:9px 18px; border-radius:99px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:700; cursor:pointer; font-family:inherit; font-size:.95rem; transition:all .15s; }
.like-btn:hover { border-color:var(--accent); }
.like-btn.liked { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
.like-btn .heart { font-size:1.1rem; }
.cmt-sec h3 { font-size:1.2rem; font-weight:800; margin:30px 0 16px; }
.cmt-form { display:flex; flex-direction:column; gap:10px; margin-bottom:24px; }
.cmt-form textarea { width:100%; border:1px solid var(--line); border-radius:var(--r-md,10px); padding:12px 14px; background:var(--surface); color:var(--ink); font-family:inherit; font-size:.95rem; resize:vertical; min-height:80px; }
.cmt-login { background:var(--surface-2); border:1px dashed var(--line); border-radius:var(--r-md,10px); padding:16px; text-align:center; color:var(--ink-2); font-size:.92rem; }
.cmt-item { display:flex; gap:12px; padding:14px 0; border-top:1px solid var(--line); }
.cmt-ava { width:38px; height:38px; border-radius:50%; flex-shrink:0; display:grid; place-items:center; font-weight:800; color:#fff; }
.cmt-body { flex:1; min-width:0; }
.cmt-name { font-weight:700; font-size:.92rem; }
.cmt-when { font-size:.76rem; color:var(--ink-3); margin-left:8px; font-weight:400; }
.cmt-text { font-size:.95rem; color:var(--ink); margin-top:3px; white-space:pre-wrap; line-height:1.6; }
.cmt-del { background:none; border:none; color:var(--ink-3); cursor:pointer; font-size:.78rem; margin-top:4px; }
.cmt-del:hover { color:var(--err,#e74c3c); }
.blog-empty { text-align:center; padding:80px 24px; color:var(--ink-3); }
.btn-login-top { padding:8px 16px; border-radius:99px; background:var(--accent); color:#fff; font-weight:700; font-size:.88rem; text-decoration:none; }

/* Blog Listing styles */
.blog-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
  margin-top: 24px;
}
.blog-list-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md, 12px);
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-decoration: none;
  color: var(--ink);
  transition: all 0.25s ease;
  box-shadow: var(--shadow);
  box-sizing: border-box;
}
.blog-list-card.has-cover { padding-top: 0; overflow: hidden; }
.blog-list-card .bl-cover { width: calc(100% + 40px); height: 170px; object-fit: cover; margin: 0 -20px 16px; display: block; }
.blog-list-card:hover {
  transform: translateY(-4px);
  background: var(--surface-2);
  box-shadow: 0 12px 28px rgba(31,38,135,0.08), 0 0 12px var(--accent-soft);
  border-color: var(--line-2);
}
.blog-list-card .bl-title {
  font-size: 1.15rem;
  font-weight: 800;
  line-height: 1.4;
  margin-bottom: 8px;
  color: var(--ink);
}
.blog-list-card .bl-excerpt {
  font-size: 0.9rem;
  color: var(--ink-2);
  line-height: 1.6;
  margin-bottom: 16px;
  flex-grow: 1;
}
.blog-list-card .bl-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.8rem;
  color: var(--ink-3);
  border-top: 1px dashed var(--line);
  padding-top: 10px;
}
.blog-list-card .bl-auth {
  font-weight: 700;
  color: var(--ink-2);
}
</style>

<div class="topbar">
  <div class="nav">

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
/* ====== RENDER MARKDOWN-LITE + MATHJAX (theme-aware) ====== */
function blogEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderBlog(src){
  src = String(src || '');
  var math = [];
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, function(m){ math.push(m); return '___MATH_' + (math.length-1) + '___'; });
  src = src.replace(/\\\[([\s\S]+?)\\\]/g, function(m){ math.push(m); return '___MATH_' + (math.length-1) + '___'; });
  src = src.replace(/\$([^\$\n]+?)\$/g, function(m){ math.push(m); return '___MATH_' + (math.length-1) + '___'; });
  src = src.replace(/\\\(([\s\S]+?)\\\)/g, function(m){ math.push(m); return '___MATH_' + (math.length-1) + '___'; });

  function inline(t){
    t = blogEsc(t);
    t = t.replace(/!\[([^\]]*)\]\((https?:[^)\s]+)\)/g, '<img src="$2" alt="$1" loading="lazy">');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    t = t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return t;
  }
  var lines = src.split(/\r?\n/), html = '', para = [], inUl = false, inOl = false;
  function flushPara(){ if(para.length){ html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } }
  function closeLists(){ if(inUl){ html += '</ul>'; inUl = false; } if(inOl){ html += '</ol>'; inOl = false; } }
  lines.forEach(function(ln){
    var t = ln.trim();
    if(t === ''){ flushPara(); closeLists(); return; }
    var img = t.match(/^!\[([^\]]*)\]\((https?:[^)\s]+)\)$/);
    if(img){ flushPara(); closeLists(); html += '<figure><img src="' + img[2] + '" alt="' + blogEsc(img[1]) + '" loading="lazy">' + (img[1] ? '<figcaption>' + blogEsc(img[1]) + '</figcaption>' : '') + '</figure>'; return; }
    var hm = t.match(/^(#{1,4})\s+(.*)$/);
    if(hm){ flushPara(); closeLists(); var lvl = hm[1].length; html += '<h' + lvl + '>' + inline(hm[2]) + '</h' + lvl + '>'; return; }
    if(/^(---|\*\*\*|___)$/.test(t)){ flushPara(); closeLists(); html += '<hr>'; return; }
    if(/^>\s?/.test(t)){ flushPara(); closeLists(); html += '<blockquote>' + inline(t.replace(/^>\s?/, '')) + '</blockquote>'; return; }
    var um = t.match(/^[-*]\s+(.*)$/);
    if(um){ flushPara(); if(inOl){ html += '</ol>'; inOl = false; } if(!inUl){ html += '<ul>'; inUl = true; } html += '<li>' + inline(um[1]) + '</li>'; return; }
    var om = t.match(/^\d+\.\s+(.*)$/);
    if(om){ flushPara(); if(inUl){ html += '</ul>'; inUl = false; } if(!inOl){ html += '<ol>'; inOl = true; } html += '<li>' + inline(om[1]) + '</li>'; return; }
    para.push(t);
  });
  flushPara(); closeLists();
  html = html.replace(/___MATH_(\d+)___/g, function(_, i){ return math[+i]; });
  return html;
}

var MAU = ['#B5483A','#5E7B5E','#A8842C','#4A6FA5','#7B5EA7','#C26B4E','#3E8E7E','#9C5570'];
function mauTen(ten){ var s=0; ten=ten||'?'; for(var i=0;i<ten.length;i++) s+=ten.charCodeAt(i); return MAU[s%MAU.length]; }
function chuCai(ten){ var p=(ten||'?').trim().split(/\s+/); return (p[p.length-1]||'?').charAt(0).toUpperCase(); }
function khiNao(iso){ try { return new Date(iso).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'numeric',year:'numeric'}); } catch(e){ return ''; } }

var bUser = null, bProfile = null, bPostId = null, bPost = null;

(async function(){
  var params = new URLSearchParams(location.search);
  bPostId = params.get('id');

  // Auth-aware nút góc phải
  var authBox = document.getElementById('khungAuth');
  if (daKetNoi()){
    try {
      var s = await sb.auth.getSession();
      if (s.data.session){
        bUser = s.data.session.user;
        var rp = await sb.from('profiles').select('id, full_name, role').eq('id', bUser.id).single();
        bProfile = rp.data || null;
        authBox.innerHTML = '<button class="btn btn-secondary btn-sm" onclick="dangXuat()">Đăng xuất</button>';
      } else {
        authBox.innerHTML = '<a class="btn-login-top" href="dang-nhap.html">Đăng nhập</a>';
      }
    } catch(e){ authBox.innerHTML = '<a class="btn-login-top" href="dang-nhap.html">Đăng nhập</a>'; }
  }

  // Adjust back button for guests
  if (!bUser) {
    var btnBack = document.getElementById('btnBack');
    if (btnBack) {
      btnBack.href = 'index.html#blog-cong-khai';
      btnBack.textContent = '← Quay lại Trang chủ';
    }
  }

  if (!bPostId) {
    var btnBack = document.getElementById('btnBack');
    if (btnBack) btnBack.style.display = 'none';
    await taiDanhSachBlog();
    return;
  }
  await taiBaiViet();
})();

async function taiBaiViet(){
  var box = document.getElementById('blogContainer');
  if (!daKetNoi()){ box.innerHTML = '<div class="blog-empty">Web đang ở chế độ xem thử.</div>'; return; }
  var r = await sb.from('blog_posts').select('*').eq('id', bPostId).single();
  if (r.error || !r.data){ box.innerHTML = '<div class="blog-empty">😢 Bài viết không tồn tại hoặc chưa được xuất bản.</div>'; return; }
  bPost = r.data;
  if (!bPost.published && !(bProfile && ['admin','teacher','assistant'].indexOf(bProfile.role) !== -1)){
    box.innerHTML = '<div class="blog-empty">Bài viết này chưa được xuất bản.</div>'; return;
  }
  document.title = bPost.title + ' — Blog VinhMath';

  var ava = '<div class="art-ava" style="background:' + mauTen(bPost.author_name) + '">' + chuCai(bPost.author_name) + '</div>';
  box.innerHTML =
    '<article>' +
      '<div class="art-head">' +
        (bPost.published ? '' : '<div style="display:inline-block;background:var(--warn-soft);color:var(--warn);font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:99px;margin-bottom:10px">● Bản nháp (chỉ thầy/trợ giảng thấy)</div>') +
        '<h1>' + blogEsc(bPost.title) + '</h1>' +
        '<div class="art-meta">' + ava + '<div><b>' + blogEsc(bPost.author_name || 'Thầy Vinh') + '</b><div style="font-size:.78rem;color:var(--ink-3)">' + khiNao(bPost.created_at) + '</div></div></div>' +
      '</div>' +
      '<div class="article" id="artBody"></div>' +
    '</article>' +
    '<div class="blog-actions">' +
      '<button class="like-btn" id="likeBtn" onclick="toggleLike()"><span class="heart">🤍</span><span id="likeCount">0</span></button>' +
      '<span style="color:var(--ink-3);font-size:.88rem" id="cmtCountLbl"></span>' +
    '</div>' +
    '<div class="cmt-sec">' +
      '<h3>💬 Bình luận</h3>' +
      '<div id="cmtFormBox"></div>' +
      '<div id="cmtList"></div>' +
    '</div>';

  document.getElementById('artBody').innerHTML = renderBlog(bPost.content);
  if (window.MathJax && window.MathJax.typesetPromise){ window.MathJax.typesetPromise([document.getElementById('artBody')]); }

  await taiLike();
  taiFormBinhLuan();
  await taiBinhLuan();
}

async function taiLike(){
  var r = await sb.from('blog_likes').select('user_id').eq('post_id', bPostId);
  var ds = r.data || [];
  document.getElementById('likeCount').textContent = ds.length;
  var liked = bUser && ds.some(function(x){ return x.user_id === bUser.id; });
  var btn = document.getElementById('likeBtn');
  btn.classList.toggle('liked', !!liked);
  btn.querySelector('.heart').textContent = liked ? '❤️' : '🤍';
}

async function toggleLike(){
  if (!bUser){ alert('Em hãy đăng nhập để yêu thích bài viết nhé!'); return; }
  var btn = document.getElementById('likeBtn');
  var liked = btn.classList.contains('liked');
  btn.style.pointerEvents = 'none';
  if (liked){ await sb.from('blog_likes').delete().eq('post_id', bPostId).eq('user_id', bUser.id); }
  else { await sb.from('blog_likes').insert({ post_id: bPostId, user_id: bUser.id }); }
  await taiLike();
  btn.style.pointerEvents = 'auto';
}

function taiFormBinhLuan(){
  var box = document.getElementById('cmtFormBox');
  if (!bUser){
    box.innerHTML = '<div class="cmt-login">Hãy <a href="dang-nhap.html" style="color:var(--accent);font-weight:700">đăng nhập</a> để để lại bình luận.</div>';
    return;
  }
  box.innerHTML = '<div class="cmt-form"><textarea id="cmtInput" placeholder="Viết bình luận của bạn…"></textarea>' +
    '<div style="text-align:right"><button class="btn btn-primary btn-sm" id="cmtSend" onclick="guiBinhLuan()">Gửi bình luận</button></div></div>';
}

async function guiBinhLuan(){
  var t = document.getElementById('cmtInput').value.trim();
  if (!t){ return; }
  var nut = document.getElementById('cmtSend'); nut.disabled = true; nut.textContent = '⏳ Đang gửi…';
  var ten = (bProfile && bProfile.full_name) ? bProfile.full_name : 'Người dùng';
  var r = await sb.from('blog_comments').insert({ post_id: bPostId, user_id: bUser.id, author_name: ten, content: t });
  nut.disabled = false; nut.textContent = 'Gửi bình luận';
  if (r.error){ alert('Lỗi gửi bình luận: ' + r.error.message); return; }
  document.getElementById('cmtInput').value = '';
  await taiBinhLuan();
}

async function taiBinhLuan(){
  var list = document.getElementById('cmtList');
  var r = await sb.from('blog_comments').select('id, content, author_name, created_at, user_id').eq('post_id', bPostId).order('created_at', { ascending: false });
  var ds = r.data || [];
  document.getElementById('cmtCountLbl').textContent = ds.length + ' bình luận';
  if (!ds.length){ list.innerHTML = '<div style="color:var(--ink-3);font-size:.9rem;padding:8px 0">Chưa có bình luận nào. Hãy là người đầu tiên!</div>'; return; }
  var laAdmin = bProfile && bProfile.role === 'admin';
  list.innerHTML = ds.map(function(c){
    var coXoa = bUser && (c.user_id === bUser.id || laAdmin);
    return '<div class="cmt-item"><div class="cmt-ava" style="background:' + mauTen(c.author_name) + '">' + chuCai(c.author_name) + '</div>' +
      '<div class="cmt-body"><div class="cmt-name">' + blogEsc(c.author_name || 'Người dùng') + '<span class="cmt-when">' + khiNao(c.created_at) + '</span></div>' +
      '<div class="cmt-text">' + blogEsc(c.content) + '</div>' +
      (coXoa ? '<button class="cmt-del" onclick="xoaBinhLuan(\'' + c.id + '\')">Xoá</button>' : '') +
      '</div></div>';
  }).join('');
}

async function xoaBinhLuan(id){
  if (!confirm('Xoá bình luận này?')) return;
  var r = await sb.from('blog_comments').delete().eq('id', id);
  if (r.error){ alert('Lỗi: ' + r.error.message); return; }
  await taiBinhLuan();
}

/* --- CHỨC NĂNG DANH SÁCH BLOG --- */
var viewAsStudent = localStorage.getItem('vm-blog-student-view') === 'true';

async function taiDanhSachBlog() {
  var box = document.getElementById('blogContainer');
  if (!daKetNoi()) { box.innerHTML = '<div class="blog-empty">Web đang ở chế độ xem thử.</div>'; return; }
  
  box.innerHTML = '<div class="blog-empty">Đang tải danh sách bài viết…</div>';
  
  try {
    var query = sb.from('blog_posts').select('id, title, excerpt, author_name, created_at, published, cover_url');
    
    var laAdmin = bProfile && bProfile.role === 'admin';
    if (!laAdmin || viewAsStudent) {
      query = query.eq('published', true);
    }
    
    var r = await query.order('created_at', { ascending: false });
    var ds = r.data || [];
    
    var ids = ds.map(function(p) { return p.id; });
    var likeMap = {}, cmtMap = {};
    if (ids.length > 0) {
      try {
        var rl = await sb.from('blog_likes').select('post_id').in('post_id', ids);
        (rl.data || []).forEach(function(x) {
          likeMap[x.post_id] = (likeMap[x.post_id] || 0) + 1;
        });
      } catch(e) {}
      try {
        var rc = await sb.from('blog_comments').select('post_id').in('post_id', ids);
        (rc.data || []).forEach(function(x) {
          cmtMap[x.post_id] = (cmtMap[x.post_id] || 0) + 1;
        });
      } catch(e) {}
    }
    
    var html = '';
    if (laAdmin) {
      if (viewAsStudent) {
        html += '<div style="background:var(--warn-soft); border:1px dashed var(--warn); padding:12px 18px; border-radius:var(--r-md, 12px); display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:24px; flex-wrap:wrap">' +
          '<div style="font-size:0.92rem; color:var(--ink)">👁️ <b>Đang xem với tư cách Học sinh</b>: Ẩn bản nháp và các chức năng quản trị.</div>' +
          '<button class="btn btn-secondary btn-sm" onclick="toggleStudentView()">🔙 Trở lại chế độ Thầy Vinh</button>' +
        '</div>';
      } else {
        html += '<div style="background:var(--accent-soft); border:1px solid var(--accent); padding:12px 18px; border-radius:var(--r-md, 12px); display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:24px; flex-wrap:wrap">' +
          '<div style="font-size:0.92rem; color:var(--ink)">👑 <b>Chế độ quản trị viên</b>: Bạn có quyền viết và quản lý tất cả bài viết.</div>' +
          '<div style="display:flex; gap:10px; align-items:center">' +
            '<button class="btn btn-secondary btn-sm" onclick="toggleStudentView()">👁️ Xem với tư cách Học sinh</button>' +
            '<a href="viet-blog.html" class="btn btn-primary btn-sm">✍️ Viết bài mới</a>' +
          '</div>' +
        '</div>';
      }
    }

    html += '<h1 style="font-size:1.8rem; font-weight:800; margin-bottom:6px; color:var(--ink)">📚 Blog Toán học — VinhMath</h1>' +
      '<p style="color:var(--ink-2); margin-bottom:28px; font-size:0.95rem">Nơi chia sẻ phương pháp học Toán tư duy, các chuyên đề nâng cao và sơ đồ học tập tối ưu.</p>';

    if (!ds.length) {
      html += '<div class="blog-empty">Chưa có bài viết nào được đăng tải.</div>';
      box.innerHTML = html;
      return;
    }

    html += '<div class="blog-grid">';
    html += ds.map(function(p) {
      var d = new Date(p.created_at).toLocaleDateString('vi-VN');
      var isDraft = !p.published;
      
      var adminActionsHtml = '';
      if (laAdmin && !viewAsStudent) {
        adminActionsHtml = '<div style="display:flex; gap:8px; margin-top:10px; border-top:1px dashed var(--line); padding-top:10px; justify-content:flex-end">' +
          '<a href="viet-blog.html?id=' + p.id + '" class="btn btn-secondary btn-sm" style="padding:4px 8px; font-size:0.75rem; border-radius:4px" onclick="event.stopPropagation()">✏️ Sửa</a>' +
          '<button class="btn btn-secondary btn-sm" style="padding:4px 8px; font-size:0.75rem; border-radius:4px; color:var(--err)" onclick="xoaPost(event, \'' + p.id + '\')">🗑️ Xoá</button>' +
        '</div>';
      }

      var cover = p.cover_url ? '<img class="bl-cover" src="' + blogEsc(p.cover_url) + '" alt="" loading="lazy">' : '';
      return '<div class="blog-list-card' + (cover ? ' has-cover' : '') + '" onclick="window.location.href=\'blog.html?id=' + p.id + '\'" style="cursor:pointer">' +
        cover +
        '<div>' +
          (isDraft ? '<span style="display:inline-block; background:var(--warn-soft); color:var(--warn); font-size:0.68rem; font-weight:700; padding:2px 8px; border-radius:99px; margin-bottom:8px">● Nháp</span>' : '') +
          '<div class="bl-title">' + blogEsc(p.title) + '</div>' +
          '<div class="bl-excerpt">' + blogEsc(p.excerpt || '') + '</div>' +
        '</div>' +
        '<div>' +
          '<div class="bl-meta">' +
            '<span class="bl-auth">' + blogEsc(p.author_name || 'Thầy Vinh') + '</span>' +
            '<span>' + d + '</span>' +
            '<span style="margin-left:auto">❤️ ' + (likeMap[p.id] || 0) + '</span>' +
            '<span style="margin-left:8px">💬 ' + (cmtMap[p.id] || 0) + '</span>' +
          '</div>' +
          adminActionsHtml +
        '</div>' +
      '</div>';
    }).join('');
    html += '</div>';
    box.innerHTML = html;
  } catch (err) {
    console.error("Lỗi tải danh sách blog:", err);
    box.innerHTML = '<div class="blog-empty">Có lỗi xảy ra khi tải danh sách bài viết.</div>';
  }
}

function toggleStudentView() {
  viewAsStudent = !viewAsStudent;
  localStorage.setItem('vm-blog-student-view', viewAsStudent ? 'true' : 'false');
  taiDanhSachBlog();
}

async function xoaPost(event, id) {
  event.stopPropagation();
  if (!confirm('Bạn có chắc chắn muốn xoá bài viết này không?')) return;
  var r = await sb.from('blog_posts').delete().eq('id', id);
  if (r.error) {
    alert('Lỗi khi xoá bài viết: ' + r.error.message);
  } else {
    taiDanhSachBlog();
  }
}
</script>
</body>
</html>
