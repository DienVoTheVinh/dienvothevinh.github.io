<!DOCTYPE html>
<html lang="vi">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soạn đề thi LaTeX — VinhMath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=4.2">
<link rel="stylesheet" href="css/vinhmath.css?v=4.2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
<style>
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px 96px; }
.head { padding: 40px 0 24px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
@media(max-width: 900px) { .cols { grid-template-columns: 1fr; } }
textarea.code { width: 100%; min-height: 360px; resize: vertical; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: .85rem; line-height: 1.5; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 14px; }
textarea.code:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.q-preview-card { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
.q-preview-title { font-weight: 700; margin-bottom: 8px; font-size: .95rem; }
.q-preview-choice { padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); margin-bottom: 6px; font-size: .88rem; }
.q-preview-choice.correct { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.q-preview-sol { margin-top: 10px; padding: 10px; background: var(--surface-2); border-left: 3px solid var(--accent); border-radius: 4px; font-size: .85rem; }
.empty { text-align: center; padding: 48px 24px; color: var(--ink-3); }
#vungPreview { position: sticky; top: 80px; max-height: calc(100vh - 120px); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 18px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
#dsPreview { flex: 1; overflow-y: auto; padding-right: 6px; margin-top: 12px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="nav">
    <a class="logo" href="index"><img src="img/logo.png" alt="VinhMath">VinhMath <small>· Quản trị</small></a>
    <nav class="navlinks">
      <!-- Sẽ được điền tự động bằng menu.js -->
    </nav>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="btn btn-ghost btn-sm" id="themeBtn" onclick="toggleTheme()">🌙</button>
      <button class="btn btn-secondary btn-sm" onclick="dangXuat()">Đăng xuất</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="head">
    <div>
      <div class="sec-label">Khu vực chuyên môn của thầy</div>
      <h1>Quản lý đề thi & Luyện đề</h1>
      <p style="margin-top:6px">Soạn đề thi bằng cách dán code LaTeX (ex_test), hệ thống tự bóc tách câu hỏi, đáp án, lời giải.</p>
    </div>
  </div>

  <div class="cols">
    <!-- Cột trái: Form tạo đề & Soạn LaTeX -->
    <div class="card" style="display:flex; flex-direction:column; gap:16px">
      <h3 id="formTitle">🛠️ Tạo đề thi mới</h3>
      <form onsubmit="parseAndSaveExam(event)">
        <div class="field">
          <label>Tiêu đề đề thi/đề luyện <b style="color:var(--accent)">*</b></label>
          <input class="input" id="exTitle" required placeholder="Ví dụ: Đề thi thử lần 1 - Khối 12">
        </div>
        <div class="form-row">
          <div class="field">
            <label>Lớp áp dụng (Để trống = Mọi lớp)</label>
            <select class="input" id="exLop">
              <option value="">-- Mọi lớp --</option>
            </select>
          </div>
          <div class="field">
            <label>Thời gian làm bài (Phút) <b style="color:var(--accent)">*</b></label>
            <input class="input" type="number" id="exDuration" value="90" required>
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label>Mở lúc (Trống = mở ngay)</label>
            <input class="input" type="datetime-local" id="exOpens">
          </div>
          <div class="field">
            <label>Đóng lúc (Trống = không hạn chế)</label>
            <input class="input" type="datetime-local" id="exCloses">
          </div>
        </div>
        <div class="field" style="display:flex; gap:16px; margin: 10px 0">
          <div class="switch-container">
            <input type="checkbox" id="exShuffle" checked>
            <label for="exShuffle" style="margin:0; font-weight:600">Xáo trộn câu hỏi</label>
          </div>
          <div class="switch-container">
            <input type="checkbox" id="exPublished" checked>
            <label for="exPublished" style="margin:0; font-weight:600">Xuất bản đề</label>
          </div>
        </div>
        
        <div class="field">
          <label>Hình thức đề <b style="color:var(--accent)">*</b></label>
          <select class="input" id="exType" onchange="capNhatHinhThucDe()">
            <option value="mc">Chỉ trắc nghiệm (tự động chấm)</option>
            <option value="essay">Chỉ tự luận (học sinh chụp ảnh nộp)</option>
            <option value="combo">Kết hợp (trắc nghiệm + tự luận)</option>
          </select>
        </div>

        <div class="field" id="wrapEssayPrompt" style="display:none">
          <label>Đề bài / yêu cầu phần tự luận</label>
          <textarea class="code" id="exEssayPrompt" style="min-height:140px" placeholder="Nhập đề bài tự luận (có thể dùng LaTeX $...$). Học sinh đọc đề rồi chụp ảnh bài làm nộp lên cho thầy chấm tay."></textarea>
        </div>

        <div class="field" id="wrapLatex">
          <label>Nội dung đề LaTeX (ex_test format) <b style="color:var(--accent)">*</b></label>
          <textarea class="code" id="exLatex" placeholder="\begin{ex}&#10;Đề bài toán...&#10;\choice&#10;{A. Lựa chọn 1}&#10;{\True B. Lựa chọn đúng}&#10;{C. Lựa chọn 3}&#10;{D. Lựa chọn 4}&#10;\loigiai{&#10;Lời giải chi tiết...&#10;}&#10;\end{ex}"></textarea>
        </div>

        <div style="display:flex; gap:12px; margin-top:20px">
          <button type="button" class="btn btn-secondary" onclick="demoParseLaTeX()" style="flex:1">🔍 Phân tích đề</button>
          <button type="submit" class="btn btn-primary" id="btnSave" style="flex:1" disabled>💾 Lưu đề thi</button>
        </div>
        <button type="button" class="btn btn-ghost" id="btnCancelEdit" style="display:none; margin-top:10px; width:100%; color:var(--ink-3)" onclick="cancelEditExam()">❌ Huỷ chỉnh sửa (Tạo đề mới)</button>
      </form>
    </div>

    <!-- Cột phải: Xem thử câu hỏi bóc tách -->
    <div style="align-self: stretch;">
      <div id="vungPreview" style="display:none">
        <h3 style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line-2); padding-bottom:10px; margin-bottom:0; font-size:1.05rem">
          <span>👁️ Xem trước hiển thị</span>
          <small style="font-size:0.8rem; font-weight:500; color:var(--ink-2)" id="previewCountLabel"></small>
        </h3>
        <div id="dsPreview"></div>
      </div>
    </div>
  </div>

  <!-- Danh sách đề đã tạo -->
  <div style="margin-top:40px">
    <h3 style="margin-bottom:16px">📋 Danh sách đề thi đã tạo</h3>
    <div id="dsDeThi" style="display:flex; flex-direction:column; gap:12px">
      <div class="empty card">Đang tải đề thi...</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/vinhmath.js?v=4.2"></script>
<script src="js/menu.js"></script>
<script src="js/latex-view.js"></script>
<script src="js/analytics.js"></script>
<script>
var listExams = [];
var listClasses = [];
var parsedQuestions = [];
var editingExamId = null;

(async function () {
  if (!daKetNoi()) return;
  var hoSo = await yeuCauDangNhap();
  if (!hoSo) return;
  if (!['admin', 'teacher'].includes(hoSo.role)) {
    window.location.href = 'luyen-de';
    return;
  }
  
  // Tải lớp
  var rCl = await sb.from('classes').select('id, name').order('name');
  listClasses = rCl.data || [];
  $('exLop').innerHTML = '<option value="">-- Mọi lớp --</option>' + 
    listClasses.map(function (l) { return '<option value="' + l.id + '">' + l.name + '</option>'; }).join('');
    
  await taiDanhSachDe();
})();

async function taiDanhSachDe() {
  $('dsDeThi').innerHTML = '<div class="empty">Đang tải...</div>';
  var r = await sb.from('exams')
    .select('id, title, duration_minutes, opens_at, closes_at, published, classes(name), exam_questions(count)')
    .order('created_at', { ascending: false });
    
  listExams = r.data || [];
  if (!listExams.length) {
    $('dsDeThi').innerHTML = '<div class="empty card">Chưa có đề thi nào được tạo.</div>';
    return;
  }
  
  $('dsDeThi').innerHTML = listExams.map(function (e) {
    var classLabel = e.classes ? e.classes.name : 'Mọi lớp';
    var state = e.published ? '<span class="badge badge-ok">Đang mở</span>' : '<span class="badge badge-mute">Nháp</span>';
    var countQ = e.exam_questions && e.exam_questions[0] ? e.exam_questions[0].count : 0;
    
    return '<div class="card" style="padding:16px 20px; display:flex; justify-content:space-between; align-items:center; gap:12px; cursor:pointer" title="Bấm vào để xem và chỉnh sửa" onclick="loadExamForEdit(\'' + e.id + '\')">' +
      '<div>' +
        '<div style="display:flex; gap:8px; align-items:center">' +
          '<b style="font-size:1.05rem; color:var(--accent); text-decoration:underline">' + e.title + '</b>' +
          state +
        '</div>' +
        '<div style="font-size:.82rem; color:var(--ink-2); margin-top:4px">' +
          'Lớp: ' + classLabel + ' · Thời gian: ' + e.duration_minutes + ' phút · Số câu: ' + countQ +
        '</div>' +
      '</div>' +
      '<div style="display:flex; gap:8px; align-items:center">' +
        '<a href="luyen-de?exam_id=' + e.id + '" target="_blank" class="btn btn-secondary btn-sm" onclick="event.stopPropagation()">👁️ Xem kiểu HS</a>' +
        '<button class="btn btn-ghost btn-sm" style="color:var(--err)" onclick="event.stopPropagation(); xoaDeThi(\'' + e.id + '\')">Xoá</button>' +
      '</div>' +
      '</div>';
  }).join('');
}

async function xoaDeThi(id) {
  if (!confirm('Xóa đề thi này? Các câu hỏi đã tạo vẫn sẽ nằm trong ngân hàng câu hỏi nhưng đề thi sẽ biến mất.')) return;
  var r = await sb.from('exams').delete().eq('id', id);
  if (r.error) alert('Lỗi: ' + r.error.message);
  else await taiDanhSachDe();
}



function demoParseLaTeX() {
  var type = ($('exType') && $('exType').value) || 'mc';
  var essayPrompt = $('exEssayPrompt') ? $('exEssayPrompt').value.trim() : '';
  var rawMc = $('exLatex') ? $('exLatex').value.trim() : '';
  
  var html = '';
  var totalCountQ = 0;
  
  // 1. Render tự luận
  if ((type === 'essay' || type === 'combo') && essayPrompt) {
    var qs = parseLatexQuestions(essayPrompt);
    html += '<div style="margin-bottom: 20px; border: 2px solid var(--accent); border-radius: var(--r-md); padding: 16px; background: var(--surface);">';
    html += '<div style="font-size:0.95rem; font-weight:700; color:var(--accent); border-bottom:1px solid var(--line-2); padding-bottom:6px; margin-bottom:12px">📝 XEM TRƯỚC TỰ LUẬN</div>';
    if (qs && qs.length > 0) {
      html += qs.map(function (q, idx) {
        return '<div style="margin-bottom:12px; border-bottom:1px dashed var(--line-2); padding-bottom:12px">' +
          '<b>Câu ' + (idx + 1) + ':</b> ' + latexRaHTML(q.content_latex) +
          (q.solution_latex ? '<div class="q-preview-sol"><b>Lời giải:</b> ' + latexRaHTML(q.solution_latex) + '</div>' : '') +
          '</div>';
      }).join('');
    } else {
      html += '<div style="line-height:1.6; font-size:.95rem">' + latexRaHTML(essayPrompt) + '</div>';
    }
    html += '</div>';
  }
  
  // 2. Render trắc nghiệm
  parsedQuestions = [];
  if (type === 'mc' || type === 'combo') {
    parsedQuestions = parseLatexQuestions(rawMc);
    totalCountQ = parsedQuestions.length;
    if (parsedQuestions.length > 0) {
      html += '<div style="border: 2px solid var(--ok); border-radius: var(--r-md); padding: 16px; background: var(--surface);">';
      html += '<div style="font-size:0.95rem; font-weight:700; color:var(--ok); border-bottom:1px solid var(--line-2); padding-bottom:6px; margin-bottom:12px">📋 XEM TRƯỚC TRẮC NGHIỆM (' + parsedQuestions.length + ' câu)</div>';
      html += parsedQuestions.map(function (q, idx) {
        var typeText = "";
        var choicesHTML = "";
        
        var isTF = q.choices.length === 4 && q.choices[0].key === 'a';
        var isShort = q.choices.length === 1 && q.choices[0].key === 'short';
        
        if (isShort) {
          typeText = " (Trả lời ngắn)";
          choicesHTML = '<div class="q-preview-choice correct"><b>Đáp số đúng:</b> ' + latexRaHTML(q.choices[0].latex) + '</div>';
        } else if (isTF) {
          typeText = " (Đúng / Sai)";
          choicesHTML = q.choices.map(function (c) {
            var marker = c.correct ? '<span style="color:var(--ok);font-weight:bold">ĐÚNG</span>' : '<span style="color:var(--err);font-weight:bold">SAI</span>';
            return '<div class="q-preview-choice">' +
              '<b>' + c.key + ')</b> ' + latexRaHTML(c.latex) + ' &rarr; ' + marker +
              '</div>';
          }).join('');
        } else {
          typeText = " (Trắc nghiệm)";
          choicesHTML = q.choices.map(function (c) {
            var correctClass = c.correct ? ' correct' : '';
            return '<div class="q-preview-choice' + correctClass + '">' +
              '<b>' + c.key + '.</b> ' + latexRaHTML(c.latex) +
              '</div>';
          }).join('');
        }

        var solHTML = q.solution_latex
          ? '<div class="q-preview-sol"><b>Lời giải:</b> ' + latexRaHTML(q.solution_latex) + '</div>'
          : '';

        return '<div class="q-preview-card">' +
          '<div class="q-preview-title">Câu ' + (idx + 1) + typeText + '</div>' +
          '<div style="margin-bottom:10px">' + latexRaHTML(q.content_latex) + '</div>' +
          choicesHTML + solHTML +
          '</div>';
      }).join('');
      html += '</div>';
    } else {
      if (rawMc && !window.__liveParse) {
        alert('Không tìm thấy câu hỏi trắc nghiệm nào dạng \\begin{ex}...\\end{ex} hoặc \\begin{bt}...\\end{bt} trong đoạn code dán vào.');
      }
    }
  }
  
  if (html) {
    $('dsPreview').innerHTML = html;
    $('vungPreview').style.display = 'flex';
  } else {
    $('vungPreview').style.display = 'none';
  }
  
  // Cập nhật nhãn số lượng câu
  var textLabel = "";
  if (type === 'essay') textLabel = "Tự luận";
  else if (type === 'combo') textLabel = "Tự luận + " + totalCountQ + " câu TN";
  else textLabel = totalCountQ + " câu trắc nghiệm";
  $('previewCountLabel').textContent = textLabel;
  
  capNhatNutLuu();
  renderToanTrong($('dsPreview')); // vẽ công thức toán bằng KaTeX
}

// ===== BIÊN DỊCH TRỰC TIẾP: gõ tới đâu hiện xem trước tới đó =====
(function () {
  var ta = document.getElementById('exLatex');
  var ep = document.getElementById('exEssayPrompt');
  var hen;
  
  function chayLive() {
    clearTimeout(hen);
    hen = setTimeout(function () {
      window.__liveParse = true;
      try { demoParseLaTeX(); } catch (e) {}
      window.__liveParse = false;
    }, 350);
  }
  
  if (ta) ta.addEventListener('input', chayLive);
  if (ep) ep.addEventListener('input', chayLive);
})();

// Hình thức đề: ẩn/hiện ô tự luận và ô LaTeX
function capNhatHinhThucDe() {
  var type = ($('exType') && $('exType').value) || 'mc';
  if ($('wrapEssayPrompt')) $('wrapEssayPrompt').style.display = (type === 'essay' || type === 'combo') ? 'block' : 'none';
  if ($('wrapLatex')) $('wrapLatex').style.display = (type === 'mc' || type === 'combo') ? 'block' : 'none';
  demoParseLaTeX();
}

// Bật/tắt nút Lưu theo hình thức: tự luận cần đề bài; (kết hợp/trắc nghiệm) cần >=1 câu
function capNhatNutLuu() {
  if (!$('btnSave')) return;
  var type = ($('exType') && $('exType').value) || 'mc';
  var coTuLuan = $('exEssayPrompt') && $('exEssayPrompt').value.trim().length > 0;
  var ok;
  if (type === 'essay') ok = coTuLuan;
  else ok = parsedQuestions.length > 0; // mc & combo cần phần trắc nghiệm
  $('btnSave').disabled = !ok;
}

function escapeHTML(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

async function loadExamForEdit(examId) {
  window.scrollTo({ top: 0, behavior: 'smooth' });
  
  $('formTitle').textContent = '⏳ Đang tải đề thi...';
  
  try {
    var r = await sb.from('exams').select('*').eq('id', examId).single();
    if (r.error || !r.data) {
      alert('Không tìm thấy đề thi.');
      cancelEditExam();
      return;
    }
    var exam = r.data;
    
    editingExamId = exam.id;
    $('formTitle').textContent = '🛠️ Chỉnh sửa đề thi';
    $('btnSave').textContent = '💾 Cập nhật đề thi';
    $('btnCancelEdit').style.display = 'block';
    
    $('exTitle').value = exam.title || '';
    $('exLop').value = exam.class_id || '';
    $('exDuration').value = exam.duration_minutes || 90;
    
    $('exOpens').value = exam.opens_at ? new Date(new Date(exam.opens_at).getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0, 16) : '';
    $('exCloses').value = exam.closes_at ? new Date(new Date(exam.closes_at).getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0, 16) : '';
    
    $('exShuffle').checked = !!exam.shuffle;
    $('exPublished').checked = !!exam.published;
    if ($('exType')) $('exType').value = exam.de_type || 'mc';
    if ($('exEssayPrompt')) $('exEssayPrompt').value = exam.essay_prompt || '';
    capNhatHinhThucDe();

    var rQ = await sb.from('exam_questions')
      .select('sort, questions(id, content_latex, choices, solution_latex)')
      .eq('exam_id', examId)
      .order('sort');
      
    var questions = (rQ.data || []).map(function (eq) { return eq.questions; }).filter(Boolean);
    var latexArr = questions.map(function (q) {
      var env = 'ex';
      var choiceText = '';
      var isShort = q.choices && q.choices.length === 1 && q.choices[0].key === 'short';
      var isTF = q.choices && q.choices.length === 4 && q.choices[0].key === 'a';
      
      if (isShort) {
        env = 'bt';
      } else if (isTF) {
        env = 'ex';
        choiceText = '\n\\choiceTF\n' + q.choices.map(function (c) {
          var truePrefix = c.correct ? '\\True ' : '';
          return '  {' + truePrefix + c.key + ') ' + c.latex + '}';
        }).join('\n');
      } else if (q.choices && q.choices.length > 0) {
        env = 'ex';
        choiceText = '\n\\choice\n' + q.choices.map(function (c) {
          var truePrefix = c.correct ? '\\True ' : '';
          return '  {' + truePrefix + c.key + '. ' + c.latex + '}';
        }).join('\n');
      }
      
      var solText = q.solution_latex ? '\n\\loigiai{\n' + q.solution_latex + '\n}' : '';
      return '\\begin{' + env + '}\n' + q.content_latex + choiceText + solText + '\n\\end{' + env + '}';
    });
    
    $('exLatex').value = latexArr.join('\n\n');
    demoParseLaTeX();
  } catch (err) {
    alert('Lỗi tải đề thi: ' + err.message);
    cancelEditExam();
  }
}

function cancelEditExam() {
  editingExamId = null;
  $('formTitle').textContent = '🛠️ Tạo đề thi mới';
  $('btnSave').textContent = '💾 Lưu đề thi';
  $('btnCancelEdit').style.display = 'none';
  
  $('exTitle').value = '';
  $('exLop').value = '';
  $('exDuration').value = '90';
  $('exOpens').value = '';
  $('exCloses').value = '';
  $('exShuffle').checked = true;
  $('exPublished').checked = true;
  $('exLatex').value = '';
  if ($('exType')) $('exType').value = 'mc';
  if ($('exEssayPrompt')) $('exEssayPrompt').value = '';
  if (typeof capNhatHinhThucDe === 'function') capNhatHinhThucDe();
  $('vungPreview').style.display = 'none';
  parsedQuestions = [];
  $('btnSave').disabled = true;
}

function parseDateTime(str) {
  if (!str) return null;
  str = str.trim();
  var d = new Date(str);
  if (!isNaN(d.getTime())) return d.toISOString();

  var parts = str.split(/[\sT]+/);
  var datePart = '';
  var timePart = '00:00';
  
  parts.forEach(function (p) {
    if (p.includes('/')) datePart = p;
    else if (p.includes(':')) timePart = p;
  });

  if (datePart) {
    var dateSegments = datePart.split('/');
    if (dateSegments.length === 3) {
      var day = parseInt(dateSegments[0], 10);
      var month = parseInt(dateSegments[1], 10) - 1;
      var year = parseInt(dateSegments[2], 10);
      
      var timeSegments = timePart.split(':');
      var hours = parseInt(timeSegments[0], 10) || 0;
      var minutes = parseInt(timeSegments[1], 10) || 0;
      
      var parsedDate = new Date(year, month, day, hours, minutes, 0);
      if (!isNaN(parsedDate.getTime())) {
        return parsedDate.toISOString();
      }
    }
  }
  return null;
}

async function parseAndSaveExam(e) {
  e.preventDefault();
  var deType = ($('exType') && $('exType').value) || 'mc';
  var essayPrompt = $('exEssayPrompt') ? $('exEssayPrompt').value.trim() : '';
  if (deType !== 'essay' && !parsedQuestions.length) {
    alert('Vui lòng bấm "Phân tích đề" và kiểm tra phần trắc nghiệm trước khi lưu.');
    return;
  }
  if (deType === 'essay' && !essayPrompt) {
    alert('Vui lòng nhập đề bài phần tự luận trước khi lưu.');
    return;
  }

  var title = $('exTitle').value.trim();
  var duration = parseInt($('exDuration').value) || 90;
  var classId = $('exLop').value || null;
  var opens = $('exOpens').value ? parseDateTime($('exOpens').value) : null;
  var closes = $('exCloses').value ? parseDateTime($('exCloses').value) : null;
  var shuffle = $('exShuffle').checked;
  var published = $('exPublished').checked;
  
  var btn = $('btnSave');
  btn.disabled = true; btn.textContent = '⏳ Đang lưu đề thi...';
  
  try {
    var examId = editingExamId;
    
    if (editingExamId) {
      // 1. Cập nhật Đề thi trong bảng exams
      var rExam = await sb.from('exams').update({
        title: title,
        class_id: classId,
        duration_minutes: duration,
        opens_at: opens,
        closes_at: closes,
        shuffle: shuffle,
        published: published,
        de_type: deType,
        essay_prompt: essayPrompt || null
      }).eq('id', editingExamId);
      
      if (rExam.error) throw new Error(rExam.error.message);
      
      // 2. Xóa các câu hỏi cũ liên kết với đề thi này
      var rDel = await sb.from('exam_questions').delete().eq('exam_id', editingExamId);
      if (rDel.error) throw new Error('Lỗi dọn dẹp câu hỏi cũ: ' + rDel.error.message);
    } else {
      // 1. Tạo Đề thi mới trong bảng exams
      var rExam = await sb.from('exams').insert({
        title: title,
        class_id: classId,
        duration_minutes: duration,
        opens_at: opens,
        closes_at: closes,
        shuffle: shuffle,
        published: published,
        de_type: deType,
        essay_prompt: essayPrompt || null
      }).select('id').single();
      
      if (rExam.error) throw new Error(rExam.error.message);
      examId = rExam.data.id;
    }
    
    // 3. Lưu các câu hỏi mới vào bảng questions và liên kết
    for (var i = 0; i < parsedQuestions.length; i++) {
      var q = parsedQuestions[i];
      var sourceId = 'EX-' + Date.now().toString().slice(-6) + '-' + i;
      
      var rQ = await sb.from('questions').insert({
        source_id: sourceId,
        content_latex: q.content_latex,
        choices: q.choices,
        solution_latex: q.solution_latex || null,
        difficulty: 'TH'
      }).select('id').single();
      
      if (rQ.error) throw new Error('Lỗi lưu câu hỏi ' + (i+1) + ': ' + rQ.error.message);
      
      var rLink = await sb.from('exam_questions').insert({
        exam_id: examId,
        question_id: rQ.data.id,
        sort: i
      });
      if (rLink.error) throw new Error('Lỗi liên kết câu hỏi ' + (i+1) + ': ' + rLink.error.message);
    }
    
    alert('✓ ' + (editingExamId ? 'Cập nhật' : 'Lưu') + ' đề thi "' + title + '" thành công!');
    cancelEditExam();
    await taiDanhSachDe();
  } catch (err) {
    alert('Lỗi: ' + err.message);
  }
  btn.disabled = false; btn.textContent = editingExamId ? '💾 Cập nhật đề thi' : '💾 Lưu đề thi';
}
</script>
