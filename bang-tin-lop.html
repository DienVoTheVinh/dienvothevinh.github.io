body.theme-map { --accent:#1B2644; --accent-soft:#EAEFF6; }

<script>
/* ===== render markdown (rút gọn từ trình blog) ===== */
function blogEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderBlog(src){
  src = String(src || '');
  var math = [];
  src = src.replace(/\$\$([\s\S]+?)\$\$/g, function(m){ math.push(m); return '___MATH_'+(math.length-1)+'___'; });
  src = src.replace(/\\\[([\s\S]+?)\\\]/g, function(m){ math.push(m); return '___MATH_'+(math.length-1)+'___'; });
  src = src.replace(/\$([^\$\n]+?)\$/g, function(m){ math.push(m); return '___MATH_'+(math.length-1)+'___'; });
  src = src.replace(/\\\(([\s\S]+?)\\\)/g, function(m){ math.push(m); return '___MATH_'+(math.length-1)+'___'; });
  function inline(t){
    t = blogEsc(t);
    t = t.replace(/!\[([^\]]*)\]\((https?:[^)\s]+)\)/g, '<img src="$2" alt="$1" loading="lazy">');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    t = t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return t;
  }
  var lines = src.split(/\r?\n/), html='', para=[], inUl=false, inOl=false;
  function flushPara(){ if(para.length){ html += '<p>'+inline(para.join(' '))+'</p>'; para=[]; } }
  function closeLists(){ if(inUl){ html+='</ul>'; inUl=false; } if(inOl){ html+='</ol>'; inOl=false; } }
  lines.forEach(function(ln){
    var t = ln.trim();
    if(t===''){ flushPara(); closeLists(); return; }
    var img = t.match(/^!\[([^\]]*)\]\((https?:[^)\s]+)\)$/);
    if(img){ flushPara(); closeLists(); html += '<figure><img src="'+img[2]+'" alt="'+blogEsc(img[1])+'" loading="lazy">'+(img[1]?'<figcaption>'+blogEsc(img[1])+'</figcaption>':'')+'</figure>'; return; }
    var hm = t.match(/^(#{1,4})\s+(.*)$/);
    if(hm){ flushPara(); closeLists(); var lvl=hm[1].length; html += '<h'+lvl+'>'+inline(hm[2])+'</h'+lvl+'>'; return; }
    if(/^(---|\*\*\*|___)$/.test(t)){ flushPara(); closeLists(); html+='<hr>'; return; }
    if(/^>\s?/.test(t)){ flushPara(); closeLists(); html += '<blockquote>'+inline(t.replace(/^>\s?/,''))+'</blockquote>'; return; }
    var um = t.match(/^[-*]\s+(.*)$/);
    if(um){ flushPara(); if(inOl){html+='</ol>';inOl=false;} if(!inUl){html+='<ul>';inUl=true;} html+='<li>'+inline(um[1])+'</li>'; return; }
    var om = t.match(/^\d+\.\s+(.*)$/);
    if(om){ flushPara(); if(inUl){html+='</ul>';inUl=false;} if(!inOl){html+='<ol>';inOl=true;} html+='<li>'+inline(om[1])+'</li>'; return; }
    para.push(t);
  });
  flushPara(); closeLists();
  html = html.replace(/___MATH_(\d+)___/g, function(_,i){ return math[+i]; });
  return html;
}

var me=null, classInfo=null, classId=null, canManage=false, coverUrl='';
var postsCache=[], reactMap={}, myReacts={}, cmtMap={};

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function initials(name){ var p=String(name||'?').trim().split(/\s+/); return (p[p.length-1]||'?').charAt(0).toUpperCase(); }

(async function(){
  var params = new URLSearchParams(location.search);
  classId = params.get('classId') || params.get('class') || '';
  if(!classId){ location.href='lop-hoc'; return; }
  if(!daKetNoi()){ alert('Chưa kết nối Supabase.'); return; }
  me = await yeuCauDangNhap();
  if(!me) return;

  var rc = await sb.from('classes').select('id, name, theme, teacher_id, co_teacher_id, grade, is_specialized').eq('id', classId).single();
  if(rc.error || !rc.data){ $('btDeny').style.display='block'; return; }
  classInfo = rc.data;

  canManage = me.role==='admin' || classInfo.teacher_id===me.id || classInfo.co_teacher_id===me.id;
  apDungTheme();

  $('btWrap').style.display='block';
  $('heroTitle').textContent = 'Bảng tin · ' + classInfo.name;
  $('heroSub').textContent = 'Nơi thầy đăng thông báo, nội quy và những điều quan trọng cho lớp.';
  // link quay lại phù hợp vai trò
  $('btBack').href = canManage ? ('quan-tri-lop?classId='+classId) : 'lop-hoc';

  if(canManage){ $('composer').style.display='block'; }
  $('postBody').addEventListener('input', function(){ /* no live preview panel */ });
  $('fileChen').addEventListener('change', function(e){ if(e.target.files[0]) chenAnh(e.target.files[0]); e.target.value=''; });
  $('fileBia').addEventListener('change', function(e){ if(e.target.files[0]) taiAnhBia(e.target.files[0]); e.target.value=''; });

  await taiTatCa();
})();

function apDungTheme(){
  var theme = classInfo.theme || 'vinhmath';
  var isMap = theme === 'map';
  var isDM = theme === 'duyminh';
  if (typeof vmApDungThuongHieu === 'function') vmApDungThuongHieu(theme);
  var heroLogo = $('heroLogo'), navLogo = $('navLogo'), navSub = $('navSub'), heroBrand = $('heroBrand');
  if(isMap){
    document.body.classList.add('theme-map');
    if(heroLogo) heroLogo.src = 'logo/CLB-MAP-logo.png';
    if(navLogo) navLogo.src = 'logo/CLB-MAP-logo.png';
    if(navSub) navSub.textContent = '· CLB M.A.P';
    if(heroBrand) heroBrand.textContent = '⭐ CLB M.A.P · Math And Passion';
    document.title = 'Bảng tin lớp — CLB M.A.P';
  } else if(isDM){
    document.body.classList.add('theme-duyminh');
    if(heroLogo) heroLogo.src = 'logo/duyminh-logo.png';
    if(navLogo) navLogo.src = 'logo/duyminh-logo.png';
    if(navSub) navSub.textContent = '· Duy Minh';
    if(heroBrand) heroBrand.innerHTML = '🔴 Trung tâm <span class="dm-mark"><span class="dm-duy">DUY</span><span class="dm-minh">MINH</span></span>';
    document.title = 'Bảng tin lớp — Duy Minh';
  } else {
    if(heroLogo) heroLogo.src = 'logo/VinhMath_logo.png';
    if(heroBrand) heroBrand.textContent = '📘 VinhMath';
  }
}

async function taiTatCa(){
  var box = $('dsBai');
  box.innerHTML = '<div class="bt-empty">Đang tải bảng tin…</div>';
  var rp = await sb.from('class_posts').select('*').eq('class_id', classId).order('pinned',{ascending:false}).order('created_at',{ascending:false});
  if(rp.error){ box.innerHTML='<div class="bt-empty">Lỗi tải bảng tin: '+esc(rp.error.message)+'</div>'; return; }
  postsCache = rp.data || [];

  reactMap={}; myReacts={}; cmtMap={};
  var rr = await sb.from('class_post_reactions').select('post_id, user_id').eq('class_id', classId);
  (rr.data||[]).forEach(function(x){ reactMap[x.post_id]=(reactMap[x.post_id]||0)+1; if(x.user_id===me.id) myReacts[x.post_id]=true; });
  var rcm = await sb.from('class_post_comments').select('id, post_id, author_id, author_name, body, created_at').eq('class_id', classId).order('created_at',{ascending:true});
  (rcm.data||[]).forEach(function(c){ (cmtMap[c.post_id]=cmtMap[c.post_id]||[]).push(c); });

  veDanhSach();
}

function veDanhSach(){
  var box=$('dsBai');
  if(!postsCache.length){ box.innerHTML='<div class="bt-empty">📭 Chưa có thông báo nào'+(canManage?'. Hãy đăng bài đầu tiên phía trên!':' cho lớp này.')+'</div>'; return; }
  box.innerHTML = postsCache.map(veMotBai).join('');
  if(window.MathJax && window.MathJax.typesetPromise){ window.MathJax.typesetPromise([box]); }
}

function veMotBai(p){
  var ngay = new Date(p.created_at).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  var likes = reactMap[p.id]||0;
  var liked = !!myReacts[p.id];
  var cmts = cmtMap[p.id]||[];
  var cover = p.cover_url ? '<img class="cover" src="'+esc(p.cover_url)+'" alt="">' : '';
  var pin = p.pinned ? '<span class="pin">📌 Ghim</span>' : '';
  var adminBtns = canManage ? '<div class="bt-admin">'+
      '<button onclick="ghim(\''+p.id+'\','+(p.pinned?'false':'true')+')">'+(p.pinned?'Bỏ ghim':'📌 Ghim')+'</button>'+
      '<button onclick="suaBai(\''+p.id+'\')">✏️ Sửa</button>'+
      '<button onclick="xoaBai(\''+p.id+'\')" style="color:var(--err,#e74c3c)">🗑 Xoá</button>'+
    '</div>' : '';
  var cmtHtml = cmts.map(function(c){
    var canDel = canManage || c.author_id===me.id;
    return '<div class="bt-cmt"><div class="av">'+esc(initials(c.author_name))+'</div>'+
      '<div class="bub"><div class="n">'+esc(c.author_name||'Ẩn danh')+'<small>'+new Date(c.created_at).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</small></div>'+
      '<div class="c">'+esc(c.body)+'</div></div>'+
      (canDel?'<button class="del" onclick="xoaBinhLuan(\''+c.id+'\')">Xoá</button>':'')+'</div>';
  }).join('');
  return '<article class="bt-post" id="post-'+p.id+'">'+ cover +
    '<div class="pad">'+
      '<div class="meta">'+pin+'<span class="who">'+esc(p.author_name||'Giáo viên')+'</span> · <span>'+ngay+'</span></div>'+
      '<h2 class="title">'+esc(p.title)+'</h2>'+
      '<div class="article">'+renderBlog(p.body||'')+'</div>'+
      '<div class="bt-bar">'+
        '<button class="bt-like'+(liked?' on':'')+'" id="like-'+p.id+'" onclick="thaTim(\''+p.id+'\')">'+(liked?'❤️':'🤍')+' <span id="likec-'+p.id+'">'+likes+'</span></button>'+
        '<button class="bt-cmttoggle" onclick="moBinhLuan(\''+p.id+'\')">💬 <span>'+cmts.length+'</span> bình luận</button>'+
        adminBtns+
      '</div>'+
      '<div class="bt-cmts" id="cmts-'+p.id+'">'+
        '<div id="cmtlist-'+p.id+'">'+cmtHtml+'</div>'+
        '<div class="bt-cmtform"><input id="cmtin-'+p.id+'" placeholder="Viết bình luận…" onkeydown="if(event.key===\'Enter\')guiBinhLuan(\''+p.id+'\')"><button class="btn btn-primary btn-sm" onclick="guiBinhLuan(\''+p.id+'\')">Gửi</button></div>'+
      '</div>'+
    '</div></article>';
}

function moBinhLuan(id){ var el=$('cmts-'+id); if(el) el.classList.toggle('open'); }

async function thaTim(id){
  var liked = !!myReacts[id];
  var btn=$('like-'+id), cnt=$('likec-'+id);
  // cập nhật lạc quan
  myReacts[id]=!liked;
  reactMap[id]=(reactMap[id]||0)+(liked?-1:1);
  if(cnt) cnt.textContent = reactMap[id];
  if(btn){ btn.classList.toggle('on',!liked); btn.firstChild.textContent = (!liked?'❤️':'🤍')+' '; }
  if(liked){
    var r = await sb.from('class_post_reactions').delete().eq('post_id',id).eq('user_id',me.id);
    if(r.error){ alert('Lỗi: '+r.error.message); await taiTatCa(); }
  } else {
    var r2 = await sb.from('class_post_reactions').insert({ post_id:id, class_id:classId, user_id:me.id });
    if(r2.error){ alert('Lỗi: '+r2.error.message); await taiTatCa(); }
  }
}

async function guiBinhLuan(id){
  var inp=$('cmtin-'+id); if(!inp) return;
  var body=inp.value.trim(); if(!body) return;
  inp.disabled=true;
  var rec={ post_id:id, class_id:classId, author_id:me.id, author_name:(me.full_name||'Ẩn danh'), body:body };
  var r = await sb.from('class_post_comments').insert(rec).select('id, post_id, author_id, author_name, body, created_at').single();
  inp.disabled=false;
  if(r.error){ alert('Lỗi gửi bình luận: '+r.error.message); return; }
  (cmtMap[id]=cmtMap[id]||[]).push(r.data);
  inp.value='';
  // vẽ lại danh sách bình luận của bài, giữ mở
  var list=$('cmtlist-'+id);
  if(list){
    list.insertAdjacentHTML('beforeend',
      '<div class="bt-cmt"><div class="av">'+esc(initials(r.data.author_name))+'</div>'+
      '<div class="bub"><div class="n">'+esc(r.data.author_name)+'<small>vừa xong</small></div><div class="c">'+esc(r.data.body)+'</div></div>'+
      (true?'<button class="del" onclick="xoaBinhLuan(\''+r.data.id+'\')">Xoá</button>':'')+'</div>');
  }
}

async function xoaBinhLuan(cid){
  if(!confirm('Xoá bình luận này?')) return;
  var r = await sb.from('class_post_comments').delete().eq('id',cid);
  if(r.error){ alert('Lỗi xoá: '+r.error.message); return; }
  await taiTatCa();
}

/* ===== Composer ===== */
function toggleComposer(){ $('composer').classList.toggle('open'); }
function chen(before, after, ph){
  var ta=$('postBody'); var s=ta.selectionStart,e=ta.selectionEnd;
  var sel=ta.value.substring(s,e)||(ph||'');
  ta.value=ta.value.substring(0,s)+before+sel+after+ta.value.substring(e);
  ta.focus(); ta.selectionStart=s+before.length; ta.selectionEnd=s+before.length+sel.length;
}
function chonAnhChen(){ $('fileChen').click(); }
function chonAnhBia(){ $('fileBia').click(); }
function tenFileAn(name){ return Date.now()+'-'+String(name).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9.\-]+/g,'-').toLowerCase(); }
async function uploadAnh(file){
  var path='bang-tin/'+tenFileAn(file.name);
  var up=await sb.storage.from('hinh-anh').upload(path,file,{contentType:file.type||'image/jpeg',upsert:false});
  if(up.error) throw new Error(up.error.message);
  return sb.storage.from('hinh-anh').getPublicUrl(path).data.publicUrl;
}
async function chenAnh(file){
  var st=$('upStatus'); st.textContent='⏳ Đang tải ảnh…';
  try{ var url=await uploadAnh(file); chen('\n![]('+url+')\n','',''); st.textContent='✓ Đã chèn ảnh.'; setTimeout(function(){st.textContent='';},2000);}catch(e){ st.textContent='❌ '+e.message; }
}
async function taiAnhBia(file){
  var st=$('upStatus'); st.textContent='⏳ Đang tải ảnh bìa…';
  try{ var url=await uploadAnh(file); coverUrl=url; veAnhBia(); st.textContent='✓ Đã đặt ảnh bìa.'; setTimeout(function(){st.textContent='';},2000);}catch(e){ st.textContent='❌ '+e.message; }
}
function veAnhBia(){
  var box=$('coverBox');
  if(coverUrl){ box.classList.add('has'); $('coverPlaceholder').style.display='none'; var im=$('coverImg'); im.src=coverUrl; im.style.display='block'; $('coverRm').style.display='block'; }
  else { box.classList.remove('has'); $('coverPlaceholder').style.display='block'; $('coverImg').style.display='none'; $('coverRm').style.display='none'; }
}
function xoaAnhBia(ev){ ev.stopPropagation(); coverUrl=''; veAnhBia(); }
function huySua(){ $('postId').value=''; $('postTitle').value=''; $('postBody').value=''; coverUrl=''; veAnhBia(); $('btnHuySua').style.display='none'; $('composerTitle').textContent='Đăng thông báo mới'; $('btnDang').textContent='🚀 Đăng bài'; }
function suaBai(id){
  var p = postsCache.find(function(x){return x.id===id;}); if(!p) return;
  $('postId').value=p.id; $('postTitle').value=p.title||''; $('postBody').value=p.body||'';
  coverUrl=p.cover_url||''; veAnhBia();
  $('composer').classList.add('open'); $('btnHuySua').style.display='inline-flex';
  $('composerTitle').textContent='Sửa thông báo'; $('btnDang').textContent='💾 Lưu thay đổi';
  window.scrollTo({top:0,behavior:'smooth'});
}
async function dangBai(){
  var id=$('postId').value;
  var title=$('postTitle').value.trim();
  var body=$('postBody').value;
  if(!title){ alert('Nhập tiêu đề thông báo trước nhé.'); return; }
  if(!body.trim()){ alert('Nội dung đang trống.'); return; }
  var btn=$('btnDang'); var old=btn.textContent; btn.disabled=true; btn.textContent='⏳ Đang lưu…';
  var rec={ class_id:classId, author_id:me.id, author_name:(me.full_name||'Giáo viên'), title:title, body:body, cover_url:coverUrl||null, updated_at:new Date().toISOString() };
  var r;
  if(id){ r=await sb.from('class_posts').update(rec).eq('id',id); }
  else { r=await sb.from('class_posts').insert(rec); }
  btn.disabled=false; btn.textContent=old;
  if(r.error){ alert('Lỗi đăng bài: '+r.error.message); return; }
  huySua();
  $('composer').classList.remove('open');
  await taiTatCa();
}
async function ghim(id, val){
  var r=await sb.from('class_posts').update({pinned:val}).eq('id',id);
  if(r.error){ alert('Lỗi: '+r.error.message); return; }
  await taiTatCa();
}
async function xoaBai(id){
  if(!confirm('Xoá hẳn thông báo này? Bình luận & lượt tim cũng sẽ mất.')) return;
  var r=await sb.from('class_posts').delete().eq('id',id);
  if(r.error){ alert('Lỗi xoá: '+r.error.message); return; }
  await taiTatCa();
}
</script>
</body>
</html>
