<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#9e6100">
  <title>VinhMath - Đang ngoại tuyến</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#faf8f5,#eee3cf);font-family:"Be Vietnam Pro",system-ui,sans-serif;color:#1a1a1a}.box{width:min(100%,520px);padding:32px;border:1px solid rgba(122,77,0,.2);border-radius:20px;background:rgba(255,255,255,.88);box-shadow:0 18px 50px rgba(75,45,0,.12);text-align:center}.mark{width:82px;height:82px;margin:0 auto 18px;display:grid;place-items:center;border-radius:22px;background:#fff;border:2px solid #9e6100;color:#7a4d00;font-family:Georgia,serif;font-size:28px;font-weight:700}h1{margin:0 0 10px;font-family:Georgia,serif;font-size:1.7rem;color:#704400}p{margin:0 0 22px;line-height:1.65;color:#555}button{min-height:44px;padding:10px 20px;border:0;border-radius:10px;background:linear-gradient(135deg,#9e6100,#613d00);color:#fff;font:700 .95rem inherit;cursor:pointer}
  </style>
</head>
<body>
  <main class="box">
    <div class="mark" aria-hidden="true">VM</div>
    <h1>Mất kết nối Internet</h1>
    <p>VinhMath vẫn được mở như một ứng dụng. Hãy kiểm tra Wi-Fi hoặc 4G/5G, sau đó thử tải lại trang.</p>
    <button type="button" onclick="location.reload()">Thử kết nối lại</button>
  </main>
</body>
</html>
