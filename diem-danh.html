<!DOCTYPE html>
<html lang="vi">
<head>
<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="/icons/vinhmath-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#9e6100">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Điểm danh — VinhMath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=8.4">
<link rel="stylesheet" href="css/vinhmath.css?v=8.4">
<style>
body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.box { max-width: 420px; width: 100%; text-align: center; padding: 40px 28px; }
.box .ic { font-size: 4rem; margin-bottom: 12px; }
.box h1 { font-size: 1.4rem; margin-bottom: 8px; }
.box p { font-size: .95rem; }
</style>
</head>
<body>

<div class="card box">
  <div class="ic" id="bieuTuong">⏳</div>
  <h1 id="tieuDe">Đang điểm danh…</h1>
  <p id="noiDung">Chờ một chút nhé.</p>
  <a class="btn btn-primary" href="lop-hoc" style="margin-top:20px">← Về Lớp học</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/vinhmath.js?v=9.5"></script>
<script src="js/analytics.js"></script>
<script>
function ketQua(ic, tieuDe, noiDung) {
  $('bieuTuong').textContent = ic;
  $('tieuDe').textContent = tieuDe;
  $('noiDung').innerHTML = noiDung;
}

(async function () {
  if (!daKetNoi()) { ketQua('⚠️', 'Chưa kết nối', 'Hệ thống chưa sẵn sàng.'); return; }
  var hoSo = await yeuCauDangNhap(); // chưa đăng nhập → tự chuyển về trang đăng nhập
  if (!hoSo) return;

  var token = new URLSearchParams(window.location.search).get('token');
  if (!token) { ketQua('❓', 'Thiếu mã', 'Đường link điểm danh không có mã. Em quét lại QR nhé.'); return; }

  var classIds = (hoSo.class_students || []).map(function (c) { return c.class_id; });
  if (classIds.length === 0) {
    ketQua('🚫', 'Chưa xếp lớp', 'Tài khoản của em chưa được kích hoạt lớp học.');
    return;
  }

  var r;
  if (token.length <= 6) {
    // Học sinh nhập mã số bằng tay (vd: "4829")
    r = await sb.from('class_sessions')
      .select('id, title, held_on, qr_expires, attendance_open')
      .in('class_id', classIds)
      .eq('checkin_code', token)
      .eq('attendance_open', true)
      .maybeSingle();
  } else {
    // Học sinh quét mã QR
    r = await sb.from('class_sessions')
      .select('id, title, held_on, qr_expires, attendance_open')
      .eq('qr_token', token)
      .eq('attendance_open', true)
      .maybeSingle();
  }

  if (!r.data) {
    ketQua('🚫', 'Chưa mở điểm danh', 'Thầy chưa mở điểm danh, mã đã hết hạn hoặc không thuộc lớp của em. Em chờ thầy mở nhé!');
    return;
  }
  var buoi = r.data;
  if (buoi.qr_expires && new Date(buoi.qr_expires) < new Date()) {
    ketQua('⌛', 'Mã đã hết hạn', 'Mã điểm danh của buổi <b>' + buoi.title + '</b> đã hết hiệu lực. Em báo thầy mở lại nhé.');
    return;
  }

  // Ghi điểm danh
  var ins = await sb.from('attendance').insert({ session_id: buoi.id, student_id: hoSo.id });
  if (ins.error) {
    if ((ins.error.code || '') === '23505' || /duplicate/i.test(ins.error.message)) {
      ketQua('✅', 'Em đã điểm danh rồi!', 'Buổi <b>' + buoi.title + '</b> đã ghi nhận em từ trước. Yên tâm học tiếp nhé.');
    } else {
      ketQua('⚠️', 'Có lỗi xảy ra', ins.error.message);
    }
    return;
  }
  ketQua('🎉', 'Điểm danh thành công!', 'Chào mừng <b>' + hoSo.full_name + '</b> đến với buổi <b>' + buoi.title + '</b>.');
})();
</script>
</body>
</html>
