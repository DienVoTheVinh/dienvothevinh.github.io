<!doctype html>
<html lang="vi" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#d89200"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/vinhmath-192.png"><title>Cổng thi thử</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="css/tokens.css?v=8.3"><link rel="stylesheet" href="css/vinhmath.css?v=8.1"><link rel="stylesheet" href="css/exam-portal.css?v=1"></head>
<body class="portal-page">
<header class="portal-topbar"><div class="portal-topbar-inner"><a class="portal-logo" href="thi" id="portalHome"><img id="portalLogo" src="img/logo.png" alt=""><span class="portal-logo-copy"><b id="portalShortName">Cổng thi thử</b><span id="portalBrandLine">Khu vực khảo thí riêng</span></span></a><nav class="portal-nav" aria-label="Cổng thi"><button data-view="exams" onclick="vmPortalView('exams')">Kỳ thi</button><button data-view="results" onclick="vmPortalView('results')">Kết quả</button><button data-view="manage" id="portalManageTab" onclick="vmPortalView('manage')" hidden>Quản lý</button></nav><button class="btn btn-ghost btn-sm" onclick="vmDoiTheme()" aria-label="Đổi chế độ sáng tối">☼</button><button class="btn btn-secondary btn-sm" onclick="dangXuat()">Đăng xuất</button></div></header>
<main class="portal-shell">
  <section class="portal-hero"><div><div class="portal-kicker">Khu vực khảo thí riêng</div><h1 id="portalName">Đang tải cổng thi…</h1><p id="portalDescription">Vui lòng chờ trong giây lát.</p></div><div class="portal-identity"><span>Đăng nhập:</span><strong id="portalUser">—</strong></div></section>
  <div class="portal-stats" id="portalStats"><div class="card portal-stat"><b id="portalOpenCount">—</b><span>Kỳ thi đang mở</span></div><div class="card portal-stat"><b id="portalDoneCount">—</b><span>Đã hoàn thành</span></div><div class="card portal-stat"><b id="portalBestScore">—</b><span>Điểm tốt nhất</span></div></div>
  <section class="portal-panel" id="portalPanelExams"><div class="portal-section-head"><h2>Kỳ thi của em</h2><span class="portal-chip" id="portalNow"></span></div><div class="portal-exams" id="portalExamList"><div class="card portal-empty"><div class="spinner" style="margin:0 auto 12px"></div>Đang tải danh sách kỳ thi…</div></div></section>
  <section class="portal-panel" id="portalPanelResults" hidden><div class="portal-section-head"><h2>Kết quả của em</h2></div><div id="portalResultList" class="portal-table-wrap"></div></section>
  <section class="portal-panel" id="portalPanelManage" hidden><div class="portal-section-head"><h2>Tổng quan portal</h2><a class="btn btn-primary btn-sm" href="quan-tri-portal-thi" id="portalAdminLink" hidden>Mở cấu hình nâng cao</a></div><div id="portalManageContent"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="js/config.js"></script><script src="js/vinhmath.js?v=8.3"></script><script src="js/exam-portal.js?v=1"></script>
</body></html>
