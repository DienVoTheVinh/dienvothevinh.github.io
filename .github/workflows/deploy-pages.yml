name: Deploy VinhMath to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vinhmath-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare production artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          shopt -s nullglob
          for file in *.html *.css *.js *.json *.xml *.webmanifest *.txt *.png *.jpg *.jpeg *.svg *.ico *.sty CNAME; do
            cp "$file" _site/
          done
          for dir in assets css icons img js logo; do
            if [ -d "$dir" ]; then
              cp -R "$dir" "_site/$dir"
            fi
          done
          touch _site/.nojekyll
          du -sh _site
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
