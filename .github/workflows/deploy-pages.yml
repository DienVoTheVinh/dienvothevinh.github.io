name: Deploy VinhMath to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vinhmath-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up security regression runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check security boundaries before publishing
        run: |
          node scripts/check_secret_indicators.js
          node scripts/test_anonymous_security_hardening.cjs
          node scripts/test_admin_password_reset.js
          node scripts/test_student_initial_password.cjs
          node scripts/test_notification_helper_security.cjs
          node scripts/test_admin_account_scope.js
          node scripts/test_admin_bulk_accounts.js
          node scripts/test_managed_account_creation_repair.js
          node scripts/test_profiles_privilege_hardening_sql.js
          node scripts/test_auth_role_claim_hardening.js
          node scripts/test_teacher_services.js
          node scripts/test_teacher_email_verification.cjs
      - name: Check administrator and PDF rendering in an isolated browser
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx --no-install playwright install --with-deps chromium
          node scripts/test_admin_profile_rendering_browser.cjs
          node scripts/test_account_services_form_browser.cjs
          node scripts/test_teacher_email_browser.cjs
          node scripts/test_lesson_pdf_layout_browser.cjs
          node -e "process.env.VM_CHROME_PATH=require('playwright').chromium.executablePath(); require('./scripts/test_notification_menu_security_browser.js')"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare production artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          shopt -s nullglob
          for file in *.html *.css *.js *.json *.xml *.webmanifest *.txt *.png *.jpg *.jpeg *.svg *.ico *.sty CNAME; do
            cp "$file" _site/
          done
          # LaTeX fragments are compiled in the browser after these shared
          # structure files are fetched. Keep both directories in production.
          for dir in assets bia13 cautruc13 css icons img js logo vmtools; do
            if [ -d "$dir" ]; then
              cp -R "$dir" "_site/$dir"
            fi
          done
          rm -f _site/img/math_learning_methods.png _site/img/vinhmath_platform.png
          touch _site/.nojekyll
      - name: Optimize production images
        shell: bash
        run: |
          if ! command -v mogrify >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi
          for dir in _site/assets _site/img _site/logo; do
            if [ -d "$dir" ]; then
              while IFS= read -r -d '' image; do
                mogrify -auto-orient -resize '1280x1280>' -strip -quality 72 "$image"
              done < <(find "$dir" -type f -iname '*.jpg' -print0)
              while IFS= read -r -d '' image; do
                mogrify -auto-orient -resize '1280x1280>' -strip -quality 72 "$image"
              done < <(find "$dir" -type f -iname '*.jpeg' -print0)
              while IFS= read -r -d '' image; do
                mogrify -resize '1024x1024>' -colors 256 -depth 8 -strip -define png:compression-level=9 "$image"
              done < <(find "$dir" -type f -iname '*.png' -print0)
            fi
          done
          du -sh _site
          find _site -type f -exec du -h {} + | sort -hr | head -20
      - name: Verify runtime LaTeX assets
        shell: bash
        run: |
          test -s _site/cautruc13/mausac-minimal.tex
          test -s _site/cautruc13/Khai-bao-minimal.tex
          test -s _site/cautruc13/BosungK.tex
          test -s _site/cautruc13/LT-3.tex
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
