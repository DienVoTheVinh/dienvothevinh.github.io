name: Deploy VinhMath to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vinhmath-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare production artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          find . -maxdepth 1 -type f \
            ( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.json' \
               -o -name '*.xml' -o -name '*.webmanifest' -o -name '*.txt' \
               -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.svg' \
               -o -name '*.ico' -o -name '*.sty' -o -name 'CNAME' \
            ) -exec cp '{}' _site/ ;
          for dir in assets css icons img js logo; do
            if [ -d "$dir" ]; then
              cp -R "$dir" "_site/$dir"
            fi
          done
          touch _site/.nojekyll
          du -sh _site
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
