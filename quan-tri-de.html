textarea.code { width: 100%; min-height: 360px; resize: vertical; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: .85rem; line-height: 1.5; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 14px; }
textarea.code:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.q-preview-title { font-weight: 700; margin-bottom: 8px; font-size: .95rem; }
.q-preview-choice { padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); margin-bottom: 6px; font-size: .88rem; }
.q-preview-choice.correct { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.q-preview-sol { margin-top: 10px; padding: 10px; background: var(--surface-2); border-left: 3px solid var(--accent); border-radius: 4px; font-size: .85rem; }
.empty { text-align: center; padding: 48px 24px; color: var(--ink-3); }

    </div>
  </div>

    <!-- Cột trái: Form tạo đề & Soạn LaTeX -->

      <form onsubmit="parseAndSaveExam(event)">

          <div class="switch-container">
            <input type="checkbox" id="exPublished" checked>
            <label for="exPublished" style="margin:0; font-weight:600">Xuất bản đề</label>

        </div>
        
        <div class="field">
          <label>Nội dung đề LaTeX (ex_test format) <b style="color:var(--accent)">*</b></label>

        <div style="display:flex; gap:12px; margin-top:20px">
          <button type="button" class="btn btn-secondary" onclick="demoParseLaTeX()" style="flex:1">🔍 Phân tích đề</button>

    <!-- Cột phải: Xem thử & Danh sách đề hiện tại -->

        <div id="dsPreview" style="max-height: 480px; overflow-y: auto; padding-right: 6px"></div>
      </div>

        <h3 style="margin-bottom:12px">📋 Danh sách đề thi đã tạo</h3>
        <div id="dsDeThi" style="display:flex; flex-direction:column; gap:12px">
          <div class="empty card">Đang tải đề thi...</div>
        </div>
      </div>
    </div>

var listExams = [];
var listClasses = [];
var parsedQuestions = [];
var editingExamId = null;

(async function () {
  if (!daKetNoi()) return;
  var hoSo = await yeuCauDangNhap();
  if (!hoSo) return;
  if (!['admin', 'teacher'].includes(hoSo.role)) {
    window.location.href = 'luyen-de.html';
    return;
  }
  
  // Tải lớp
  var rCl = await sb.from('classes').select('id, name').order('name');
  listClasses = rCl.data || [];
  $('exLop').innerHTML = '<option value="">-- Mọi lớp --</option>' + 
    listClasses.map(function (l) { return '<option value="' + l.id + '">' + l.name + '</option>'; }).join('');
    
  await taiDanhSachDe();
})();

async function taiDanhSachDe() {
  $('dsDeThi').innerHTML = '<div class="empty">Đang tải...</div>';
  var r = await sb.from('exams')
    .select('id, title, duration_minutes, opens_at, closes_at, published, classes(name), exam_questions(count)')
    .order('created_at', { ascending: false });
    
  listExams = r.data || [];
  if (!listExams.length) {
    $('dsDeThi').innerHTML = '<div class="empty card">Chưa có đề thi nào được tạo.</div>';
    return;
  }
  
  $('dsDeThi').innerHTML = listExams.map(function (e) {
    var classLabel = e.classes ? e.classes.name : 'Mọi lớp';
    var state = e.published ? '<span class="badge badge-ok">Đang mở</span>' : '<span class="badge badge-mute">Nháp</span>';
    var countQ = e.exam_questions && e.exam_questions[0] ? e.exam_questions[0].count : 0;
    
    return '<div class="card" style="padding:16px 20px; display:flex; justify-content:space-between; align-items:center; gap:12px; cursor:pointer" title="Bấm vào để xem và chỉnh sửa" onclick="loadExamForEdit(\'' + e.id + '\')">' +
      '<div>' +
        '<div style="display:flex; gap:8px; align-items:center">' +
          '<b style="font-size:1.05rem; color:var(--accent); text-decoration:underline">' + e.title + '</b>' +
          state +
        '</div>' +
        '<div style="font-size:.82rem; color:var(--ink-2); margin-top:4px">' +
          'Lớp: ' + classLabel + ' · Thời gian: ' + e.duration_minutes + ' phút · Số câu: ' + countQ +
        '</div>' +
      '</div>' +
      '<div>' +
        '<button class="btn btn-ghost btn-sm" style="color:var(--err)" onclick="event.stopPropagation(); xoaDeThi(\'' + e.id + '\')">Xoá</button>' +
      '</div>' +
      '</div>';
  }).join('');
}

async function xoaDeThi(id) {
  if (!confirm('Xóa đề thi này? Các câu hỏi đã tạo vẫn sẽ nằm trong ngân hàng câu hỏi nhưng đề thi sẽ biến mất.')) return;
  var r = await sb.from('exams').delete().eq('id', id);
  if (r.error) alert('Lỗi: ' + r.error.message);
  else await taiDanhSachDe();
}

/* ----- Trình biên dịch LaTeX Parser ----- */
function parseLatexQuestions(latexText) {
  // Bỏ các dòng chú thích %... trước khi bóc tách (giữ \%)
  latexText = lamSachLatex(latexText);
  function parseBraces(text, count) {
    var blocks = [];
    var index = 0;
    for (var b = 0; b < count; b++) {
      var start = text.indexOf('{', index);
      if (start === -1) break;
      var braceCount = 1;
      var i = start + 1;
      while (i < text.length && braceCount > 0) {
        if (text[i] === '{') braceCount++;
        else if (text[i] === '}') braceCount--;
        i++;
      }
      blocks.push(text.substring(start + 1, i - 1));
      index = i;
    }
    return blocks;
  }

  // Tìm tất cả khối \begin{ex} ... \end{ex} hoặc \begin{bt} ... \end{bt}
  var regexEx = /\\begin\{(ex|bt)\}([\s\S]*?)\\end\{\1\}/g;
  var match;
  var questions = [];
  
  while ((match = regexEx.exec(latexText)) !== null) {
    var envType = match[1];
    var content = match[2];
    
    // 1. Tách lời giải \loigiai{...}
    var solution = "";
    var solIndex = content.indexOf('\\loigiai');
    if (solIndex !== -1) {
      var braceStart = content.indexOf('{', solIndex);
      if (braceStart !== -1) {
        var braceCount = 1;
        var i = braceStart + 1;
        while (i < content.length && braceCount > 0) {
          if (content[i] === '{') braceCount++;
          else if (content[i] === '}') braceCount--;
          i++;
        }
        solution = content.substring(braceStart + 1, i - 1);
        content = content.substring(0, solIndex) + content.substring(i);
      }
    }
    
    // 2. Tách các phương án trắc nghiệm
    var choices = [];
    var choiceTFIndex = content.indexOf('\\choiceTF');
    var choiceIndex = content.indexOf('\\choice');
    var questionBody = content;
    
    if (envType === 'bt') {
      // Tự luận / Trả lời ngắn: Tìm đáp án trong lời giải
      var ansMatch = solution.match(/\\textbf\{(Câu trả lời|Đáp số|Kết quả|Đáp án):?\}\s*([^\n}]+)/i);
      if (ansMatch) {
        var ansText = ansMatch[2].replace(/\.$/, '').trim();
        choices.push({
          key: 'short',
          latex: ansText,
          correct: true
        });
      }
    } else {
      // Môi trường ex: có thể là Trắc nghiệm hoặc Đúng/Sai
      if (choiceTFIndex !== -1) {
        questionBody = content.substring(0, choiceTFIndex).trim();
        var remaining = content.substring(choiceTFIndex + 9);
        var blocks = parseBraces(remaining, 4);
        var keys = ['a', 'b', 'c', 'd'];
        blocks.forEach(function (block, idx) {
          var isCorrect = false;
          var cleaned = block.trim();
          if (cleaned.includes('\\True') || cleaned.includes('\\true')) {
            isCorrect = true;
            cleaned = cleaned.replace(/\\True\s*/g, '').replace(/\\true\s*/g, '');
          }
          cleaned = cleaned.replace(/^[a-d][\.\)]\s*/i, ''); // xóa nhãn
          choices.push({
            key: keys[idx],
            latex: cleaned,
            correct: isCorrect
          });
        });
      } else if (choiceIndex !== -1) {
        questionBody = content.substring(0, choiceIndex).trim();
        var remaining = content.substring(choiceIndex + 7);
        var blocks = parseBraces(remaining, 4);
        var keys = ['A', 'B', 'C', 'D'];
        blocks.forEach(function (block, idx) {
          var isCorrect = false;
          var cleaned = block.trim();
          if (cleaned.includes('\\True') || cleaned.includes('\\true')) {
            isCorrect = true;
            cleaned = cleaned.replace(/\\True\s*/g, '').replace(/\\true\s*/g, '');
          }
          cleaned = cleaned.replace(/^[A-D][\.\)]\s*/i, '');
          choices.push({
            key: keys[idx],
            latex: cleaned,
            correct: isCorrect
          });
        });
      } else {
        // Fallback: Nếu ex không có choice thì tìm câu trả lời ngắn trong lời giải
        var ansMatch = solution.match(/\\textbf\{(Câu trả lời|Đáp số|Kết quả|Đáp án):?\}\s*([^\n}]+)/i);
        if (ansMatch) {
          var ansText = ansMatch[2].replace(/\.$/, '').trim();
          choices.push({
            key: 'short',
            latex: ansText,
            correct: true
          });
        }
      }
    }
    
    questions.push({
      content_latex: questionBody.trim(),
      choices: choices,
      solution_latex: solution.trim()
    });
  }
  return questions;
}

function demoParseLaTeX() {
  var raw = $('exLatex').value;
  parsedQuestions = parseLatexQuestions(raw);
  
  if (!parsedQuestions.length) {
    alert('Không tìm thấy câu hỏi nào dạng \\begin{ex}...\\end{ex} hoặc \\begin{bt}...\\end{bt} trong đoạn code dán vào.');
    $('vungPreview').style.display = 'none';
    $('btnSave').disabled = true;
    return;
  }
  
  $('previewCount').textContent = parsedQuestions.length;
  $('vungPreview').style.display = 'block';
  $('btnSave').disabled = false;
  
  $('dsPreview').innerHTML = parsedQuestions.map(function (q, idx) {
    var typeText = "";
    var choicesHTML = "";
    
    var isTF = q.choices.length === 4 && q.choices[0].key === 'a';
    var isShort = q.choices.length === 1 && q.choices[0].key === 'short';
    
    if (isShort) {
      typeText = " (Phần III - Trả lời ngắn)";
      choicesHTML = '<div class="q-preview-choice correct"><b>Đáp số đúng:</b> ' + latexRaHTML(q.choices[0].latex) + '</div>';
    } else if (isTF) {
      typeText = " (Phần II - Đúng / Sai)";
      choicesHTML = q.choices.map(function (c) {
        var marker = c.correct ? '<span style="color:var(--ok);font-weight:bold">ĐÚNG</span>' : '<span style="color:var(--err);font-weight:bold">SAI</span>';
        return '<div class="q-preview-choice">' +
          '<b>' + c.key + ')</b> ' + latexRaHTML(c.latex) + ' &rarr; ' + marker +
          '</div>';
      }).join('');
    } else {
      typeText = " (Phần I - Trắc nghiệm)";
      choicesHTML = q.choices.map(function (c) {
        var correctClass = c.correct ? ' correct' : '';
        return '<div class="q-preview-choice' + correctClass + '">' +
          '<b>' + c.key + '.</b> ' + latexRaHTML(c.latex) +
          '</div>';
      }).join('');
    }

    var solHTML = q.solution_latex
      ? '<div class="q-preview-sol"><b>Lời giải:</b> ' + latexRaHTML(q.solution_latex) + '</div>'
      : '';

    return '<div class="q-preview-card">' +
      '<div class="q-preview-title">Câu ' + (idx + 1) + typeText + '</div>' +
      '<div style="margin-bottom:10px">' + latexRaHTML(q.content_latex) + '</div>' +
      choicesHTML + solHTML +
      '</div>';
  }).join('');
  renderToanTrong($('dsPreview')); // vẽ công thức toán bằng KaTeX
}

function escapeHTML(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

async function loadExamForEdit(examId) {
  window.scrollTo({ top: 0, behavior: 'smooth' });
  
  $('formTitle').textContent = '⏳ Đang tải đề thi...';
  
  try {
    var r = await sb.from('exams').select('*').eq('id', examId).single();
    if (r.error || !r.data) {
      alert('Không tìm thấy đề thi.');
      cancelEditExam();
      return;
    }
    var exam = r.data;
    
    editingExamId = exam.id;
    $('formTitle').textContent = '🛠️ Chỉnh sửa đề thi';
    $('btnSave').textContent = '💾 Cập nhật đề thi';
    $('btnCancelEdit').style.display = 'block';
    
    $('exTitle').value = exam.title || '';
    $('exLop').value = exam.class_id || '';
    $('exDuration').value = exam.duration_minutes || 90;
    
    $('exOpens').value = exam.opens_at ? new Date(new Date(exam.opens_at).getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0, 16) : '';
    $('exCloses').value = exam.closes_at ? new Date(new Date(exam.closes_at).getTime() - new Date().getTimezoneOffset()*60000).toISOString().slice(0, 16) : '';
    
    $('exShuffle').checked = !!exam.shuffle;
    $('exPublished').checked = !!exam.published;
    
    var rQ = await sb.from('exam_questions')
      .select('sort, questions(id, content_latex, choices, solution_latex)')
      .eq('exam_id', examId)
      .order('sort');
      
    var questions = (rQ.data || []).map(function (eq) { return eq.questions; }).filter(Boolean);
    var latexArr = questions.map(function (q) {
      var env = 'ex';
      var choiceText = '';
      var isShort = q.choices && q.choices.length === 1 && q.choices[0].key === 'short';
      var isTF = q.choices && q.choices.length === 4 && q.choices[0].key === 'a';
      
      if (isShort) {
        env = 'bt';
      } else if (isTF) {
        env = 'ex';
        choiceText = '\n\\choiceTF\n' + q.choices.map(function (c) {
          var truePrefix = c.correct ? '\\True ' : '';
          return '  {' + truePrefix + c.key + ') ' + c.latex + '}';
        }).join('\n');
      } else if (q.choices && q.choices.length > 0) {
        env = 'ex';
        choiceText = '\n\\choice\n' + q.choices.map(function (c) {
          var truePrefix = c.correct ? '\\True ' : '';
          return '  {' + truePrefix + c.key + '. ' + c.latex + '}';
        }).join('\n');
      }
      
      var solText = q.solution_latex ? '\n\\loigiai{\n' + q.solution_latex + '\n}' : '';
      return '\\begin{' + env + '}\n' + q.content_latex + choiceText + solText + '\n\\end{' + env + '}';
    });
    
    $('exLatex').value = latexArr.join('\n\n');
    demoParseLaTeX();
  } catch (err) {
    alert('Lỗi tải đề thi: ' + err.message);
    cancelEditExam();
  }
}

function cancelEditExam() {
  editingExamId = null;
  $('formTitle').textContent = '🛠️ Tạo đề thi mới';
  $('btnSave').textContent = '💾 Lưu đề thi';
  $('btnCancelEdit').style.display = 'none';
  
  $('exTitle').value = '';
  $('exLop').value = '';
  $('exDuration').value = '90';
  $('exOpens').value = '';
  $('exCloses').value = '';
  $('exShuffle').checked = true;
  $('exPublished').checked = true;
  $('exLatex').value = '';
  $('vungPreview').style.display = 'none';
  parsedQuestions = [];
  $('btnSave').disabled = true;
}

async function parseAndSaveExam(e) {
  e.preventDefault();
  if (!parsedQuestions.length) {
    alert('Vui lòng bấm "Phân tích đề" và kiểm tra trước khi lưu.');
    return;
  }
  
  var title = $('exTitle').value.trim();
  var duration = parseInt($('exDuration').value) || 90;
  var classId = $('exLop').value || null;
  var opens = $('exOpens').value ? new Date($('exOpens').value).toISOString() : null;
  var closes = $('exCloses').value ? new Date($('exCloses').value).toISOString() : null;
  var shuffle = $('exShuffle').checked;
  var published = $('exPublished').checked;
  
  var btn = $('btnSave');
  btn.disabled = true; btn.textContent = '⏳ Đang lưu đề thi...';
  
  try {
    var examId = editingExamId;
    
    if (editingExamId) {
      // 1. Cập nhật Đề thi trong bảng exams
      var rExam = await sb.from('exams').update({
        title: title,
        class_id: classId,
        duration_minutes: duration,
        opens_at: opens,
        closes_at: closes,
        shuffle: shuffle,
        published: published
      }).eq('id', editingExamId);
      
      if (rExam.error) throw new Error(rExam.error.message);
      
      // 2. Xóa các câu hỏi cũ liên kết với đề thi này
      var rDel = await sb.from('exam_questions').delete().eq('exam_id', editingExamId);
      if (rDel.error) throw new Error('Lỗi dọn dẹp câu hỏi cũ: ' + rDel.error.message);
    } else {
      // 1. Tạo Đề thi mới trong bảng exams
      var rExam = await sb.from('exams').insert({
        title: title,
        class_id: classId,
        duration_minutes: duration,
        opens_at: opens,
        closes_at: closes,
        shuffle: shuffle,
        published: published
      }).select('id').single();
      
      if (rExam.error) throw new Error(rExam.error.message);
      examId = rExam.data.id;
    }
    
    // 3. Lưu các câu hỏi mới vào bảng questions và liên kết
    for (var i = 0; i < parsedQuestions.length; i++) {
      var q = parsedQuestions[i];
      var sourceId = 'EX-' + Date.now().toString().slice(-6) + '-' + i;
      
      var rQ = await sb.from('questions').insert({
        source_id: sourceId,
        content_latex: q.content_latex,
        choices: q.choices,
        solution_latex: q.solution_latex || null,
        difficulty: 'TH'
      }).select('id').single();
      
      if (rQ.error) throw new Error('Lỗi lưu câu hỏi ' + (i+1) + ': ' + rQ.error.message);
      
      var rLink = await sb.from('exam_questions').insert({
        exam_id: examId,
        question_id: rQ.data.id,
        sort: i
      });
      if (rLink.error) throw new Error('Lỗi liên kết câu hỏi ' + (i+1) + ': ' + rLink.error.message);
    }
    
    alert('✓ ' + (editingExamId ? 'Cập nhật' : 'Lưu') + ' đề thi "' + title + '" thành công!');
    cancelEditExam();
    await taiDanhSachDe();
  } catch (err) {
    alert('Lỗi: ' + err.message);
  }
  btn.disabled = false; btn.textContent = editingExamId ? '💾 Cập nhật đề thi' : '💾 Lưu đề thi';
}
</script>
</body>
</html>
