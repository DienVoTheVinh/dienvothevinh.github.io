<!DOCTYPE html>
<html lang="vi">
<head>
<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="favicon.png?v=3">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — VinhMath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=6.0">
<link rel="stylesheet" href="css/vinhmath.css?v=6.0">
<style>
body {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  margin: 0;
  overflow-x: hidden;
  background: var(--bg);
  transition: background 0.3s ease;
  font-family: var(--font-sans);
}

@media(max-width: 900px) {
  body {
    grid-template-columns: 1fr;
  }
  .side {
    display: none !important;
  }
}

/* Fullscreen Cyberpunk Canvas */
#cyberCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
  opacity: var(--canvas-opacity, 0.25);
  transition: opacity 0.2s ease;
  animation: canvasFadeIn 1.6s ease-out;
}
@keyframes canvasFadeIn { from { opacity: 0; } to { opacity: var(--canvas-opacity, 0.25); } }
@media (prefers-reduced-motion: reduce) { #cyberCanvas { animation: none; } }

/* --- SIDE PANEL (LEFT) --- */
.side {
  background: linear-gradient(to right, var(--bg) 35%, rgba(var(--bg-rgb), 0.35) 75%, transparent 100%);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 56px;
  position: relative;
  overflow: hidden;
  z-index: 1;
}

.side .quote {
  font-size: clamp(1.6rem, 2.8vw, 2.2rem);
  font-weight: 800;
  line-height: 1.35;
  letter-spacing: -0.02em;
  max-width: 18ch;
  position: relative;
}
.side .quote .accent {
  color: var(--accent);
  position: relative;
  display: inline-block;
}
.side .quote .accent::after {
  content: "";
  position: absolute;
  bottom: 4px;
  left: 0;
  width: 100%;
  height: 8px;
  background: var(--accent-soft);
  z-index: -1;
  border-radius: 4px;
}
.side .who {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--ink-2);
  margin-top: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.side .who::before {
  content: "";
  width: 24px;
  height: 1.5px;
  background: var(--line-2);
}

/* --- MAIN PANEL (RIGHT) --- */
.main {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 48px 32px;
  position: relative;
}

/* Cyberpunk Glassmorphic Box */
.box {
  width: 100%;
  max-width: 400px;
  background: rgba(var(--surface-rgb), 0.8);
  border: 1px solid var(--line);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: var(--r-md);
  padding: 40px;
  box-shadow: var(--shadow), 0 0 20px var(--accent-soft);
  position: relative;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.box::before, .box::after {
  content: "";
  position: absolute;
  width: 16px;
  height: 16px;
  border-color: var(--accent);
  border-style: solid;
  pointer-events: none;
  transition: border-color 0.3s ease;
}
.box::before {
  top: -1px;
  left: -1px;
  border-width: 3px 0 0 3px;
}
.box::after {
  bottom: -1px;
  right: -1px;
  border-width: 0 3px 3px 0;
}
.box:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.15), 0 0 25px var(--accent-soft);
}

.box h1 {
  font-size: 1.5rem;
  font-weight: 800;
  margin: 24px 0 8px;
  letter-spacing: -0.02em;
  font-family: var(--font-mono);
}
.box .sub {
  font-size: 0.92rem;
  margin-bottom: 32px;
  color: var(--ink-2);
}

.theme-toggle {
  position: absolute;
  top: 24px;
  right: 28px;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  background: var(--surface);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: all 0.2s ease;
  z-index: 10;
  color: var(--ink);
}
.theme-toggle:hover {
  transform: scale(1.08);
  border-color: var(--line-2);
}

.field {
  position: relative;
  margin-bottom: 24px;
}
.field label {
  display: block;
  font-size: 0.82rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--ink-2);
  margin-bottom: 8px;
  font-family: var(--font-mono);
}
.input {
  font-family: var(--font-mono);
  background: rgba(var(--surface-2-rgb), 0.4);
  border: 1px solid var(--line);
  color: var(--ink);
  border-radius: var(--r-sm);
  padding: 12px 16px;
  width: 100%;
  box-sizing: border-box;
  transition: all 0.2s ease;
}
.input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 12px var(--accent-soft);
  transform: translateY(-1px);
}

.show-pass {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.1rem;
  color: var(--ink-3);
  transition: color 0.15s;
}
.show-pass:hover {
  color: var(--ink-2);
}

.btn-primary {
  background: var(--accent-gradient);
  border: none;
  color: #fff;
  font-family: var(--font-sans);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-radius: var(--r-sm);
  padding: 14px 24px;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 15px var(--accent-soft);
  position: relative;
  overflow: hidden;
  z-index: 1;
}
.btn-primary::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(to right, transparent, rgba(255,255,255,0.15), transparent);
  transform: translateX(-100%);
  transition: transform 0.6s ease;
  z-index: -1;
}
.btn-primary:hover::after {
  transform: translateX(100%);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px var(--accent-soft), 0 0 15px var(--accent);
}

.hint {
  margin-top: 28px;
  font-size: 0.82rem;
  color: var(--ink-2);
  text-align: center;
  background: var(--surface-2);
  border-radius: var(--r-md);
  padding: 14px 18px;
  line-height: 1.45;
  border: 1px solid var(--line);
}

.alert {
  display: none;
  font-size: 0.88rem;
  font-weight: 500;
  border-radius: var(--r-md);
  padding: 12px 16px;
  margin-bottom: 20px;
  line-height: 1.4;
  border: 1px solid transparent;
  animation: slideDown 0.3s ease;
}
.alert.err {
  display: block;
  background: var(--err-soft);
  color: var(--err);
  border-color: var(--err-soft);
}
.alert.warn {
  display: block;
  background: var(--warn-soft);
  color: var(--warn);
  border-color: var(--warn-soft);
}

@keyframes slideDown {
  from { transform: translateY(-10px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.cyber-cursor {
  animation: blink 1s step-start infinite;
  color: var(--accent);
}
@keyframes blink {
  50% { opacity: 0; }
}
</style>
</head>
<body>

<div class="vm-aurora" aria-hidden="true"><span></span><span></span><span></span></div>
<canvas id="cyberCanvas"></canvas>

<div class="side">
  <a class="logo" href="index"><img src="img/logo.png" alt="VinhMath">VinhMath <small>· Lớp Toán Thầy Vinh</small></a>
  


  <div>
    <p class="quote">"Toán không phải là nhớ công thức. Là <span class="accent">nhìn ra con đường</span> đi đến lời giải."</p>
    <p class="who">Thầy Vinh</p>
  </div>
  <p style="font-size:0.82rem;color:var(--ink-3); font-family: var(--font-mono)">© 2026 VinhMath · Lớp Toán Thầy Vinh</p>
</div>

<div class="main">
  <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="Đổi chế độ sáng/tối">🌙</button>
  <div class="box reveal">
    <a class="logo" href="index" style="display:inline-flex"><img src="img/logo.png" alt="VinhMath">VinhMath</a>
    <h1>SYSTEM_ACCESS<span class="cyber-cursor">_</span></h1>
    <p class="sub">Đăng nhập cổng bảo mật để vào hệ thống học tập.</p>

    <div class="alert" id="thongBao"></div>

    <form id="formDangNhap">
      <div class="field">
        <label for="user">USER_NAME</label>
        <input class="input" id="user" placeholder="vd: NguyenVanA@hs.vinhmath" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="pass">PASSWORD</label>
        <div style="position:relative">
          <input class="input" type="password" id="pass" placeholder="••••••••" autocomplete="current-password" style="padding-right:42px" required>
          <button type="button" class="show-pass" onclick="togglePass()" id="eyeBtn">👁</button>
        </div>
      </div>
      <button class="btn btn-primary" type="submit" id="nutVao" style="width:100%; margin-top: 10px;">AUTH_SIGN_IN</button>
    </form>

    <p class="hint" style="font-family: var(--font-mono);">Quên mật khẩu? Nhắn thầy qua Zalo hoặc Facebook để được cấp lại.</p>
  </div>
</div>

<!-- Thư viện Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/vinhmath.js?v=6.0"></script>
<script src="js/analytics.js"></script>
<script>
// --- INTERACTIVE DOT-SPHERE FIELD (phong cách Antigravity, tông VinhMath) ---
var canvas = document.getElementById('cyberCanvas');
var ctx = canvas.getContext('2d');
var DPR = Math.min(window.devicePixelRatio || 1, 2);
var VW = window.innerWidth, VH = window.innerHeight;

var mouseX = -9999, mouseY = -9999;
window.addEventListener('mousemove', function (e) { mouseX = e.clientX; mouseY = e.clientY; });
window.addEventListener('mouseleave', function () { mouseX = -9999; mouseY = -9999; });
window.addEventListener('touchmove', function (e) { if (e.touches[0]) { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; } }, { passive: true });

// Vi tri cac qua cau theo ti le khung nhin (responsive)
var SPHERE_DEF = [
  { fx: 0.63, fy: 0.20, rf: 0.115, n: 150 },
  { fx: 0.85, fy: 0.30, rf: 0.085, n: 100 },
  { fx: 0.74, fy: 0.56, rf: 0.130, n: 170 },
  { fx: 0.93, fy: 0.64, rf: 0.080, n: 95 },
  { fx: 0.55, fy: 0.78, rf: 0.095, n: 120 },
  { fx: 0.17, fy: 0.70, rf: 0.075, n: 90 }
];
var spheres = [];
function buildSpheres() {
  var minSide = Math.min(VW, VH);
  spheres = SPHERE_DEF.map(function (d, si) {
    var n = d.n, pts = [];
    var gr = Math.PI * (3 - Math.sqrt(5));
    for (var i = 0; i < n; i++) {
      var y = 1 - (i / (n - 1)) * 2;
      var rad = Math.sqrt(Math.max(0, 1 - y * y));
      var th = gr * i;
      pts.push({ bx: Math.cos(th) * rad, by: y, bz: Math.sin(th) * rad, ox: 0, oy: 0, gold: (i % 6 === 0) });
    }
    return {
      cx: d.fx * VW, cy: d.fy * VH, r: d.rf * minSide, pts: pts,
      rotY: Math.random() * Math.PI * 2,
      rotX: (si % 2 ? 0.34 : -0.26),
      speed: 0.10 + Math.random() * 0.06
    };
  });
}

function resize() {
  VW = window.innerWidth; VH = window.innerHeight;
  canvas.width = Math.floor(VW * DPR);
  canvas.height = Math.floor(VH * DPR);
  canvas.style.width = VW + 'px';
  canvas.style.height = VH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildSpheres();
}
window.addEventListener('resize', resize);
resize();

var _prevTs = 0;
var ANIM_SPEED = 0.5;
function draw(ts) {
  ts = ts || performance.now();
  var dtf = _prevTs ? Math.min((ts - _prevTs) / 16.667, 2.5) : 1;
  _prevTs = ts;
  var spd = dtf * ANIM_SPEED;
  var dark = document.documentElement.getAttribute('data-theme') === 'dark';

  ctx.clearRect(0, 0, VW, VH);

  var R = 135, R2 = R * R; // ban kinh tuong tac chuot

  for (var s = 0; s < spheres.length; s++) {
    var sp = spheres[s];
    sp.rotY += sp.speed * spd * 0.02;
    var cyR = Math.cos(sp.rotY), syR = Math.sin(sp.rotY);
    var cxR = Math.cos(sp.rotX), sxR = Math.sin(sp.rotX);
    var pts = sp.pts;
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i];
      var x1 = p.bx * cyR - p.bz * syR;
      var z1 = p.bx * syR + p.bz * cyR;
      var y1 = p.by * cxR - z1 * sxR;
      var z2 = p.by * sxR + z1 * cxR;
      var px0 = sp.cx + x1 * sp.r;
      var py0 = sp.cy + y1 * sp.r;
      var depth = (z2 + 1) / 2;

      p.ox *= 0.86; p.oy *= 0.86;
      var px = px0 + p.ox, py = py0 + p.oy;

      var mdx = px - mouseX, mdy = py - mouseY;
      var md2 = mdx * mdx + mdy * mdy;
      if (md2 < R2) {
        var dd = Math.sqrt(md2) || 1;
        var f = (1 - dd / R);
        p.ox += (mdx / dd) * f * f * 20 * spd;
        p.oy += (mdy / dd) * f * f * 20 * spd;
        px = px0 + p.ox; py = py0 + p.oy;
      }

      var size = 0.6 + depth * 1.7;
      var a = 0.06 + depth * 0.5;
      if (dark) {
        ctx.fillStyle = p.gold ? 'rgba(223,188,94,' + a + ')' : 'rgba(170,196,235,' + (a * 0.9) + ')';
      } else {
        ctx.fillStyle = p.gold ? 'rgba(194,125,0,' + (a + 0.05) + ')' : 'rgba(31,74,140,' + a + ')';
      }
      ctx.beginPath();
      ctx.arc(px, py, size, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  requestAnimationFrame(draw);
}
draw();

</script>
</body>
</html>
