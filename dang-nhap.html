<!DOCTYPE html>
<html lang="vi">
<head>
<link rel="icon" type="image/png" href="favicon.png?v=3">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="mobile-web-app-capable" content="yes">

<title>Đăng nhập — VinhMath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  margin: 0;
  overflow-x: hidden;
  background: var(--bg);
  transition: background 0.3s ease;
  font-family: var(--font-sans);
}

@media(max-width: 900px) {
  body {
    grid-template-columns: 1fr;
  }
  .side {
    display: none !important;
  }
}

/* Fullscreen Cyberpunk Canvas */
#cyberCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
  opacity: 0.5;
  transition: opacity 0.2s ease;
  animation: canvasFadeIn 1.6s ease-out;
}
@keyframes canvasFadeIn { from { opacity: 0; } to { opacity: 0.5; } }
@media (prefers-reduced-motion: reduce) { #cyberCanvas { animation: none; } }

/* --- SIDE PANEL (LEFT) --- */
.side {
  background: linear-gradient(to right, var(--bg) 35%, rgba(var(--bg-rgb), 0.35) 75%, transparent 100%);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 56px;
  position: relative;
  overflow: hidden;
  z-index: 1;
}

.side .quote {
  font-size: clamp(1.6rem, 2.8vw, 2.2rem);
  font-weight: 800;
  line-height: 1.35;
  letter-spacing: -0.02em;
  max-width: 18ch;
  position: relative;
}
.side .quote .accent {
  color: var(--accent);
  position: relative;
  display: inline-block;
}
.side .quote .accent::after {
  content: "";
  position: absolute;
  bottom: 4px;
  left: 0;
  width: 100%;
  height: 8px;
  background: var(--accent-soft);
  z-index: -1;
  border-radius: 4px;
}
.side .who {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--ink-2);
  margin-top: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.side .who::before {
  content: "";
  width: 24px;
  height: 1.5px;
  background: var(--line-2);
}

/* --- MAIN PANEL (RIGHT) --- */
.main {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 48px 32px;
  position: relative;
}

/* Cyberpunk Glassmorphic Box */
.box {
  width: 100%;
  max-width: 400px;
  background: rgba(var(--surface-rgb), 0.8);
  border: 1px solid var(--line);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: var(--r-md);
  padding: 40px;
  box-shadow: var(--shadow), 0 0 20px var(--accent-soft);
  position: relative;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.box::before, .box::after {
  display: none !important;
  content: none !important;
}
.box:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.15), 0 0 25px var(--accent-soft);
}

.box h1 {
  font-size: 1.5rem;
  font-weight: 800;
  margin: 24px 0 8px;
  letter-spacing: -0.02em;
  font-family: var(--font-mono);
}
.box .sub {
  font-size: 0.92rem;
  margin-bottom: 32px;
  color: var(--ink-2);
}

.theme-toggle {
  position: absolute;
  top: 24px;
  right: 28px;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  background: var(--surface);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: all 0.2s ease;
  z-index: 10;
  color: var(--ink);
}
.theme-toggle:hover {
  transform: scale(1.08);
  border-color: var(--line-2);
}

.field {
  position: relative;
  margin-bottom: 24px;
}
.field label {
  display: block;
  font-size: 0.82rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--ink-2);
  margin-bottom: 8px;
  font-family: var(--font-mono);
}
.input {
  font-family: var(--font-mono);
  background: rgba(var(--surface-2-rgb), 0.4);
  border: 1px solid var(--line);
  color: var(--ink);
  border-radius: var(--r-sm);
  padding: 12px 16px;
  width: 100%;
  box-sizing: border-box;
  transition: all 0.2s ease;
}
.input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 12px var(--accent-soft);
  transform: translateY(-1px);
}

.show-pass {
  position: absolute;
  right: 7px;
  top: 50%;
  transform: translateY(-50%);
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  padding: 0;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 10px;
  cursor: pointer;
  color: var(--ink-3);
  transition: color 0.15s, background 0.15s, border-color 0.15s;
}
.show-pass svg { width: 20px; height: 20px; pointer-events: none; }
.show-pass:hover, .show-pass:focus-visible {
  color: var(--ink-2);
  background: var(--surface-2);
  border-color: var(--line);
  outline: none;
}
.remember-row {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  margin: -6px 0 20px;
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: rgba(var(--surface-2-rgb), 0.34);
  cursor: pointer;
  transition: border-color .18s ease, background .18s ease;
}
.remember-row:hover { border-color: var(--line-2); background: var(--surface-2); }
.remember-row input {
  width: 18px;
  height: 18px;
  margin: 2px 0 0;
  flex: 0 0 auto;
  accent-color: var(--accent);
}
.remember-copy { min-width: 0; line-height: 1.35; }
.remember-copy strong { display: block; color: var(--ink); font-size: .84rem; font-weight: 700; }
.remember-copy small { display: block; margin-top: 3px; color: var(--ink-3); font-size: .72rem; }
}

.btn-primary {
  background: var(--accent-gradient);
  border: none;
  color: #fff;
  font-family: var(--font-sans);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-radius: var(--r-sm);
  padding: 14px 24px;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 15px var(--accent-soft);
  position: relative;
  overflow: hidden;
  z-index: 1;
}
.btn-primary::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(to right, transparent, rgba(255,255,255,0.15), transparent);
  transform: translateX(-100%);
  transition: transform 0.6s ease;
  z-index: -1;
}
.btn-primary:hover::after {
  transform: translateX(100%);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px var(--accent-soft), 0 0 15px var(--accent);
}

.hint {
  margin-top: 28px;
  font-size: 0.82rem;
  color: var(--ink-2);
  text-align: center;
  background: var(--surface-2);
  border-radius: var(--r-md);
  padding: 14px 18px;
  line-height: 1.45;
  border: 1px solid var(--line);
}

.alert {
  display: none;
  font-size: 0.88rem;
  font-weight: 500;
  border-radius: var(--r-md);
  padding: 12px 16px;
  margin-bottom: 20px;
  line-height: 1.4;
  border: 1px solid transparent;
  animation: slideDown 0.3s ease;
}
.alert.err {
  display: block;
  background: var(--err-soft);
  color: var(--err);
  border-color: var(--err-soft);
}
.alert.warn {
  display: block;
  background: var(--warn-soft);
  color: var(--warn);
  border-color: var(--warn-soft);
}

@keyframes slideDown {
  from { transform: translateY(-10px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.cyber-cursor {
  animation: blink 1s step-start infinite;
  color: var(--accent);
}
@keyframes blink {
  50% { opacity: 0; }
}
@media(max-width: 520px) {
  .main { padding: 24px 16px; }
  .box { max-width: 100%; padding: 30px 22px; }
  .box h1 { font-size: 1.28rem; }
  .remember-row { padding: 10px; }
}
</style>
</head>

<div class="vm-aurora" aria-hidden="true"><span></span><span></span><span></span></div>
<canvas id="cyberCanvas"></canvas>

<div class="side">
  <a class="logo" href="index"><img src="img/logo.png" alt="VinhMath"><span style="display: inline-flex; align-items: center; gap: 0;"><span class="brand-vinh" style="color: var(--accent) !important;">Vinh</span><span class="brand-math" style="color: var(--topbar-text, #ffffff) !important;">Math</span></span> <small id="loginBrandTagline">· Lớp Toán Thầy Vinh</small></a>
  


  <div>
    <p class="quote">"Toán không phải là nhớ công thức. Là <span class="accent">nhìn ra con đường</span> đi đến lời giải."</p>
    <p class="who" id="loginBrandOwner">Thầy Vinh</p>
  </div>
  <p id="loginBrandFooter" style="font-size:0.82rem;color:var(--ink-3); font-family: var(--font-mono)">© 2026 VinhMath · Lớp Toán Thầy Vinh</p>
</div>

<div class="main">
  <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="Đổi chế độ sáng/tối">🌙</button>
  <div class="box reveal">
    <a class="logo" href="index" style="display:inline-flex"><img src="img/logo.png" alt="VinhMath"><span id="loginCardBrandName">VinhMath</span></a>
    <h1>SYSTEM_ACCESS<span class="cyber-cursor">_</span></h1>
    <p class="sub">Đăng nhập cổng bảo mật để vào hệ thống học tập.</p>

    <div class="alert" id="thongBao"></div>

    <form id="formDangNhap" autocomplete="on">
      <div class="field">
        <label for="user">USER_NAME</label>
        <input class="input" id="user" name="username" placeholder="vd: NguyenVanA@hs.vinhmath" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="pass">PASSWORD</label>
        <div style="position:relative">
          <input class="input" type="password" id="pass" name="password" placeholder="••••••••" autocomplete="current-password" style="padding-right:52px" required>
          <button type="button" class="show-pass" onclick="togglePass()" id="eyeBtn" aria-label="Hiện mật khẩu" title="Hiện mật khẩu" aria-pressed="false"></button>
        </div>
      </div>
      <label class="remember-row" for="rememberLogin">
        <input type="checkbox" id="rememberLogin" checked>
        <span class="remember-copy">
          <strong>Ghi nhớ đăng nhập trên thiết bị này</strong>
          <small>Duy trì phiên sau khi đóng trình duyệt. Mật khẩu được trình duyệt quản lý an toàn, <span id="loginSecurityBrandName">VinhMath</span> không tự lưu.</small>
        </span>
      </label>
      <button class="btn btn-primary" type="submit" id="nutVao" style="width:100%; margin-top: 10px;">AUTH_SIGN_IN</button>
    </form>

    <p class="hint" id="loginSupportHint" style="font-family: var(--font-mono);">Quên mật khẩu? Nhắn thầy qua Zalo hoặc Facebook để được cấp lại.</p>
  </div>
</div>

<!-- Thư viện Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/vinhmath.js?v=9.7"></script>
<script src="js/analytics.js"></script>
<script>
// --- NEN: MANG LUOI 3D (doan thang gap khuc) + QUA CAU DEN-VANG ---
var canvas = document.getElementById('cyberCanvas');
var ctx = canvas.getContext('2d');
var DPR = Math.min(window.devicePixelRatio || 1, 2);
var VW = window.innerWidth, VH = window.innerHeight;

var mouseX = -9999, mouseY = -9999, mvX = VW / 2, mvY = VH / 2;
window.addEventListener('mousemove', function (e) { mouseX = e.clientX; mouseY = e.clientY; mvX = e.clientX; mvY = e.clientY; });
window.addEventListener('mouseleave', function () { mouseX = -9999; mouseY = -9999; });
window.addEventListener('touchmove', function (e) { if (e.touches[0]) { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; mvX = mouseX; mvY = mouseY; } }, { passive: true });

var GOLD = '224,160,32';
var GOLD_GLOW = '#efc046';
function inkRGB(dark) { return dark ? '206,216,234' : '31,58,96'; }
function lineRGB(dark) { return dark ? '150,166,198' : '70,96,140'; }

// ---- Lop 1: MANG LUOI 3D (cac nut noi bang doan thang) ----
var NET = [];
function buildNet() {
  NET = [];
  var count = Math.round((VW * VH) / 19000);
  count = Math.max(70, Math.min(130, count));
  for (var i = 0; i < count; i++) {
    NET.push({
      x: Math.random() * 2 - 1, y: Math.random() * 2 - 1, z: Math.random() * 2 - 1,
      vx: (Math.random() - 0.5) * 0.0016, vy: (Math.random() - 0.5) * 0.0016, vz: (Math.random() - 0.5) * 0.0016,
      gold: (i % 5 === 0), ox: 0, oy: 0, sx: 0, sy: 0, dp: 0, rx: 0, ry: 0, rz: 0
    });
  }
}

// ---- Lop 2: QUA CAU (3 qua, den + vang phat sang, 3D hon) ----
var SPHERE_DEF = [
  { fx: 0.73, fy: 0.30, rf: 0.20, n: 220 },
  { fx: 0.91, fy: 0.63, rf: 0.13, n: 150 },
  { fx: 0.60, fy: 0.77, rf: 0.16, n: 190 }
];
var spheres = [];
function buildSpheres() {
  var minSide = Math.min(VW, VH);
  spheres = SPHERE_DEF.map(function (d, si) {
    var n = d.n, pts = [];
    var gr = Math.PI * (3 - Math.sqrt(5));
    for (var i = 0; i < n; i++) {
      var y = 1 - (i / (n - 1)) * 2;
      var rad = Math.sqrt(Math.max(0, 1 - y * y));
      var th = gr * i;
      pts.push({ bx: Math.cos(th) * rad, by: y, bz: Math.sin(th) * rad, ox: 0, oy: 0, gold: (i % 3 === 0) });
    }
    return {
      cx: d.fx * VW, cy: d.fy * VH, r: d.rf * minSide, pts: pts,
      rotY: Math.random() * Math.PI * 2,
      rotX: (si % 2 ? 0.36 : -0.26),
      speed: 0.16 + Math.random() * 0.10
    };
  });
}

function resize() {
  VW = window.innerWidth; VH = window.innerHeight;
  canvas.width = Math.floor(VW * DPR);
  canvas.height = Math.floor(VH * DPR);
  canvas.style.width = VW + 'px';
  canvas.style.height = VH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildNet();
  buildSpheres();
}
window.addEventListener('resize', resize);
resize();

var tiltX = 0, tiltY = 0;
var _prevTs = 0;
var ANIM_SPEED = 0.6;
function draw(ts) {
  ts = ts || performance.now();
  var dtf = _prevTs ? Math.min((ts - _prevTs) / 16.667, 2.5) : 1;
  _prevTs = ts;
  var spd = dtf * ANIM_SPEED;
  var dark = document.documentElement.getAttribute('data-theme') === 'dark';
  var INK = inkRGB(dark), LINE = lineRGB(dark);

  ctx.clearRect(0, 0, VW, VH);

  // ---------- Lop 1: mang luoi 3D xoay khong gian ----------
  // Nghieng nhe theo chuot -> tuong tac
  var tgX = (mvY - VH / 2) / VH * 0.5;
  var tgY = (mvX - VW / 2) / VW * 0.6;
  tiltX += (tgX - tiltX) * 0.04;
  tiltY += (tgY - tiltY) * 0.04;
  var rotY = ts * 0.00007 + tiltY;
  var rotX = Math.sin(ts * 0.00004) * 0.18 + tiltX;
  var cyN = Math.cos(rotY), syN = Math.sin(rotY), cxN = Math.cos(rotX), sxN = Math.sin(rotX);
  var CXs = VW * 0.45, CYs = VH / 2, SCx = VW * 0.58, SCy = VH * 0.56, focal = 2.7;

  var i, j;
  for (i = 0; i < NET.length; i++) {
    var n = NET[i];
    n.x += n.vx * spd; n.y += n.vy * spd; n.z += n.vz * spd;
    if (n.x < -1) n.x += 2; else if (n.x > 1) n.x -= 2;
    if (n.y < -1) n.y += 2; else if (n.y > 1) n.y -= 2;
    if (n.z < -1) n.z += 2; else if (n.z > 1) n.z -= 2;
    // xoay Y roi X
    var X = n.x * cyN - n.z * syN;
    var Z = n.x * syN + n.z * cyN;
    var Y = n.y * cxN - Z * sxN;
    var Z2 = n.y * sxN + Z * cxN;
    n.rx = X; n.ry = Y; n.rz = Z2;
    var persp = focal / (focal - Z2);
    var bx = CXs + X * persp * SCx;
    var by = CYs + Y * persp * SCy;
    // day diem khi chuot toi gan (tuong tac)
    n.ox *= 0.85; n.oy *= 0.85;
    var mdx = bx + n.ox - mouseX, mdy = by + n.oy - mouseY, md2 = mdx * mdx + mdy * mdy, RR = 150;
    if (md2 < RR * RR) { var dd = Math.sqrt(md2) || 1, f = 1 - dd / RR; n.ox += (mdx / dd) * f * f * 22 * spd; n.oy += (mdy / dd) * f * f * 22 * spd; }
    n.sx = bx + n.ox; n.sy = by + n.oy;
    n.dp = (Z2 + 1) / 2;
  }

  // Doan thang gap khuc noi cac nut gan nhau trong khong gian 3D
  var TH = 0.62, TH2 = TH * TH;
  ctx.lineWidth = 1;
  for (i = 0; i < NET.length; i++) {
    var a = NET[i];
    for (j = i + 1; j < NET.length; j++) {
      var b = NET[j];
      var dx = a.rx - b.rx, dy = a.ry - b.ry, dz = a.rz - b.rz;
      var d2 = dx * dx + dy * dy + dz * dz;
      if (d2 < TH2) {
        var t = 1 - Math.sqrt(d2) / TH;
        var dep = (a.dp + b.dp) / 2;
        var al = t * (0.06 + dep * (dark ? 0.24 : 0.2));
        ctx.strokeStyle = 'rgba(' + LINE + ',' + al + ')';
        ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
      }
    }
  }
  // Cac nut
  for (i = 0; i < NET.length; i++) {
    var nn = NET[i];
    var sz = 1.0 + nn.dp * 2.4;
    if (nn.gold) {
      ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 7 + nn.dp * 8;
      ctx.fillStyle = 'rgba(' + GOLD + ',' + (0.4 + nn.dp * 0.5) + ')';
      ctx.beginPath(); ctx.arc(nn.sx, nn.sy, sz * 1.05, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = 'rgba(' + INK + ',' + (0.22 + nn.dp * 0.5) + ')';
      ctx.beginPath(); ctx.arc(nn.sx, nn.sy, sz, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ---------- Lop 2: qua cau (3D hon, vang sang hon) ----------
  var R = 155, R2 = R * R;
  for (var s = 0; s < spheres.length; s++) {
    var sp = spheres[s];
    sp.rotY += sp.speed * spd * 0.02;
    var cyR = Math.cos(sp.rotY), syR = Math.sin(sp.rotY);
    var cxR = Math.cos(sp.rotX), sxR = Math.sin(sp.rotX);
    var pts2 = sp.pts;
    for (var i2 = 0; i2 < pts2.length; i2++) {
      var p = pts2[i2];
      var x1 = p.bx * cyR - p.bz * syR;
      var z1 = p.bx * syR + p.bz * cyR;
      var y1 = p.by * cxR - z1 * sxR;
      var z2 = p.by * sxR + z1 * cxR;
      var persp2 = 1.9 / (1.9 - z2);
      var px0 = sp.cx + x1 * sp.r * persp2;
      var py0 = sp.cy + y1 * sp.r * persp2;
      var depth = (z2 + 1) / 2;

      p.ox *= 0.88; p.oy *= 0.88;
      var px = px0 + p.ox, py = py0 + p.oy;
      var mdx2 = px - mouseX, mdy2 = py - mouseY, m2 = mdx2 * mdx2 + mdy2 * mdy2;
      if (m2 < R2) { var dd2 = Math.sqrt(m2) || 1, ff = 1 - dd2 / R; p.ox += (mdx2 / dd2) * ff * ff * 30 * spd; p.oy += (mdy2 / dd2) * ff * ff * 30 * spd; px = px0 + p.ox; py = py0 + p.oy; }

      if (p.gold) {
        ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 8 + depth * 12;
        ctx.fillStyle = 'rgba(' + GOLD + ',' + (0.4 + depth * 0.55) + ')';
        ctx.beginPath(); ctx.arc(px, py, (0.7 + depth * 1.7) * persp2, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      } else {
        ctx.fillStyle = 'rgba(' + INK + ',' + ((dark ? 0.14 : 0.1) + depth * 0.5) + ')';
        ctx.beginPath(); ctx.arc(px, py, (0.5 + depth * 1.5) * persp2, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  requestAnimationFrame(draw);
}
draw();

// --- LOGIN LOGIC ---
function togglePass() {
  var p = $('pass');
  var seHien = p.type === 'password';
  p.type = seHien ? 'text' : 'password';
  capNhatNutMat(seHien);
}

function capNhatNutMat(dangHien) {
  var btn = $('eyeBtn');
  var nhan = dangHien ? 'Ẩn mật khẩu' : 'Hiện mật khẩu';
  btn.setAttribute('aria-label', nhan);
  btn.setAttribute('title', nhan);
  btn.setAttribute('aria-pressed', dangHien ? 'true' : 'false');
  btn.innerHTML = dangHien
    ? '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 3l18 18M10.6 10.7a2 2 0 002.7 2.7M9.9 4.2A10.7 10.7 0 0112 4c5.2 0 8.8 4.7 9.7 6.1a3.4 3.4 0 010 3.8 17.5 17.5 0 01-2.3 2.8M6.2 6.2a17.8 17.8 0 00-3.9 3.9 3.4 3.4 0 000 3.8C3.2 15.3 6.8 20 12 20a10.5 10.5 0 005-1.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.3 10.1C3.2 8.7 6.8 4 12 4s8.8 4.7 9.7 6.1a3.4 3.4 0 010 3.8C20.8 15.3 17.2 20 12 20S3.2 15.3 2.3 13.9a3.4 3.4 0 010-3.8z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>';
}

var VM_SAVED_USERNAME_KEY = 'vm-remembered-username';
function khoiTaoNhoDangNhap() {
  var remember = $('rememberLogin');
  var enabled = typeof vmCoNhoDangNhap === 'function' ? vmCoNhoDangNhap() : true;
  remember.checked = enabled;
  if (enabled) {
    try { $('user').value = window.localStorage.getItem(VM_SAVED_USERNAME_KEY) || ''; } catch (e) {}
  }
}
function luuLuaChonDangNhap(username, enabled) {
  if (typeof vmDatNhoDangNhap === 'function') vmDatNhoDangNhap(enabled);
  try {
    if (enabled) window.localStorage.setItem(VM_SAVED_USERNAME_KEY, String(username || '').trim());
    else window.localStorage.removeItem(VM_SAVED_USERNAME_KEY);
  } catch (e) {}
}

capNhatNutMat(false);
khoiTaoNhoDangNhap();

function baoLoi(msg, loai) {
  var el = $('thongBao');
  el.className = 'alert ' + (loai || 'err');
  el.textContent = msg;
}

var vmRequestedTenantSlug = String(new URLSearchParams(location.search).get('tenant') || '').trim().toLowerCase();

function vmApplyLoginTenantCopy(context) {
  if (!context || !context.full_site) return;
  var brand = context.brand || {};
  var name = brand.short_name || brand.name || context.short_name || context.name;
  var tagline = brand.tagline || context.description || '';
  var support = context.support_text || '';
  var cardName = document.getElementById('loginCardBrandName');
  var owner = document.getElementById('loginBrandOwner');
  var footer = document.getElementById('loginBrandFooter');
  var tag = document.getElementById('loginBrandTagline');
  var securityName = document.getElementById('loginSecurityBrandName');
  if (cardName) cardName.textContent = name;
  if (owner) owner.textContent = name;
  if (footer) footer.textContent = '© 2026 ' + name + (tagline ? ' · ' + tagline : '');
  if (tag) tag.textContent = '· ' + (tagline || name);
  if (securityName) securityName.textContent = name;
  if (support) document.getElementById('loginSupportHint').textContent = support;
  if (context.login_suffix) document.getElementById('user').placeholder = 'vd: NguyenVanA@' + context.login_suffix;
  document.querySelectorAll('a.logo').forEach(function (logo) { logo.href = vmTenantHomePath(context); });
}

if (vmRequestedTenantSlug && typeof vmLoadPublicTenantContext === 'function') {
  vmLoadPublicTenantContext(vmRequestedTenantSlug).then(vmApplyLoginTenantCopy).catch(function () {});
}

async function vmDichDangNhap(uid, role) {
  var requestedPortal = new URLSearchParams(location.search).get('portal');
  var tenantContext = typeof vmLoadTenantContext === 'function' ? await vmLoadTenantContext() : null;
  if (tenantContext && tenantContext.full_site) {
    location.replace(vmTenantHomePath(tenantContext));
    return;
  }
  if (tenantContext && tenantContext.portal_only && tenantContext.portal) {
    location.replace('thi?portal=' + encodeURIComponent(tenantContext.portal.slug));
    return;
  }
  if (requestedPortal) {
    location.replace('thi?portal=' + encodeURIComponent(requestedPortal));
    return;
  }
  location.replace(role === 'parent' ? 'phu-huynh' : 'trang-chu');
}

// Chưa điền config.js → nhắc nhẹ (chế độ xem thử)
if (!daKetNoi()) {
  baoLoi('Chế độ xem thử: web chưa kết nối Supabase nên chưa đăng nhập được thật.', 'warn');
}

// Đã đăng nhập từ trước → vào thẳng trang tương ứng. Phiên cũ bị hỏng được
// dọn cục bộ và form vẫn mở để người dùng đăng nhập lại, không mắc vòng chờ.
if (daKetNoi()) {
  vmLayPhienAnToan(6000).then(function (s) {
    if (s.data.session) {
      sb.from('profiles').select('role').eq('id', s.data.session.user.id).single().then(function(rp) {
        return vmDichDangNhap(s.data.session.user.id, rp.data && rp.data.role);
      }).catch(function() { return vmDichDangNhap(s.data.session.user.id, 'student'); });
    } else if (s.error && vmLaLoiPhienKhongHopLe(s.error)) {
      baoLoi('Phiên đăng nhập cũ đã hết hạn. Em đăng nhập lại để tiếp tục nhé.', 'warn');
    }
  }).catch(function () {});
}

// Xử lý khi bấm nút "AUTH_SIGN_IN"
$('formDangNhap').addEventListener('submit', async function (e) {
  e.preventDefault();
  var nut = $('nutVao');
  nut.disabled = true; nut.textContent = 'CHECKING_CREDENTIALS…';
  var username = $('user').value;
  var remember = $('rememberLogin').checked;
  var dangChuyenTrang = false;
  try {
    if (typeof vmDatNhoDangNhap === 'function') vmDatNhoDangNhap(remember);
    var r = await dangNhap(username, $('pass').value);
    if (r.error) {
      baoLoi(r.error);
      return;
    }
    luuLuaChonDangNhap(username, remember);
    var s = await vmLayPhienAnToan(6000);
    if (s.data.session) {
      var role = 'student';
      try {
        var rp = await vmChoCoGioiHan(sb.from('profiles').select('role').eq('id', s.data.session.user.id).single(), 6000);
        role = rp.data && rp.data.role || role;
      } catch (profileError) {}
      dangChuyenTrang = true;
      await vmDichDangNhap(s.data.session.user.id, role);
      return;
    }
    if (s.error && vmLaLoiPhienKhongHopLe(s.error)) {
      baoLoi('Phiên đăng nhập vừa hết hạn. Em bấm đăng nhập lại một lần nữa nhé.', 'warn');
    } else {
      dangChuyenTrang = true;
      window.location.href = vmRequestedTenantSlug === 'uyenmath' ? 'uyenmath' : 'trang-chu';
    }
  } catch (error) {
    baoLoi('Kết nối đăng nhập bị gián đoạn. Em kiểm tra mạng rồi thử lại nhé.');
  } finally {
    if (!dangChuyenTrang) {
      nut.disabled = false;
      nut.textContent = 'AUTH_SIGN_IN';
    }
  }
});
</script>
