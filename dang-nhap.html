<!DOCTYPE html>
<html lang="vi">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — VinhMath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=4.0">

<style>
body {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  margin: 0;
  overflow-x: hidden;
  background: var(--bg);
  transition: background 0.3s ease;
  font-family: var(--font-sans);
}

@media(max-width: 900px) {
  body {
    grid-template-columns: 1fr;
  }
  .side {
    display: none !important;
  }
}

/* Fullscreen Cyberpunk Canvas */
#cyberCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
  opacity: var(--canvas-opacity, 0.25);
  transition: opacity 0.2s ease;
}

/* --- SIDE PANEL (LEFT) --- */
.side {
  background: linear-gradient(to right, var(--bg) 35%, rgba(var(--bg-rgb), 0.35) 75%, transparent 100%);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 56px;
  position: relative;
  overflow: hidden;
  z-index: 1;
}

.side .quote {
  font-size: clamp(1.6rem, 2.8vw, 2.2rem);
  font-weight: 800;
  line-height: 1.35;
  letter-spacing: -0.02em;
  max-width: 18ch;
  position: relative;
}
.side .quote .accent {
  color: var(--accent);
  position: relative;
  display: inline-block;
}
.side .quote .accent::after {
  content: "";
  position: absolute;
  bottom: 4px;
  left: 0;
  width: 100%;
  height: 8px;
  background: var(--accent-soft);
  z-index: -1;
  border-radius: 4px;
}
.side .who {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--ink-2);
  margin-top: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.side .who::before {
  content: "";
  width: 24px;
  height: 1.5px;
  background: var(--line-2);
}

/* --- MAIN PANEL (RIGHT) --- */
.main {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 48px 32px;
  position: relative;
}

/* Cyberpunk Glassmorphic Box */
.box {
  width: 100%;
  max-width: 400px;
  background: rgba(var(--surface-rgb), 0.8);
  border: 1px solid var(--line);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: var(--r-md);
  padding: 40px;
  box-shadow: var(--shadow), 0 0 20px var(--accent-soft);
  position: relative;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.box::before, .box::after {
  content: "";
  position: absolute;
  width: 16px;
  height: 16px;
  border-color: var(--accent);
  border-style: solid;
  pointer-events: none;
  transition: border-color 0.3s ease;
}
.box::before {
  top: -1px;
  left: -1px;
  border-width: 3px 0 0 3px;
}
.box::after {
  bottom: -1px;
  right: -1px;
  border-width: 0 3px 3px 0;
}
.box:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.15), 0 0 25px var(--accent-soft);
}

.box h1 {
  font-size: 1.5rem;
  font-weight: 800;
  margin: 24px 0 8px;
  letter-spacing: -0.02em;
  font-family: var(--font-mono);
}
.box .sub {
  font-size: 0.92rem;
  margin-bottom: 32px;
  color: var(--ink-2);
}

.theme-toggle {
  position: absolute;
  top: 24px;
  right: 28px;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  background: var(--surface);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: all 0.2s ease;
  z-index: 10;
}
.theme-toggle:hover {
  transform: scale(1.08);
  border-color: var(--line-2);
}

.field {
  position: relative;
  margin-bottom: 24px;
}
.field label {
  display: block;
  font-size: 0.82rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--ink-2);
  margin-bottom: 8px;
  font-family: var(--font-mono);
}
.input {
  font-family: var(--font-mono);
  background: rgba(var(--surface-2-rgb), 0.4);
  border: 1px solid var(--line);
  color: var(--ink);
  border-radius: var(--r-sm);
  padding: 12px 16px;
  width: 100%;
  box-sizing: border-box;
  transition: all 0.2s ease;
}
.input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 12px var(--accent-soft);
  transform: translateY(-1px);
}

.show-pass {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.1rem;
  color: var(--ink-3);
  transition: color 0.15s;
}
.show-pass:hover {
  color: var(--ink-2);
}

.btn-primary {
  background: var(--accent-gradient);
  border: none;
  color: #fff;
  font-family: var(--font-sans);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-radius: var(--r-sm);
  padding: 14px 24px;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 15px var(--accent-soft);
  position: relative;
  overflow: hidden;
  z-index: 1;
}
.btn-primary::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(to right, transparent, rgba(255,255,255,0.15), transparent);
  transform: translateX(-100%);
  transition: transform 0.6s ease;
  z-index: -1;
}
.btn-primary:hover::after {
  transform: translateX(100%);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px var(--accent-soft), 0 0 15px var(--accent);
}

.hint {
  margin-top: 28px;
  font-size: 0.82rem;
  color: var(--ink-2);
  text-align: center;
  background: var(--surface-2);
  border-radius: var(--r-md);
  padding: 14px 18px;
  line-height: 1.45;
  border: 1px solid var(--line);
}

.alert {
  display: none;
  font-size: 0.88rem;
  font-weight: 500;
  border-radius: var(--r-md);
  padding: 12px 16px;
  margin-bottom: 20px;
  line-height: 1.4;
  border: 1px solid transparent;
  animation: slideDown 0.3s ease;
}
.alert.err {
  display: block;
  background: var(--err-soft);
  color: var(--err);
  border-color: var(--err-soft);
}
.alert.warn {
  display: block;
  background: var(--warn-soft);
  color: var(--warn);
  border-color: var(--warn-soft);
}

@keyframes slideDown {
  from { transform: translateY(-10px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.cyber-cursor {
  animation: blink 1s step-start infinite;
  color: var(--accent);
}
@keyframes blink {
  50% { opacity: 0; }
}
</style>
</head>
<body>

<canvas id="cyberCanvas"></canvas>

<div class="side">
  <a class="logo" href="index"><span class="dot">V</span>VinhMath <small>· Lớp Toán Thầy Vinh</small></a>
  


  <div>
    <p class="quote">"Toán không phải là nhớ công thức. Là <span class="accent">nhìn ra con đường</span> đi đến lời giải."</p>
    <p class="who">Thầy Vinh</p>
  </div>
  <p style="font-size:0.82rem;color:var(--ink-3); font-family: var(--font-mono)">© 2026 VinhMath · Lớp Toán Thầy Vinh</p>

<div class="main">
  <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="Đổi chế độ sáng/tối">🌙</button>
  <div class="box">
    <a class="logo" href="index" style="display:inline-flex"><span class="dot">V</span>VinhMath</a>

    <p class="sub">Đăng nhập cổng bảo mật để vào hệ thống học tập.</p>

    <div class="alert" id="thongBao"></div>

    <form id="formDangNhap">
      <div class="field">
        <label for="user">USER_NAME</label>
        <input class="input" id="user" placeholder="vd: NguyenVanA@hs.vinhmath" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="pass">PASSWORD</label>
        <div style="position:relative">
          <input class="input" type="password" id="pass" placeholder="••••••••" autocomplete="current-password" style="padding-right:42px" required>
          <button type="button" class="show-pass" onclick="togglePass()" id="eyeBtn">👁</button>
        </div>
      </div>
      <button class="btn btn-primary" type="submit" id="nutVao" style="width:100%; margin-top: 10px;">AUTH_SIGN_IN</button>
    </form>

    <p class="hint" style="font-family: var(--font-mono);">Quên mật khẩu? Nhắn thầy qua Zalo hoặc Facebook để được cấp lại.</p>
  </div>
</div>

<!-- Thư viện Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/vinhmath.js?v=4.0"></script>
<script src="js/analytics.js"></script>
<script>
// --- INTERACTIVE MATH LAB CANVAS ---
var canvas = document.getElementById('cyberCanvas');
var ctx = canvas.getContext('2d');
var themeIsDark = document.documentElement.getAttribute('data-theme') === 'dark';

// Resizing
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// 1. Tesseract (4D Hypercube) Setup
var tesseractVertices = [];
for (var x = -1; x <= 1; x += 2) {
  for (var y = -1; y <= 1; y += 2) {
    for (var z = -1; z <= 1; z += 2) {
      for (var w = -1; w <= 1; w += 2) {
        tesseractVertices.push([x, y, z, w]);
      }
    }
  }
}
var tesseractEdges = [];
for (var i = 0; i < 16; i++) {
  for (var j = i + 1; j < 16; j++) {
    var diff = 0;
    for (var k = 0; k < 4; k++) {
      if (tesseractVertices[i][k] !== tesseractVertices[j][k]) diff++;
    }
    if (diff === 1) tesseractEdges.push([i, j]);
  }
}

// 2. Lorenz Attractor Setup (Real-time integration)
var lorenzParticles = [
  { x: 0.1, y: 0.0, z: 0.0, history: [], color: 'rgba(0, 242, 254, 0.85)', glow: '#00f2fe' },
  { x: 0.1001, y: 0.0, z: 0.0, history: [], color: 'rgba(139, 92, 246, 0.8)', glow: '#8b5cf6' },
  { x: 0.1002, y: 0.0, z: 0.0, history: [], color: 'rgba(245, 158, 11, 0.75)', glow: '#f59e0b' }
];
var sigma = 10, rho = 28, beta = 8/3;
var dt = 0.007;

// 3. Floating Math Formulas Setup
var formulas = [
  { text: "e^{iπ} + 1 = 0", x: 100, y: 150, vx: 0.1, vy: -0.05, alpha: 0.1, targetAlpha: 0.3, size: 14 },
  { text: "∫_{-∞}^{∞} e^{-x²} dx = √π", x: 300, y: 400, vx: -0.08, vy: 0.05, alpha: 0.15, targetAlpha: 0.35, size: 15 },
  { text: "iℏ ∂/∂t Ψ = Ĥ Ψ", x: 700, y: 200, vx: 0.05, vy: -0.07, alpha: 0.08, targetAlpha: 0.28, size: 14 },
  { text: "f̂(ξ) = ∫_{-∞}^{∞} f(x) e^{-2πixξ} dx", x: 500, y: 600, vx: -0.06, vy: -0.04, alpha: 0.12, targetAlpha: 0.32, size: 15 },
  { text: "∇ × E = -∂B/∂t", x: 800, y: 500, vx: 0.07, vy: 0.06, alpha: 0.1, targetAlpha: 0.3, size: 14 },
  { text: "P(A|B) = P(B|A)P(A) / P(B)", x: 200, y: 700, vx: 0.08, vy: -0.08, alpha: 0.09, targetAlpha: 0.29, size: 13 }
];

// 4. Fourier Epicycles Setup
var fourierAngle = 0;
var fourierPath = [];

// 3D rotation angles
var angleX = -0.3;
var angleY = 0.5;
var mouseX = window.innerWidth / 2;
var mouseY = window.innerHeight / 2;

window.addEventListener('mousemove', function(e) {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

function draw() {
  themeIsDark = document.documentElement.getAttribute('data-theme') === 'dark';
  ctx.fillStyle = themeIsDark ? '#050811' : '#f5f8ff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  var accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2563eb';
  var w = canvas.width;
  var h = canvas.height;
  
  // 1. Draw Floating Math Formulas (Gently floating & fading)
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  formulas.forEach(function(f) {
    f.x += f.vx;
    f.y += f.vy;
    
    if (f.x < 50 || f.x > w - 50) f.vx *= -1;
    if (f.y < 50 || f.y > h - 50) f.vy *= -1;
    
    if (Math.random() > 0.99) f.targetAlpha = 0.1 + Math.random() * 0.3;
    f.alpha += (f.targetAlpha - f.alpha) * 0.02;
    
    ctx.fillStyle = themeIsDark ? 'rgba(255, 255, 255, ' + f.alpha * 0.4 + ')' : 'rgba(37, 99, 235, ' + f.alpha * 0.3 + ')';
    ctx.font = 'bold ' + f.size + 'px "Be Vietnam Pro", sans-serif';
    ctx.fillText(f.text, f.x, f.y);
  });
  
  // Smooth automatic continuous Y rotation + subtle mouse offset tilt
  var autoRotateY = Date.now() * 0.00015;
  var autoRotateX = Math.sin(Date.now() * 0.00005) * 0.1;
  var targetAngleX = autoRotateX + (mouseY - h / 2) * 0.0002;
  var targetAngleY = autoRotateY + (mouseX - w / 2) * 0.0002;
  angleX += (targetAngleX - angleX) * 0.05;
  angleY += (targetAngleY - angleY) * 0.05;
  
  // --- A. DRAW 4D TESSERACT (LEFT SIDE) ---
  var tessCenterX = w * 0.22;
  var tessCenterY = h * 0.55;
  var loginSide = document.querySelector('.side');
  if (loginSide) {
    var rect = loginSide.getBoundingClientRect();
    tessCenterX = rect.left + rect.width * 0.25;
    tessCenterY = rect.top + rect.height * 0.5;
  }
  
  var tRotXW = Date.now() * 0.0002;
  var tRotYW = Date.now() * 0.00015;
  var tRotYZ = Date.now() * 0.0001;
  
  var projectedVertices = [];
  tesseractVertices.forEach(function(v) {
    var r1 = rotateXW(v, tRotXW);
    var r2 = rotateYW(r1, tRotYW);
    var r3 = rotateYZ(r2, tRotYZ);
    
    var dist4D = 2.0;
    var scale4D = dist4D / (dist4D - r3[3]);
    var x3D = r3[0] * scale4D;
    var y3D = r3[1] * scale4D;
    var z3D = r3[2] * scale4D;
    
    var cosY = Math.cos(angleY);
    var sinY = Math.sin(angleY);
    var x3_1 = x3D * cosY - z3D * sinY;
    var z3_1 = x3D * sinY + z3D * cosY;
    
    var cosX = Math.cos(angleX);
    var sinX = Math.sin(angleX);
    var y3_2 = y3D * cosX - z3_1 * sinX;
    var z3_2 = y3D * sinX + z3_1 * cosX;
    
    var zoom = Math.min(w, h) * 0.12;
    var dist3D = 3.0;
    var scale3D = dist3D / (dist3D + z3_2);
    projectedVertices.push({
      x: tessCenterX + x3_1 * scale3D * zoom,
      y: tessCenterY + y3_2 * scale3D * zoom
    });
  });
  
  // Draw Tesseract Edges
  ctx.strokeStyle = themeIsDark ? 'rgba(0, 242, 254, 0.2)' : 'rgba(37, 99, 235, 0.16)';
  ctx.lineWidth = 1.0;
  tesseractEdges.forEach(function(edge) {
    var p1 = projectedVertices[edge[0]];
    var p2 = projectedVertices[edge[1]];
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  });
  // Draw vertices
  ctx.fillStyle = themeIsDark ? '#00f2fe' : '#2563eb';
  projectedVertices.forEach(function(p) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
    ctx.fill();
  });
  
  // Label Tesseract
  ctx.fillStyle = themeIsDark ? 'rgba(0, 242, 254, 0.4)' : 'rgba(37, 99, 235, 0.4)';
  ctx.font = '10px monospace';
  ctx.fillText("4D Hypercube (Tesseract)", tessCenterX, tessCenterY - Math.min(w, h) * 0.18);
  
  // --- B. DRAW LORENZ ATTRACTOR (RIGHT SIDE - REALTIME) ---
  var lorenzCenterX = w * 0.7;
  var lorenzCenterY = h * 0.5;
  if (loginSide) {
    var rect = loginSide.getBoundingClientRect();
    lorenzCenterX = rect.left + rect.width * 0.72;
    lorenzCenterY = rect.top + rect.height * 0.5;
  }
  
  var lorenzZoom = Math.min(w, h) * 0.011;
  var lorenzScaleFocal = 300;
  
  // Integrate Lorenz
  for (var step = 0; step < 2; step++) {
    lorenzParticles.forEach(function(p) {
      var dx = sigma * (p.y - p.x) * dt;
      var dy = (p.x * (rho - p.z) - p.y) * dt;
      var dz = (p.x * p.y - beta * p.z) * dt;
      p.x += dx;
      p.y += dy;
      p.z += dz;
      
      p.history.push({ x: p.x, y: p.y, z: p.z });
      if (p.history.length > 150) p.history.shift();
    });
  }
  
  function projectLorenz(pt) {
    var cx = pt.x;
    var cy = pt.y;
    var cz = pt.z - 25;
    
    var cosY = Math.cos(angleY * 0.7);
    var sinY = Math.sin(angleY * 0.7);
    var x1 = cx * cosY - cz * sinY;
    var z1 = cx * sinY + cz * cosY;
    
    var cosX = Math.cos(angleX * 0.7);
    var sinX = Math.sin(angleX * 0.7);
    var y2 = cy * cosX - z1 * sinX;
    var z2 = cy * sinX + z1 * cosX;
    
    var scale = lorenzScaleFocal / (lorenzScaleFocal + z2);
    return {
      x: lorenzCenterX + x1 * scale * lorenzZoom,
      y: lorenzCenterY + y2 * scale * lorenzZoom
    };
  }
  
  ctx.strokeStyle = themeIsDark ? 'rgba(255, 255, 255, 0.05)' : 'rgba(0, 0, 0, 0.04)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  var ox = projectLorenz({ x: -30, y: 0, z: 25 });
  var oy = projectLorenz({ x: 30, y: 0, z: 25 });
  ctx.moveTo(ox.x, ox.y); ctx.lineTo(oy.x, oy.y);
  ctx.stroke();
  
  lorenzParticles.forEach(function(p) {
    if (p.history.length < 2) return;
    
    ctx.beginPath();
    var pStart = projectLorenz(p.history[0]);
    ctx.moveTo(pStart.x, pStart.y);
    for (var j = 1; j < p.history.length; j++) {
      var pProj = projectLorenz(p.history[j]);
      ctx.lineTo(pProj.x, pProj.y);
    }
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 1.6;
    ctx.stroke();
    
    var tip = projectLorenz(p);
    ctx.fillStyle = p.glow;
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, 4, 0, Math.PI * 2);
    ctx.shadowBlur = themeIsDark ? 10 : 3;
    ctx.shadowColor = p.glow;
    ctx.fill();
    ctx.shadowBlur = 0;
  });
  
  // Label Lorenz
  ctx.fillStyle = themeIsDark ? 'rgba(0, 242, 254, 0.4)' : 'rgba(37, 99, 235, 0.4)';
  ctx.font = '10px monospace';
  ctx.fillText("Lorenz Chaos Attractor (σ=10, ρ=28, β=8/3)", lorenzCenterX, lorenzCenterY - Math.min(w, h) * 0.18);
  
  // --- C. DRAW FOURIER SERIES EPICYCLES (CENTER BOTTOM) ---
  var fourierCenterX = w * 0.48;
  var fourierCenterY = h * 0.75;
  if (loginSide) {
    fourierCenterX = rect.left + rect.width * 0.5;
    fourierCenterY = rect.top + rect.height * 0.78;
  }
  
  fourierAngle += 0.008;
  var fX = 0, fY = 0;
  var radii = [45, 18, 6];
  var speeds = [1, 3, -7];
  
  ctx.strokeStyle = themeIsDark ? 'rgba(255, 255, 255, 0.06)' : 'rgba(0, 0, 0, 0.04)';
  ctx.lineWidth = 0.8;
  
  for (var k = 0; k < radii.length; k++) {
    var prevX = fX;
    var prevY = fY;
    var r = radii[k];
    var sp = speeds[k];
    
    fX += r * Math.cos(sp * fourierAngle);
    fY += r * Math.sin(sp * fourierAngle);
    
    ctx.beginPath();
    ctx.arc(fourierCenterX + prevX, fourierCenterY + prevY, r, 0, Math.PI * 2);
    ctx.stroke();
    
    ctx.beginPath();
    ctx.moveTo(fourierCenterX + prevX, fourierCenterY + prevY);
    ctx.lineTo(fourierCenterX + fX, fourierCenterY + fY);
    ctx.strokeStyle = themeIsDark ? 'rgba(0, 242, 254, 0.2)' : 'rgba(37, 99, 235, 0.15)';
    ctx.stroke();
  }
  
  fourierPath.push({ x: fX, y: fY });
  if (fourierPath.length > 500) fourierPath.shift();
  
  if (fourierPath.length > 1) {
    ctx.beginPath();
    ctx.moveTo(fourierCenterX + fourierPath[0].x, fourierCenterY + fourierPath[0].y);
    for (var m = 1; m < fourierPath.length; m++) {
      ctx.lineTo(fourierCenterX + fourierPath[m].x, fourierCenterY + fourierPath[m].y);
    }
    ctx.strokeStyle = themeIsDark ? 'rgba(0, 242, 254, 0.7)' : 'rgba(37, 99, 235, 0.55)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  
  // Label Fourier
  ctx.fillStyle = themeIsDark ? 'rgba(0, 242, 254, 0.4)' : 'rgba(37, 99, 235, 0.4)';
  ctx.font = '10px monospace';
  ctx.fillText("Fourier Approximation", fourierCenterX, fourierCenterY - 65);
  
  requestAnimationFrame(draw);
}

// 4D Rotation Helpers
function rotateXW(pt, theta) {
  var x = pt[0], w = pt[3];
  var cos = Math.cos(theta), sin = Math.sin(theta);
  return [x * cos - w * sin, pt[1], pt[2], x * sin + w * cos];
}
function rotateYW(pt, theta) {
  var y = pt[1], w = pt[3];
  var cos = Math.cos(theta), sin = Math.sin(theta);
  return [pt[0], y * cos - w * sin, pt[2], y * sin + w * cos];
}
function rotateYZ(pt, theta) {
  var y = pt[1], z = pt[2];
  var cos = Math.cos(theta), sin = Math.sin(theta);
  return [pt[0], y * cos - z * sin, y * sin + z * cos, pt[3]];
}

resize();
draw();

$('formDangNhap').addEventListener('submit', async function (e) {

  var nut = $('nutVao');
  nut.disabled = true; nut.textContent = 'CHECKING_CREDENTIALS…';
