<!DOCTYPE html>
<html lang="vi">
<head>
<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="favicon.png?v=3">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — VinhMath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=6.1">
<link rel="stylesheet" href="css/vinhmath.css?v=6.1">
<style>
body {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  margin: 0;
  overflow-x: hidden;
  background: var(--bg);
  transition: background 0.3s ease;
  font-family: var(--font-sans);
}

@media(max-width: 900px) {
  body {
    grid-template-columns: 1fr;
  }
  .side {
    display: none !important;
  }
}

/* Fullscreen Cyberpunk Canvas */
#cyberCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
  opacity: 0.5;
  transition: opacity 0.2s ease;
  animation: canvasFadeIn 1.6s ease-out;
}
@keyframes canvasFadeIn { from { opacity: 0; } to { opacity: 0.5; } }
@media (prefers-reduced-motion: reduce) { #cyberCanvas { animation: none; } }

/* --- SIDE PANEL (LEFT) --- */
.side {
  background: linear-gradient(to right, var(--bg) 35%, rgba(var(--bg-rgb), 0.35) 75%, transparent 100%);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 56px;
  position: relative;
  overflow: hidden;
  z-index: 1;
}

.side .quote {
  font-size: clamp(1.6rem, 2.8vw, 2.2rem);
  font-weight: 800;
  line-height: 1.35;
  letter-spacing: -0.02em;
  max-width: 18ch;
  position: relative;
}
.side .quote .accent {
  color: var(--accent);
  position: relative;
  display: inline-block;
}
.side .quote .accent::after {
  content: "";
  position: absolute;
  bottom: 4px;
  left: 0;
  width: 100%;
  height: 8px;
  background: var(--accent-soft);
  z-index: -1;
  border-radius: 4px;
}
.side .who {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--ink-2);
  margin-top: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.side .who::before {
  content: "";
  width: 24px;
  height: 1.5px;
  background: var(--line-2);
}

/* --- MAIN PANEL (RIGHT) --- */
.main {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 48px 32px;
  position: relative;
}

/* Cyberpunk Glassmorphic Box */
.box {
  width: 100%;
  max-width: 400px;
  background: rgba(var(--surface-rgb), 0.8);
  border: 1px solid var(--line);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: var(--r-md);
  padding: 40px;
  box-shadow: var(--shadow), 0 0 20px var(--accent-soft);
  position: relative;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.box::before, .box::after {
  display: none !important;
  content: none !important;
}
.box:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.15), 0 0 25px var(--accent-soft);
}

.box h1 {
  font-size: 1.5rem;
  font-weight: 800;
  margin: 24px 0 8px;
  letter-spacing: -0.02em;
  font-family: var(--font-mono);
}
.box .sub {
  font-size: 0.92rem;
  margin-bottom: 32px;
  color: var(--ink-2);
}

.theme-toggle {
  position: absolute;
  top: 24px;
  right: 28px;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  background: var(--surface);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: all 0.2s ease;
  z-index: 10;
  color: var(--ink);
}
.theme-toggle:hover {
  transform: scale(1.08);
  border-color: var(--line-2);
}

.field {
  position: relative;
  margin-bottom: 24px;
}
.field label {
  display: block;
  font-size: 0.82rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--ink-2);
  margin-bottom: 8px;
  font-family: var(--font-mono);
}
.input {
  font-family: var(--font-mono);
  background: rgba(var(--surface-2-rgb), 0.4);
  border: 1px solid var(--line);
  color: var(--ink);
  border-radius: var(--r-sm);
  padding: 12px 16px;
  width: 100%;
  box-sizing: border-box;
  transition: all 0.2s ease;
}
.input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 12px var(--accent-soft);
  transform: translateY(-1px);
}

.show-pass {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.1rem;
  color: var(--ink-3);
  transition: color 0.15s;
}
.show-pass:hover {
  color: var(--ink-2);
}

.btn-primary {
  background: var(--accent-gradient);
  border: none;
  color: #fff;
  font-family: var(--font-sans);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-radius: var(--r-sm);
  padding: 14px 24px;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 15px var(--accent-soft);
  position: relative;
  overflow: hidden;
  z-index: 1;
}
.btn-primary::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(to right, transparent, rgba(255,255,255,0.15), transparent);
  transform: translateX(-100%);
  transition: transform 0.6s ease;
  z-index: -1;
}
.btn-primary:hover::after {
  transform: translateX(100%);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px var(--accent-soft), 0 0 15px var(--accent);
}

.hint {
  margin-top: 28px;
  font-size: 0.82rem;
  color: var(--ink-2);
  text-align: center;
  background: var(--surface-2);
  border-radius: var(--r-md);
  padding: 14px 18px;
  line-height: 1.45;
  border: 1px solid var(--line);
}

.alert {
  display: none;
  font-size: 0.88rem;
  font-weight: 500;
  border-radius: var(--r-md);
  padding: 12px 16px;
  margin-bottom: 20px;
  line-height: 1.4;
  border: 1px solid transparent;
  animation: slideDown 0.3s ease;
}
.alert.err {
  display: block;
  background: var(--err-soft);
  color: var(--err);
  border-color: var(--err-soft);
}
.alert.warn {
  display: block;
  background: var(--warn-soft);
  color: var(--warn);
  border-color: var(--warn-soft);
}

@keyframes slideDown {
  from { transform: translateY(-10px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.cyber-cursor {
  animation: blink 1s step-start infinite;
  color: var(--accent);
}
@keyframes blink {
  50% { opacity: 0; }
}
</style>
</head>
<body>

<div class="vm-aurora" aria-hidden="true"><span></span><span></span><span></span></div>
<canvas id="cyberCanvas"></canvas>

<div class="side">
  <a class="logo" href="index"><img src="img/logo.png" alt="VinhMath">VinhMath <small>· Lớp Toán Thầy Vinh</small></a>
  


  <div>
    <p class="quote">"Toán không phải là nhớ công thức. Là <span class="accent">nhìn ra con đường</span> đi đến lời giải."</p>
    <p class="who">Thầy Vinh</p>
  </div>
  <p style="font-size:0.82rem;color:var(--ink-3); font-family: var(--font-mono)">© 2026 VinhMath · Lớp Toán Thầy Vinh</p>
</div>

<div class="main">
  <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="Đổi chế độ sáng/tối">🌙</button>
  <div class="box reveal">
    <a class="logo" href="index" style="display:inline-flex"><img src="img/logo.png" alt="VinhMath">VinhMath</a>
    <h1>SYSTEM_ACCESS<span class="cyber-cursor">_</span></h1>
    <p class="sub">Đăng nhập cổng bảo mật để vào hệ thống học tập.</p>

    <div class="alert" id="thongBao"></div>

    <form id="formDangNhap">
      <div class="field">
        <label for="user">USER_NAME</label>
        <input class="input" id="user" placeholder="vd: NguyenVanA@hs.vinhmath" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="pass">PASSWORD</label>
        <div style="position:relative">
          <input class="input" type="password" id="pass" placeholder="••••••••" autocomplete="current-password" style="padding-right:42px" required>
          <button type="button" class="show-pass" onclick="togglePass()" id="eyeBtn">👁</button>
        </div>
      </div>
      <button class="btn btn-primary" type="submit" id="nutVao" style="width:100%; margin-top: 10px;">AUTH_SIGN_IN</button>
    </form>

    <p class="hint" style="font-family: var(--font-mono);">Quên mật khẩu? Nhắn thầy qua Zalo hoặc Facebook để được cấp lại.</p>
  </div>
</div>

<!-- Thư viện Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/vinhmath.js?v=6.1"></script>
<script src="js/analytics.js"></script>
<script>
// --- NEN: DO THI TOAN HOC CHUYEN DONG + QUA CAU DEN-VANG (VinhMath) ---
var canvas = document.getElementById('cyberCanvas');
var ctx = canvas.getContext('2d');
var DPR = Math.min(window.devicePixelRatio || 1, 2);
var VW = window.innerWidth, VH = window.innerHeight;

var mouseX = -9999, mouseY = -9999;
window.addEventListener('mousemove', function (e) { mouseX = e.clientX; mouseY = e.clientY; });
window.addEventListener('mouseleave', function () { mouseX = -9999; mouseY = -9999; });
window.addEventListener('touchmove', function (e) { if (e.touches[0]) { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; } }, { passive: true });

var GOLD = '224,160,32';        // vang gold
var GOLD_GLOW = '#e8b53a';

function inkRGB(dark) { return dark ? '216,222,234' : '22,26,36'; } // den (sang tren nen toi)

// ---- Lop 1: CAC DO THI TOAN HOC CHUYEN DONG (nhieu duong cong ham so) ----
var GRAPHS = [];
function buildGraphs() {
  var W = VW, H = VH, m = Math.min(W, H);
  GRAPHS = [
    { kind: 'sine',   cx: 0.30 * W, cy: 0.30 * H, w: 0.36 * W, amp: 0.055 * H, k: 3.0, sp: 0.5,  gold: false },
    { kind: 'sine',   cx: 0.68 * W, cy: 0.82 * H, w: 0.44 * W, amp: 0.045 * H, k: 2.2, sp: -0.4, gold: true  },
    { kind: 'damped', cx: 0.22 * W, cy: 0.66 * H, w: 0.34 * W, amp: 0.075 * H, k: 5.0, sp: 0.6,  gold: false },
    { kind: 'parab',  cx: 0.84 * W, cy: 0.24 * H, w: 0.24 * W, amp: 0.12 * H,  sp: 0.6,  gold: true  },
    { kind: 'lissa',  cx: 0.48 * W, cy: 0.48 * H, w: 0.11 * m, h: 0.11 * m, a: 3, b: 2, sp: 0.35, gold: false },
    { kind: 'spiral', cx: 0.16 * W, cy: 0.34 * H, r: 0.10 * m, sp: 0.5,  gold: true  },
    { kind: 'gauss',  cx: 0.44 * W, cy: 0.88 * H, w: 0.30 * W, amp: 0.10 * H, sp: 0.7,  gold: false },
    { kind: 'sine',   cx: 0.86 * W, cy: 0.52 * H, w: 0.22 * W, amp: 0.05 * H,  k: 4.0, sp: 0.45, gold: false }
  ];
}

function graphPoints(g, T) {
  var pts = [], i, x, t, r, ang, N;
  if (g.kind === 'sine') {
    for (i = 0; i <= 90; i++) { x = -1 + i / 45; pts.push([g.cx + x * g.w / 2, g.cy + g.amp * Math.sin(g.k * x * Math.PI + T * g.sp * 2)]); }
  } else if (g.kind === 'damped') {
    for (i = 0; i <= 90; i++) { x = -1 + i / 45; pts.push([g.cx + x * g.w / 2, g.cy + g.amp * Math.exp(-Math.abs(x) * 1.6) * Math.cos(g.k * x * Math.PI + T * g.sp * 2)]); }
  } else if (g.kind === 'parab') {
    var bob = Math.sin(T * g.sp) * g.amp * 0.12;
    for (i = 0; i <= 60; i++) { x = -1 + i / 30; pts.push([g.cx + x * g.w / 2, g.cy - g.amp * (0.5 - x * x) + bob]); }
  } else if (g.kind === 'gauss') {
    var wob = 1 + Math.sin(T * g.sp) * 0.18;
    for (i = 0; i <= 80; i++) { x = -1 + i / 40; pts.push([g.cx + x * g.w / 2, g.cy - g.amp * Math.exp(-(x * 2.6 / wob) * (x * 2.6 / wob))]); }
  } else if (g.kind === 'lissa') {
    for (i = 0; i <= 120; i++) { t = i / 120 * Math.PI * 2; pts.push([g.cx + g.w * Math.sin(g.a * t + T * g.sp), g.cy + g.h * Math.sin(g.b * t)]); }
  } else if (g.kind === 'spiral') {
    N = 130;
    for (i = 0; i <= N; i++) { t = i / N; r = g.r * t; ang = t * Math.PI * 5 + T * g.sp; pts.push([g.cx + r * Math.cos(ang), g.cy + r * Math.sin(ang)]); }
  }
  return pts;
}

// ---- Lop 2: QUA CAU DIEM (it hon: 3 qua, den + vang phat sang) ----
var SPHERE_DEF = [
  { fx: 0.72, fy: 0.30, rf: 0.20, n: 220 },
  { fx: 0.90, fy: 0.62, rf: 0.13, n: 150 },
  { fx: 0.60, fy: 0.76, rf: 0.16, n: 190 }
];
var spheres = [];
function buildSpheres() {
  var minSide = Math.min(VW, VH);
  spheres = SPHERE_DEF.map(function (d, si) {
    var n = d.n, pts = [];
    var gr = Math.PI * (3 - Math.sqrt(5));
    for (var i = 0; i < n; i++) {
      var y = 1 - (i / (n - 1)) * 2;
      var rad = Math.sqrt(Math.max(0, 1 - y * y));
      var th = gr * i;
      pts.push({ bx: Math.cos(th) * rad, by: y, bz: Math.sin(th) * rad, ox: 0, oy: 0, gold: (i % 3 === 0) });
    }
    return {
      cx: d.fx * VW, cy: d.fy * VH, r: d.rf * minSide, pts: pts,
      rotY: Math.random() * Math.PI * 2,
      rotX: (si % 2 ? 0.38 : -0.28),
      speed: 0.16 + Math.random() * 0.10
    };
  });
}

function resize() {
  VW = window.innerWidth; VH = window.innerHeight;
  canvas.width = Math.floor(VW * DPR);
  canvas.height = Math.floor(VH * DPR);
  canvas.style.width = VW + 'px';
  canvas.style.height = VH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildGraphs();
  buildSpheres();
}
window.addEventListener('resize', resize);
resize();

var _prevTs = 0;
var ANIM_SPEED = 0.6;
function draw(ts) {
  ts = ts || performance.now();
  var dtf = _prevTs ? Math.min((ts - _prevTs) / 16.667, 2.5) : 1;
  _prevTs = ts;
  var spd = dtf * ANIM_SPEED;
  var dark = document.documentElement.getAttribute('data-theme') === 'dark';
  var INK = inkRGB(dark);
  var T = ts * 0.001;

  ctx.clearRect(0, 0, VW, VH);

  // ----- Lop 1: do thi toan hoc chuyen dong -----
  for (var gi = 0; gi < GRAPHS.length; gi++) {
    var g = GRAPHS[gi];
    var pts = graphPoints(g, T);
    if (!pts.length) continue;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var pi = 1; pi < pts.length; pi++) ctx.lineTo(pts[pi][0], pts[pi][1]);
    if (g.gold) {
      ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 8;
      ctx.strokeStyle = 'rgba(' + GOLD + ',' + (dark ? 0.5 : 0.42) + ')';
      ctx.lineWidth = 1.7;
    } else {
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(' + INK + ',' + (dark ? 0.22 : 0.2) + ')';
      ctx.lineWidth = 1.3;
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // ----- Lop 2: qua cau diem (den + vang phat sang) -----
  var R = 155, R2 = R * R;
  for (var s = 0; s < spheres.length; s++) {
    var sp = spheres[s];
    sp.rotY += sp.speed * spd * 0.02;
    var cyR = Math.cos(sp.rotY), syR = Math.sin(sp.rotY);
    var cxR = Math.cos(sp.rotX), sxR = Math.sin(sp.rotX);
    var pts2 = sp.pts;
    for (var i2 = 0; i2 < pts2.length; i2++) {
      var p = pts2[i2];
      var x1 = p.bx * cyR - p.bz * syR;
      var z1 = p.bx * syR + p.bz * cyR;
      var y1 = p.by * cxR - z1 * sxR;
      var z2 = p.by * sxR + z1 * cxR;
      var px0 = sp.cx + x1 * sp.r;
      var py0 = sp.cy + y1 * sp.r;
      var depth = (z2 + 1) / 2;

      p.ox *= 0.88; p.oy *= 0.88;
      var px = px0 + p.ox, py = py0 + p.oy;

      var mdx = px - mouseX, mdy = py - mouseY;
      var md2 = mdx * mdx + mdy * mdy;
      if (md2 < R2) {
        var dd = Math.sqrt(md2) || 1;
        var f = (1 - dd / R);
        p.ox += (mdx / dd) * f * f * 30 * spd;
        p.oy += (mdy / dd) * f * f * 30 * spd;
        px = px0 + p.ox; py = py0 + p.oy;
      }

      if (p.gold) {
        var ga = 0.32 + depth * 0.55;
        ctx.shadowColor = GOLD_GLOW; ctx.shadowBlur = 6 + depth * 6;
        ctx.fillStyle = 'rgba(' + GOLD + ',' + ga + ')';
        ctx.beginPath(); ctx.arc(px, py, 1.0 + depth * 2.4, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      } else {
        var ia = (dark ? 0.14 : 0.1) + depth * (dark ? 0.5 : 0.5);
        ctx.fillStyle = 'rgba(' + INK + ',' + ia + ')';
        ctx.beginPath(); ctx.arc(px, py, 0.7 + depth * 2.0, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  requestAnimationFrame(draw);
}
draw();

// --- LOGIN LOGIC ---
function togglePass() {
  var p = $('pass');
  p.type = p.type === 'password' ? 'text' : 'password';
  $('eyeBtn').textContent = p.type === 'password' ? '👁' : '🙈';
}

function baoLoi(msg, loai) {
  var el = $('thongBao');
  el.className = 'alert ' + (loai || 'err');
  el.textContent = msg;
}

// Chưa điền config.js → nhắc nhẹ (chế độ xem thử)
if (!daKetNoi()) {
  baoLoi('Chế độ xem thử: web chưa kết nối Supabase nên chưa đăng nhập được thật.', 'warn');
}

// Đã đăng nhập từ trước → vào thẳng trang tương ứng
if (daKetNoi()) {
  sb.auth.getSession().then(function (s) {
    if (s.data.session) {
      sb.from('profiles').select('role').eq('id', s.data.session.user.id).single().then(function(rp) {
        if (rp.data && rp.data.role === 'parent') {
          window.location.href = 'phu-huynh';
        } else {
          window.location.href = 'trang-chu';
        }
      }).catch(function() {
        window.location.href = 'trang-chu';
      });
    }
  });
}

// Xử lý khi bấm nút "AUTH_SIGN_IN"
$('formDangNhap').addEventListener('submit', async function (e) {
  e.preventDefault();
  var nut = $('nutVao');
  nut.disabled = true; nut.textContent = 'CHECKING_CREDENTIALS…';
  var r = await dangNhap($('user').value, $('pass').value);
  if (r.error) {
    baoLoi(r.error);
    nut.disabled = false; nut.textContent = 'AUTH_SIGN_IN';
  } else {
    try {
      var s = await sb.auth.getSession();
      if (s.data.session) {
        var rp = await sb.from('profiles').select('role').eq('id', s.data.session.user.id).single();
        if (rp.data && rp.data.role === 'parent') {
          window.location.href = 'phu-huynh';
          return;
        }
      }
    } catch (err) {}
    window.location.href = 'trang-chu';
  }
});
</script>
</body>
</html>
