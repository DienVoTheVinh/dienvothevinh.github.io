<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — VinhMath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="vinhmath.css?v=1.6">
<style>
body {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  margin: 0;
  overflow-x: hidden;
  background: var(--bg);
  transition: background 0.3s ease;
  font-family: var(--font-sans);
}

@media(max-width: 900px) {
  body {
    grid-template-columns: 1fr;
  }
  .side {
    display: none !important;
  }
}

/* Fullscreen Cyberpunk Canvas */
#cyberCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
  opacity: var(--canvas-opacity, 0.25);
  transition: opacity 0.2s ease;
}

/* --- SIDE PANEL (LEFT) --- */
.side {
  background: linear-gradient(to right, var(--bg) 35%, color-mix(in srgb, var(--bg) 35%, transparent) 75%, transparent 100%);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 56px;
  position: relative;
  overflow: hidden;
  z-index: 1;
}

.side .quote {
  font-size: clamp(1.6rem, 2.8vw, 2.2rem);
  font-weight: 800;
  line-height: 1.35;
  letter-spacing: -0.02em;
  max-width: 18ch;
  position: relative;
}
.side .quote .accent {
  color: var(--accent);
  position: relative;
  display: inline-block;
}
.side .quote .accent::after {
  content: "";
  position: absolute;
  bottom: 4px;
  left: 0;
  width: 100%;
  height: 8px;
  background: color-mix(in srgb, var(--accent) 15%, transparent);
  z-index: -1;
  border-radius: 4px;
}
.side .who {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--ink-2);
  margin-top: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.side .who::before {
  content: "";
  width: 24px;
  height: 1.5px;
  background: var(--line-2);
}

/* --- MAIN PANEL (RIGHT) --- */
.main {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 48px 32px;
  position: relative;
}

/* Cyberpunk Glassmorphic Box */
.box {
  width: 100%;
  max-width: 400px;
  background: color-mix(in srgb, var(--surface) 80%, transparent);
  border: 1px solid var(--line);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: var(--r-md);
  padding: 40px;
  box-shadow: var(--shadow), 0 0 20px var(--accent-soft);
  position: relative;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.box::before, .box::after {
  content: "";
  position: absolute;
  width: 16px;
  height: 16px;
  border-color: var(--accent);
  border-style: solid;
  pointer-events: none;
  transition: border-color 0.3s ease;
}
.box::before {
  top: -1px;
  left: -1px;
  border-width: 3px 0 0 3px;
}
.box::after {
  bottom: -1px;
  right: -1px;
  border-width: 0 3px 3px 0;
}
.box:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.15), 0 0 25px var(--accent-soft);
}

.box h1 {
  font-size: 1.5rem;
  font-weight: 800;
  margin: 24px 0 8px;
  letter-spacing: -0.02em;
  font-family: var(--font-mono);
}
.box .sub {
  font-size: 0.92rem;
  margin-bottom: 32px;
  color: var(--ink-2);
}

.theme-toggle {
  position: absolute;
  top: 24px;
  right: 28px;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  background: var(--surface);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: all 0.2s ease;
  z-index: 10;
}
.theme-toggle:hover {
  transform: scale(1.08);
  border-color: var(--line-2);
}

.field {
  position: relative;
  margin-bottom: 24px;
}
.field label {
  display: block;
  font-size: 0.82rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--ink-2);
  margin-bottom: 8px;
  font-family: var(--font-mono);
}
.input {
  font-family: var(--font-mono);
  background: color-mix(in srgb, var(--surface-2) 40%, transparent);
  border: 1px solid var(--line);
  color: var(--ink);
  border-radius: var(--r-sm);
  padding: 12px 16px;
  width: 100%;
  box-sizing: border-box;
  transition: all 0.2s ease;
}
.input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 12px var(--accent-soft);
  transform: translateY(-1px);
}

.show-pass {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.1rem;
  color: var(--ink-3);
  transition: color 0.15s;
}
.show-pass:hover {
  color: var(--ink-2);
}

.btn-primary {
  background: var(--accent-gradient);
  border: none;
  color: #fff;
  font-family: var(--font-sans);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-radius: var(--r-sm);
  padding: 14px 24px;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 15px var(--accent-soft);
  position: relative;
  overflow: hidden;
  z-index: 1;
}
.btn-primary::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(to right, transparent, rgba(255,255,255,0.15), transparent);
  transform: translateX(-100%);
  transition: transform 0.6s ease;
  z-index: -1;
}
.btn-primary:hover::after {
  transform: translateX(100%);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px var(--accent-soft), 0 0 15px var(--accent);
}

.hint {
  margin-top: 28px;
  font-size: 0.82rem;
  color: var(--ink-2);
  text-align: center;
  background: var(--surface-2);
  border-radius: var(--r-md);
  padding: 14px 18px;
  line-height: 1.45;
  border: 1px solid var(--line);
}

.alert {
  display: none;
  font-size: 0.88rem;
  font-weight: 500;
  border-radius: var(--r-md);
  padding: 12px 16px;
  margin-bottom: 20px;
  line-height: 1.4;
  border: 1px solid transparent;
  animation: slideDown 0.3s ease;
}
.alert.err {
  display: block;
  background: var(--err-soft);
  color: var(--err);
  border-color: color-mix(in srgb, var(--err) 15%, transparent);
}
.alert.warn {
  display: block;
  background: var(--warn-soft);
  color: var(--warn);
  border-color: color-mix(in srgb, var(--warn) 15%, transparent);
}

@keyframes slideDown {
  from { transform: translateY(-10px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.cyber-cursor {
  animation: blink 1s step-start infinite;
  color: var(--accent);
}
@keyframes blink {
  50% { opacity: 0; }
}
</style>
</head>
<body>

<canvas id="cyberCanvas"></canvas>

<div class="side">
  <a class="logo" href="index.html"><span class="dot">V</span>VinhMath <small>· Lớp Toán Thầy Vinh</small></a>
  


  <div>
    <p class="quote">"Toán không phải là nhớ công thức. Là <span class="accent">nhìn ra con đường</span> đi đến lời giải."</p>
    <p class="who">Thầy Vinh</p>
  </div>
  <p style="font-size:0.82rem;color:var(--ink-3); font-family: var(--font-mono)">© 2026 VinhMath · Lớp Toán Thầy Vinh</p>
</div>

<div class="main">
  <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="Đổi chế độ sáng/tối">🌙</button>
  <div class="box">
    <a class="logo" href="index.html" style="display:inline-flex"><span class="dot">V</span>VinhMath</a>
    <h1>SYSTEM_ACCESS<span class="cyber-cursor">_</span></h1>
    <p class="sub">Đăng nhập cổng bảo mật để vào hệ thống học tập.</p>

    <div class="alert" id="thongBao"></div>

    <form id="formDangNhap">
      <div class="field">
        <label for="user">USER_NAME</label>
        <input class="input" id="user" placeholder="vd: NguyenVanA@hs.vinhmath" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="pass">PASSWORD</label>
        <div style="position:relative">
          <input class="input" type="password" id="pass" placeholder="••••••••" autocomplete="current-password" style="padding-right:42px" required>
          <button type="button" class="show-pass" onclick="togglePass()" id="eyeBtn">👁</button>
        </div>
      </div>
      <button class="btn btn-primary" type="submit" id="nutVao" style="width:100%; margin-top: 10px;">AUTH_SIGN_IN</button>
    </form>

    <p class="hint" style="font-family: var(--font-mono);">Quên mật khẩu? Nhắn thầy qua Zalo hoặc Facebook để được cấp lại.</p>
  </div>
</div>

<!-- Thư viện Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="vinhmath.js?v=1.6"></script>
<script src="analytics.js"></script>
<script>
// --- INTERACTIVE CYBERMATH CANVAS ---
var canvas = document.getElementById('cyberCanvas');
var ctx = canvas.getContext('2d');

var themeIsDark = document.documentElement.getAttribute('data-theme') === 'dark';

// Resizing
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  initMatrix();
}
window.addEventListener('resize', resize);

// Matrix rain variables
var mathSymbols = ['∫', '∑', '∞', 'π', 'θ', 'λ', '√', 'Δ', '∇', '∂', 'f(x)', 'e^{iπ}+1=0', 'lim', 'dx', 'dy', 'log', 'matrix', 'sin(x)', 'cos(x)', 'x²', 'y³', 'λ', 'θ', 'δ', 'dx/dy', 'G(x)', 'P(A|B)'];
var columns = [];

function initMatrix() {
  var cols = Math.floor(canvas.width / 24);
  columns = [];
  for (var i = 0; i < cols; i++) {
    columns.push({
      x: i * 24,
      y: Math.random() * -canvas.height,
      speed: 0.5 + Math.random() * 1.5
    });
  }
}

// Lorenz Attractor simulation (Butterfly Effect: two paths with slight variation)
var points1 = [];
var points2 = [];
var lx1 = 0.1, ly1 = 0, lz1 = 0;
var lx2 = 0.101, ly2 = 0, lz2 = 0; // slight difference in initial conditions
var sigma = 10, rho = 28, beta = 8/3;
var dt = 0.005;

// Generate Lorenz points for Path 1
for (var i = 0; i < 900; i++) {
  var dx = sigma * (ly1 - lx1) * dt;
  var dy = (lx1 * (rho - lz1) - ly1) * dt;
  var dz = (lx1 * ly1 - beta * lz1) * dt;
  lx1 += dx;
  ly1 += dy;
  lz1 += dz;
  points1.push({ x: lx1, y: ly1, z: lz1 });
}

// Generate Lorenz points for Path 2 (diverges slightly)
for (var i = 0; i < 900; i++) {
  var dx = sigma * (ly2 - lx2) * dt;
  var dy = (lx2 * (rho - lz2) - ly2) * dt;
  var dz = (lx2 * ly2 - beta * lz2) * dt;
  lx2 += dx;
  ly2 += dy;
  lz2 += dz;
  points2.push({ x: lx2, y: ly2, z: lz2 });
}

// 3D rotation angles
var angleX = -0.3;
var angleY = 0.5;
var mouseX = window.innerWidth / 2;
var mouseY = window.innerHeight / 2;

window.addEventListener('mousemove', function(e) {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

// Helper function to draw concentric 3D orbit grids
function drawMathRings(origin, radius, color, projectFn) {
  ctx.lineWidth = 0.8;
  ctx.strokeStyle = color;
  ctx.setLineDash([4, 4]); // tech dashed lines
  
  // Equator circle (Horizontal)
  ctx.beginPath();
  for (var theta = 0; theta <= Math.PI * 2 + 0.1; theta += 0.1) {
    var pt = {
      x: origin.x + radius * Math.cos(theta),
      y: origin.y + radius * Math.sin(theta),
      z: origin.z
    };
    var proj = projectFn(pt);
    if (theta === 0) ctx.moveTo(proj.x, proj.y);
    else ctx.lineTo(proj.x, proj.y);
  }
  ctx.stroke();
  
  // Prime Meridian circle (Vertical)
  ctx.beginPath();
  for (var theta = 0; theta <= Math.PI * 2 + 0.1; theta += 0.1) {
    var pt = {
      x: origin.x + radius * Math.cos(theta),
      y: origin.y,
      z: origin.z + radius * Math.sin(theta)
    };
    var proj = projectFn(pt);
    if (theta === 0) ctx.moveTo(proj.x, proj.y);
    else ctx.lineTo(proj.x, proj.y);
  }
  ctx.stroke();
  
  ctx.setLineDash([]); // reset dash style
}

// Animation loop
function draw() {
  themeIsDark = document.documentElement.getAttribute('data-theme') === 'dark';
  
  // Matrix rain fade background (smaller opacity for longer/clearer trails)
  ctx.fillStyle = themeIsDark ? 'rgba(5, 8, 17, 0.12)' : 'rgba(245, 248, 255, 0.12)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Draw Matrix Rain (increased contrast and size)
  ctx.font = '12px monospace';
  for (var i = 0; i < columns.length; i++) {
    var col = columns[i];
    var sym = mathSymbols[Math.floor(Math.random() * mathSymbols.length)];
    
    // Faint trails (much softer to avoid eye strain)
    ctx.fillStyle = themeIsDark ? 'rgba(0, 242, 254, 0.05)' : 'rgba(37, 99, 235, 0.04)';
    ctx.fillText(sym, col.x, col.y);
    
    // Glowing active head of the rain column (softer)
    if (Math.random() > 0.35) {
      ctx.fillStyle = themeIsDark ? 'rgba(255, 255, 255, 0.25)' : 'rgba(37, 99, 235, 0.20)';
      ctx.fillText(sym, col.x, col.y);
    }
    
    col.y += col.speed * 3.5;
    if (col.y > canvas.height) {
      col.y = Math.random() * -100;
    }
  }
  
  // Smooth automatic continuous Y rotation + subtle mouse offset tilt
  var autoRotateY = Date.now() * 0.0003;
  var autoRotateX = Math.sin(Date.now() * 0.0001) * 0.15;
  var targetAngleX = autoRotateX + (mouseY - canvas.height / 2) * 0.0005;
  var targetAngleY = autoRotateY + (mouseX - canvas.width / 2) * 0.0005;
  angleX += (targetAngleX - angleX) * 0.05;
  angleY += (targetAngleY - angleY) * 0.05;
  
  // Dynamic centering: Position it perfectly in the center of the .side panel
  var sideEl = document.querySelector('.side');
  var centerX = canvas.width * 0.28;
  var centerY = canvas.height / 2;
  if (sideEl) {
    var rect = sideEl.getBoundingClientRect();
    centerX = rect.left + rect.width / 2;
    centerY = rect.top + rect.height / 2;
  }
  var zoom = Math.min(canvas.width, canvas.height) * 0.016; // 33% larger zoom to make it prominent
  var focalLength = 300;
  
  // Project function
  function project(pt) {
    var cx = pt.x;
    var cy = pt.y;
    var cz = pt.z - 25; // center the attractor
    
    // Rotate Y
    var cosY = Math.cos(angleY);
    var sinY = Math.sin(angleY);
    var x1 = cx * cosY - cz * sinY;
    var z1 = cx * sinY + cz * cosY;
    
    // Rotate X
    var cosX = Math.cos(angleX);
    var sinX = Math.sin(angleX);
    var y2 = cy * cosX - z1 * sinX;
    var z2 = cy * sinX + z1 * cosX;
    
    var scale = focalLength / (focalLength + z2);
    return {
      x: centerX + x1 * scale * zoom,
      y: centerY + y2 * scale * zoom,
      depth: z2
    };
  }
  
  // Draw 3D Axes (subtle)
  var axes = [
    { pt: { x: 30, y: 0, z: 25 }, label: 'X_axis', color: themeIsDark ? 'rgba(0, 240, 255, 0.4)' : 'rgba(37, 99, 235, 0.3)' },
    { pt: { x: 0, y: 30, z: 25 }, label: 'Y_axis', color: themeIsDark ? 'rgba(255, 0, 127, 0.4)' : 'rgba(239, 68, 68, 0.3)' },
    { pt: { x: 0, y: 0, z: 55 }, label: 'Z_axis', color: themeIsDark ? 'rgba(245, 158, 11, 0.4)' : 'rgba(245, 158, 11, 0.3)' }
  ];
  
  var originProj = project({ x: 0, y: 0, z: 25 });
  ctx.lineWidth = 1.2;
  axes.forEach(function(axis) {
    var ptProj = project(axis.pt);
    ctx.strokeStyle = axis.color;
    ctx.beginPath();
    ctx.moveTo(originProj.x, originProj.y);
    ctx.lineTo(ptProj.x, ptProj.y);
    ctx.stroke();
    
    ctx.fillStyle = axis.color;
    ctx.font = '9px monospace';
    ctx.fillText(axis.label, ptProj.x + 4, ptProj.y + 4);
  });
  
  // Draw concentric math coordinate grid rings (New Decor)
  var ringColor = themeIsDark ? 'rgba(0, 242, 254, 0.12)' : 'rgba(37, 99, 235, 0.1)';
  drawMathRings({ x: 0, y: 0, z: 25 }, 24, ringColor, project);
  drawMathRings({ x: 0, y: 0, z: 25 }, 36, ringColor, project);
  
  var accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2563eb';
  
  // Draw Lorenz Attractor Path 1 (Cyan/Blue - Brighter)
  ctx.beginPath();
  var start = project(points1[0]);
  ctx.moveTo(start.x, start.y);
  for (var i = 1; i < points1.length; i++) {
    var pt = project(points1[i]);
    ctx.lineTo(pt.x, pt.y);
  }
  ctx.strokeStyle = themeIsDark ? 'rgba(0, 242, 254, 0.85)' : 'rgba(37, 99, 235, 0.7)';
  ctx.lineWidth = 1.8;
  ctx.shadowBlur = themeIsDark ? 8 : 2;
  ctx.shadowColor = themeIsDark ? '#00f2fe' : accentColor;
  ctx.stroke();
  
  // Draw Lorenz Attractor Path 2 (Divergent Path - Yellow/Violet - Brighter)
  ctx.beginPath();
  var start2 = project(points2[0]);
  ctx.moveTo(start2.x, start2.y);
  for (var i = 1; i < points2.length; i++) {
    var pt = project(points2[i]);
    ctx.lineTo(pt.x, pt.y);
  }
  ctx.strokeStyle = themeIsDark ? 'rgba(245, 158, 11, 0.65)' : 'rgba(139, 92, 246, 0.55)';
  ctx.lineWidth = 1.4;
  ctx.shadowColor = themeIsDark ? '#fbbf24' : '#8b5cf6';
  ctx.stroke();
  
  ctx.shadowBlur = 0; // reset blur
  
  // Draw flowing sparks along Path 1
  var timeIndex = Math.floor((Date.now() / 15) % points1.length);
  var sparkCount = 3;
  ctx.fillStyle = themeIsDark ? '#ffffff' : accentColor;
  for (var j = 0; j < sparkCount; j++) {
    var idx = (timeIndex + Math.floor(j * points1.length / sparkCount)) % points1.length;
    var sparkProj = project(points1[idx]);
    ctx.beginPath();
    ctx.arc(sparkProj.x, sparkProj.y, 4.5, 0, Math.PI * 2);
    ctx.shadowBlur = themeIsDark ? 12 : 3;
    ctx.shadowColor = themeIsDark ? '#00f2fe' : accentColor;
    ctx.fill();
  }
  
  // Draw divergent sparks along Path 2
  ctx.fillStyle = themeIsDark ? '#ffeeb5' : '#8b5cf6';
  for (var j = 0; j < sparkCount; j++) {
    var idx = (timeIndex + Math.floor(j * points2.length / sparkCount) + 120) % points2.length;
    var sparkProj = project(points2[idx]);
    ctx.beginPath();
    ctx.arc(sparkProj.x, sparkProj.y, 3.5, 0, Math.PI * 2);
    ctx.shadowBlur = themeIsDark ? 8 : 2;
    ctx.shadowColor = themeIsDark ? '#fbbf24' : '#8b5cf6';
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  
  requestAnimationFrame(draw);
}

resize();
draw();

// --- LOGIN LOGIC ---
function togglePass() {
  var p = $('pass');
  p.type = p.type === 'password' ? 'text' : 'password';
  $('eyeBtn').textContent = p.type === 'password' ? '👁' : '🙈';
}

function baoLoi(msg, loai) {
  var el = $('thongBao');
  el.className = 'alert ' + (loai || 'err');
  el.textContent = msg;
}

// Chưa điền config.js → nhắc nhẹ (chế độ xem thử)
if (!daKetNoi()) {
  baoLoi('Chế độ xem thử: web chưa kết nối Supabase nên chưa đăng nhập được thật.', 'warn');
}

// Đã đăng nhập từ trước → vào thẳng trang chủ
if (daKetNoi()) {
  sb.auth.getSession().then(function (s) {
    if (s.data.session) window.location.href = 'trang-chu.html';
  });
}

// Xử lý khi bấm nút "AUTH_SIGN_IN"
$('formDangNhap').addEventListener('submit', async function (e) {
  e.preventDefault();
  var nut = $('nutVao');
  nut.disabled = true; nut.textContent = 'CHECKING_CREDENTIALS…';
  var r = await dangNhap($('user').value, $('pass').value);
  if (r.error) {
    baoLoi(r.error);
    nut.disabled = false; nut.textContent = 'AUTH_SIGN_IN';
  } else {
    window.location.href = 'trang-chu.html';
  }
});
</script>
</body>
</html>
