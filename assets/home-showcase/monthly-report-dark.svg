<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc"><title id="title">Báo cáo tháng — học sinh minh họa</title><desc id="desc">Dữ liệu giả định, không phải kết quả của học sinh thật. Chuyên cần 100%, đã nộp bài 88%, nộp đúng hạn 75%, đã xem bài 90%.</desc><style>text{font-family:Arial,'Segoe UI',sans-serif;fill:#e8edf5}.muted{fill:#aab6c7}.accent{fill:#efba53}</style><rect x="1" y="1" width="1438" height="1058" rx="24" fill="#10141b" stroke="#344051"/><rect x="24" y="24" width="1392" height="184" rx="18" fill="#262216" stroke="none"/><text x="48" y="62" font-size="23" font-weight="700" class="accent" text-anchor="start">VINHMATH · BÁO CÁO HỌC TẬP</text><rect x="48" y="99" width="64" height="64" rx="18" fill="#efba53" stroke="none"/><text x="80" y="140" text-anchor="middle" style="fill:#fff" font-size="24" font-weight="700">HS</text><text x="130" y="126" font-size="28" font-weight="700" class="" text-anchor="start">HỌC SINH MINH HỌA</text><text x="130" y="157" font-size="18" font-weight="400" class="muted" text-anchor="start">Khối 7 · Không hiển thị danh tính</text><text x="1385" y="107" font-size="17" font-weight="700" class="accent" text-anchor="end">BÁO CÁO THÁNG</text><text x="1385" y="137" font-size="20" font-weight="600" class="" text-anchor="end">01/09/2026 — 30/09/2026</text><text x="1385" y="166" font-size="15" font-weight="600" class="muted" text-anchor="end">DỮ LIỆU GIẢ ĐỊNH</text><rect x="48" y="238" width="214" height="182" rx="16" fill="#171d27" stroke="#344051"/><text x="66" y="267" font-size="14" font-weight="700" class="accent" text-anchor="start">01</text><text x="66" y="313" font-size="34" font-weight="700" class="" text-anchor="start">100%</text><text x="66" y="345" font-size="18" font-weight="600" class="" text-anchor="start">Chuyên cần</text><text x="66" y="374" font-size="15" font-weight="400" class="muted" text-anchor="start">8/8 buổi có mặt</text><rect x="66" y="395" width="178" height="4" rx="2" fill="#344051" stroke="none"/><rect x="66" y="395" width="178" height="4" rx="2" fill="#efba53" stroke="none"/><rect x="274" y="238" width="214" height="182" rx="16" fill="#171d27" stroke="#344051"/><text x="292" y="267" font-size="14" font-weight="700" class="accent" text-anchor="start">02</text><text x="292" y="313" font-size="34" font-weight="700" class="" text-anchor="start">88%</text><text x="292" y="345" font-size="18" font-weight="600" class="" text-anchor="start">Đã nộp bài</text><text x="292" y="374" font-size="15" font-weight="400" class="muted" text-anchor="start">7/8 bài bắt buộc</text><rect x="292" y="395" width="178" height="4" rx="2" fill="#344051" stroke="none"/><rect x="292" y="395" width="155.75" height="4" rx="2" fill="#efba53" stroke="none"/><rect x="500" y="238" width="214" height="182" rx="16" fill="#171d27" stroke="#344051"/><text x="518" y="267" font-size="14" font-weight="700" class="accent" text-anchor="start">03</text><text x="518" y="313" font-size="34" font-weight="700" class="" text-anchor="start">75%</text><text x="518" y="345" font-size="18" font-weight="600" class="" text-anchor="start">Nộp đúng hạn</text><text x="518" y="374" font-size="15" font-weight="400" class="muted" text-anchor="start">6/8 bài đúng hạn</text><rect x="518" y="395" width="178" height="4" rx="2" fill="#344051" stroke="none"/><rect x="518" y="395" width="133.5" height="4" rx="2" fill="#efba53" stroke="none"/><rect x="726" y="238" width="214" height="182" rx="16" fill="#171d27" stroke="#344051"/><text x="744" y="267" font-size="14" font-weight="700" class="accent" text-anchor="start">04</text><text x="744" y="313" font-size="34" font-weight="700" class="" text-anchor="start">90%</text><text x="744" y="345" font-size="18" font-weight="600" class="" text-anchor="start">Đã xem bài</text><text x="744" y="374" font-size="15" font-weight="400" class="muted" text-anchor="start">9/10 bài đã mở</text><rect x="744" y="395" width="178" height="4" rx="2" fill="#344051" stroke="none"/><rect x="744" y="395" width="160.20000000000002" height="4" rx="2" fill="#efba53" stroke="none"/><rect x="952" y="238" width="214" height="182" rx="16" fill="#171d27" stroke="#344051"/><text x="970" y="267" font-size="14" font-weight="700" class="accent" text-anchor="start">05</text><text x="970" y="313" font-size="34" font-weight="700" class="" text-anchor="start">12,4 h</text><text x="970" y="345" font-size="18" font-weight="600" class="" text-anchor="start">Tự học trên web</text><text x="970" y="374" font-size="15" font-weight="400" class="muted" text-anchor="start">Thời gian minh họa</text><rect x="1178" y="238" width="214" height="182" rx="16" fill="#171d27" stroke="#344051"/><text x="1196" y="267" font-size="14" font-weight="700" class="accent" text-anchor="start">06</text><text x="1196" y="313" font-size="34" font-weight="700" class="" text-anchor="start">8,0</text><text x="1196" y="345" font-size="18" font-weight="600" class="" text-anchor="start">Điểm trung bình</text><text x="1196" y="374" font-size="15" font-weight="400" class="muted" text-anchor="start">4 bài có điểm</text><rect x="1196" y="395" width="178" height="4" rx="2" fill="#344051" stroke="none"/><rect x="1196" y="395" width="142.4" height="4" rx="2" fill="#efba53" stroke="none"/><rect x="48" y="452" width="768" height="514" rx="16" fill="#171d27" stroke="#344051"/><text x="72" y="493" font-size="23" font-weight="700" class="" text-anchor="start">Nhận định dành cho phụ huynh</text><rect x="72" y="517" width="720" height="122" rx="16" fill="#172e29" stroke="#344051"/><rect x="89" y="535" width="32" height="32" rx="9" fill="#171d27" stroke="none"/><text x="105" y="557" font-size="18" font-weight="700" class="accent" text-anchor="middle">1</text><text x="136" y="556" font-size="20" font-weight="700" class="" text-anchor="start">Ưu điểm</text><text x="136" y="586" font-size="18" font-weight="400" class="muted" text-anchor="start">• Duy trì đủ các buổi học trong tháng.</text><text x="136" y="613" font-size="18" font-weight="400" class="muted" text-anchor="start">• Có thói quen xem bài trước khi luyện tập.</text><rect x="72" y="657" width="720" height="122" rx="16" fill="#30251d" stroke="#344051"/><rect x="89" y="675" width="32" height="32" rx="9" fill="#171d27" stroke="none"/><text x="105" y="697" font-size="18" font-weight="700" class="accent" text-anchor="middle">2</text><text x="136" y="696" font-size="20" font-weight="700" class="" text-anchor="start">Hạn chế</text><text x="136" y="726" font-size="18" font-weight="400" class="muted" text-anchor="start">• Còn một bài tập bắt buộc chưa hoàn thành.</text><text x="136" y="753" font-size="18" font-weight="400" class="muted" text-anchor="start">• Cần xem lại đầy đủ nhận xét của giáo viên.</text><rect x="72" y="797" width="720" height="122" rx="16" fill="#262216" stroke="#344051"/><rect x="89" y="815" width="32" height="32" rx="9" fill="#171d27" stroke="none"/><text x="105" y="837" font-size="18" font-weight="700" class="accent" text-anchor="middle">3</text><text x="136" y="836" font-size="20" font-weight="700" class="" text-anchor="start">Cần cải thiện</text><text x="136" y="866" font-size="18" font-weight="400" class="muted" text-anchor="start">• Hoàn thành bài còn thiếu và sửa lỗi đã được chỉ ra.</text><text x="136" y="893" font-size="18" font-weight="400" class="muted" text-anchor="start">• Chia thời gian ôn tập thành các buổi ngắn, đều đặn.</text><rect x="840" y="452" width="552" height="514" rx="16" fill="#171d27" stroke="#344051"/><text x="864" y="493" font-size="23" font-weight="700" class="" text-anchor="start">Chi tiết trong kỳ</text><rect x="864" y="518" width="504" height="126" rx="16" fill="#10141b" stroke="#344051"/><text x="882" y="546" font-size="18" font-weight="700" class="accent" text-anchor="start">Chuyên cần</text><text x="882" y="573" font-size="17" font-weight="400" class="muted" text-anchor="start">Có mặt</text><text x="1348" y="573" font-size="17" font-weight="600" class="" text-anchor="end">8/8 buổi</text><text x="882" y="599" font-size="17" font-weight="400" class="muted" text-anchor="start">Vắng</text><text x="1348" y="599" font-size="17" font-weight="600" class="" text-anchor="end">0 buổi</text><text x="882" y="625" font-size="17" font-weight="400" class="muted" text-anchor="start">Đi muộn</text><text x="1348" y="625" font-size="17" font-weight="600" class="" text-anchor="end">0 buổi</text><rect x="864" y="658" width="504" height="126" rx="16" fill="#10141b" stroke="#344051"/><text x="882" y="686" font-size="18" font-weight="700" class="accent" text-anchor="start">Bài tập bắt buộc</text><text x="882" y="713" font-size="17" font-weight="400" class="muted" text-anchor="start">Đã nộp</text><text x="1348" y="713" font-size="17" font-weight="600" class="" text-anchor="end">7/8 bài</text><text x="882" y="739" font-size="17" font-weight="400" class="muted" text-anchor="start">Đúng hạn</text><text x="1348" y="739" font-size="17" font-weight="600" class="" text-anchor="end">6/8 bài</text><text x="882" y="765" font-size="17" font-weight="400" class="muted" text-anchor="start">Đã xem lại bài chấm</text><text x="1348" y="765" font-size="17" font-weight="600" class="" text-anchor="end">5/6 bài</text><rect x="864" y="798" width="504" height="126" rx="16" fill="#10141b" stroke="#344051"/><text x="882" y="826" font-size="18" font-weight="700" class="accent" text-anchor="start">Bài tập thưởng thêm</text><text x="882" y="853" font-size="17" font-weight="400" class="muted" text-anchor="start">Đã nộp</text><text x="1348" y="853" font-size="17" font-weight="600" class="" text-anchor="end">2/3 bài</text><text x="882" y="879" font-size="17" font-weight="400" class="muted" text-anchor="start">Đúng hạn</text><text x="1348" y="879" font-size="17" font-weight="600" class="" text-anchor="end">2/3 bài</text><text x="882" y="905" font-size="17" font-weight="400" class="muted" text-anchor="start">Đã xem lại bài chấm</text><text x="1348" y="905" font-size="17" font-weight="600" class="" text-anchor="end">2/2 bài</text><path d="M48 998H1392" stroke="#344051"/><text x="48" y="1030" font-size="16" font-weight="400" class="muted" text-anchor="start">Minh họa giao diện · Dữ liệu giả định, không phải báo cáo của học sinh thật.</text><text x="1392" y="1030" font-size="16" font-weight="600" class="accent" text-anchor="end">VinhMath</text></svg>