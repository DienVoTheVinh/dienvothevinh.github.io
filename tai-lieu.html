<!DOCTYPE html>
<html lang="vi">
<head>
<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="favicon.png?v=3">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tài liệu — VinhMath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=5.2">
<link rel="stylesheet" href="css/vinhmath.css?v=5.2">
<style>
.wrap{max-width:880px;margin:0 auto;padding:0 24px 96px}
.head{padding:48px 0 24px;display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.doc{display:flex;align-items:center;gap:16px;padding:16px 20px}
.doc + .doc{margin-top:12px}
.doc .ic{width:44px;height:44px;border-radius:11px;background:var(--err-soft);color:var(--err);display:grid;place-items:center;font-size:1.1rem;flex:none}
.doc .info{flex:1;min-width:0}
.doc h3{font-size:1rem}
.doc .meta{font-size:.8rem;color:var(--ink-3);margin-top:2px}
.empty{text-align:center;padding:64px 24px;color:var(--ink-3)}
</style>
</head>
<body>

<div class="topbar">
  <div class="nav">
    <a class="logo" href="index"><img src="img/logo.png" alt="VinhMath"><span style="display: inline-flex; align-items: center; gap: 0;"><span class="brand-vinh" style="color: var(--accent) !important;">Vinh</span><span class="brand-math" style="color: var(--topbar-text, #ffffff) !important;">Math</span></span> <small>· Lớp Toán Thầy Vinh</small></a>
    <nav class="navlinks">
      <a href="lop-hoc">Học tập</a>
      <a href="luyen-de">Luyện đề</a>
      <a href="tai-lieu" class="active">Tài liệu</a>
    </nav>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="btn btn-ghost btn-sm" id="themeBtn" onclick="toggleTheme()">🌙</button>
      <button class="btn btn-secondary btn-sm" onclick="dangXuat()">Đăng xuất</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="head">
    <div>
      <div class="sec-label">Kho tài liệu</div>
      <h1>Tài liệu của lớp</h1>
      <p style="margin-top:6px">Tài liệu thầy biên soạn — xem online hoặc tải về in.</p>
    </div>
    <a class="btn btn-primary btn-sm" id="nutSoan" href="quan-tri-tai-lieu" style="display:none">+ Soạn tài liệu</a>
  </div>

  <div class="tab-box" id="tabLopHocSinh" style="display:none; margin-bottom: 24px;"></div>
  <div id="dsTaiLieu"><div class="empty card">Đang tải…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/vinhmath.js?v=7.1"></script>
<script src="js/menu-v5.js"></script>
<script src="js/analytics.js"></script>
<script>
var dsHocSinhLop = [];
var selectedClassId = null;
var isStaff = false;

function urlPdf(path) {
  if (!path) return '';
  if (path.startsWith('http://') || path.startsWith('https://')) return path;
  return VM.SUPABASE_URL + '/storage/v1/object/public/tai-lieu/' + path;
}

async function taiTaiLieuHocSinh() {
  $('dsTaiLieu').innerHTML = '<div class="empty card">Đang tải…</div>';
  var query = sb.from('documents')
    .select('id, title, file_path, created_at, class_id, classes(name, is_specialized), topics(name)');
  
  if (!isStaff) {
    if (selectedClassId) {
      query = query.or('class_id.is.null,class_id.eq.' + selectedClassId);
    } else {
      query = query.is('class_id', null);
    }
  }
  
  var r = await query.order('created_at', { ascending: false });
  var ds = r.data || [];

  if (!ds.length) {
    $('dsTaiLieu').innerHTML = '<div class="empty card">Chưa có tài liệu nào — quay lại sau nhé!</div>';
    return;
  }
  $('dsTaiLieu').innerHTML = ds.map(function (d) {
    var ngay = new Date(d.created_at).toLocaleDateString('vi-VN');
    var classText = d.classes ? 'Lớp ' + d.classes.name + (d.classes.is_specialized ? ' (Chuyên)' : ' (Đại trà)') : 'Mọi lớp';
    var meta = [d.topics && d.topics.name, classText, ngay]
      .filter(Boolean).join(' · ');
    return '<div class="card doc">' +
      '<span class="ic">📄</span>' +
      '<div class="info"><h3>' + d.title + '</h3><div class="meta">' + meta + '</div></div>' +
      '<a class="btn btn-primary btn-sm" target="_blank" href="' + urlPdf(d.file_path) + '">Xem</a>' +
      '<a class="btn btn-secondary btn-sm" download href="' + urlPdf(d.file_path) + '">Tải về</a>' +
      '</div>';
  }).join('');
}

async function chonLopHocSinh(classId) {
  selectedClassId = classId;
  localStorage.setItem('vm-active-class-id', classId);
  
  // Cập nhật tab active
  document.querySelectorAll('#tabLopHocSinh .tab-btn').forEach(function (btn) {
    btn.classList.remove('active');
  });
  var actTab = $('tab-class-' + classId);
  if (actTab) actTab.classList.add('active');
  
  await taiTaiLieuHocSinh();
}

(async function () {
  if (!daKetNoi()) {
    $('dsTaiLieu').innerHTML = '<div class="empty card">Chế độ xem thử — kết nối Supabase để thấy tài liệu thật.</div>';
    return;
  }
  var hoSo = await yeuCauDangNhap();
  if (!hoSo) return;
  isStaff = hoSo.role === 'teacher' || hoSo.role === 'admin';
  if (isStaff) $('nutSoan').style.display = '';

  // Menu quản trị động được tự động vẽ bởi menu.js

  dsHocSinhLop = hoSo.class_students || [];
  
  // Xác định class_id hoạt động
  if (dsHocSinhLop.length > 0) {
    var savedClassId = localStorage.getItem('vm-active-class-id');
    var exists = dsHocSinhLop.some(function(c) { return c.class_id === savedClassId; });
    selectedClassId = (savedClassId && exists) ? savedClassId : dsHocSinhLop[0].class_id;
  }

  // Vẽ các tab chuyển lớp nếu có lớp và không phải quản trị viên
  if (dsHocSinhLop.length > 0 && !isStaff) {
    var tabsBox = $('tabLopHocSinh');
    tabsBox.style.display = 'flex';
    tabsBox.innerHTML = dsHocSinhLop.map(function (cs) {
      if (!cs.classes) return '';
      var name = cs.classes.name + (cs.classes.is_specialized ? ' (Chuyên)' : ' (Đại trà)');
      var active = cs.class_id === selectedClassId ? ' active' : '';
      return '<button class="tab-btn' + active + '" onclick="chonLopHocSinh(\'' + cs.class_id + '\')" id="tab-class-' + cs.class_id + '">' + name + '</button>';
    }).join('');
  }

  await taiTaiLieuHocSinh();
})();
</script>
</body>
</html>
