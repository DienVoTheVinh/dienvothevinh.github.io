<!DOCTYPE html>
<html lang="vi">
<head>
<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="favicon.png?v=3">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài học — VinhMath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=5.2">
<link rel="stylesheet" href="css/vinhmath.css?v=5.5">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
<style>
body, html { margin:0; padding:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); }
.lesson-container { display:flex; flex-direction:column; height:100vh; }

/* ===== Thanh trên cùng ===== */
.topbar-lesson {
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:10px 16px; border-bottom:1px solid var(--line);
  background:var(--surface); height:60px; flex-shrink:0;
}
.topbar-lesson .left { display:flex; align-items:center; gap:10px; min-width:0; }
.back-btn { display:flex; align-items:center; gap:6px; text-decoration:none; font-weight:600; font-size:.9rem; color:var(--ink-2); flex-shrink:0; }
.back-btn:hover { color:var(--accent); }
.lesson-title { font-size:1.02rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.switcher { display:flex; gap:6px; flex-shrink:0; }
.sw-btn {
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2);
  font-family:inherit; font-size:.84rem; font-weight:600; padding:7px 14px;
  border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
}
.sw-btn:hover { color:var(--ink); border-color:var(--ink-3); }
.sw-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.sw-btn:disabled { opacity:.4; cursor:not-allowed; }

.lesson-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex: none;
  position: relative;
  transition: all 0.3s ease;
  margin-right: 8px;
}
.lesson-dot.glowing-dot {
  animation: dot-glow-pulse 1.8s infinite;
}
@keyframes dot-glow-pulse {
  0% {
    box-shadow: 0 0 0 0 var(--glow-color, rgba(37, 99, 235, 0.7));
  }
  70% {
    box-shadow: 0 0 0 6px transparent;
  }
  100% {
    box-shadow: 0 0 0 0 transparent;
  }
}
.new-lesson-badge {
  display: inline-flex;
  align-items: center;
  gap: 1px;
  font-size: 0.62rem;
  font-weight: 800;
  color: #fff;
  background: linear-gradient(135deg, #f59e0b, #ef4444);
  padding: 1px 4px;
  border-radius: 3px;
  margin-left: 5px;
  letter-spacing: 0.05em;
  box-shadow: 0 1.5px 4px rgba(245, 158, 11, 0.35);
  vertical-align: middle;
}

/* ===== Bố cục 3 cột: mục lục | video | nội dung ===== */
.layout { display:flex; flex:1; min-height:0; }

/* Mục lục trái */
.sidebar {
  width:268px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--line);
  overflow-y:auto; padding:14px 0 24px;
}
.sidebar .sb-head { padding:4px 18px 10px; font-size:.78rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); }
.sb-group { padding:10px 18px 4px; font-size:.76rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); }
.sb-item {
  display:block; padding:8px 18px; font-size:.86rem; color:var(--ink-2);
  text-decoration:none; line-height:1.45; border-left:3px solid transparent;
}
.sb-item:hover { background:var(--surface-2); color:var(--ink); }
.sb-item.current { background:var(--accent-soft); color:var(--accent); font-weight:600; border-left-color:var(--accent); }
.sb-item .lock { font-size:.75rem; margin-left:4px; }
/* ===== Mục lục accordion (chuyên đề → bài → mục con + vòng %) ===== */
.ml-topic { border-bottom:1px solid var(--line); }
.ml-topic-hd { display:flex; align-items:center; gap:8px; padding:11px 16px; cursor:pointer; font-size:.75rem; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--accent); user-select:none; }
.ml-topic-hd .tcount { margin-left:auto; font-size:.7rem; font-weight:600; color:var(--ink-3); background:var(--surface-2); border-radius:20px; padding:1px 8px; }
.ml-topic-hd .caret { font-size:.7rem; color:var(--ink-3); transition:transform .2s; }
.ml-topic.open > .ml-topic-hd .caret { transform:rotate(90deg); }
.ml-topic-body { display:none; padding-bottom:4px; }
.ml-topic.open > .ml-topic-body { display:block; }
.ml-bai-hd { display:flex; align-items:center; gap:9px; padding:8px 12px 8px 16px; cursor:pointer; color:var(--ink-2); font-size:.85rem; line-height:1.35; border-left:3px solid transparent; }
.ml-bai-hd:hover { background:var(--surface-2); color:var(--ink); }
.ml-bai.current > .ml-bai-hd { background:var(--accent-soft); color:var(--accent); font-weight:600; border-left-color:var(--accent); }
.ml-bai-hd .ten { flex:1; overflow:hidden; }
.ml-bai-hd .lock { font-size:.72rem; }
.ml-bai-hd .caret2 { font-size:.62rem; color:var(--ink-3); transition:transform .2s; }
.ml-bai.open > .ml-bai-hd .caret2 { transform:rotate(90deg); }
.ml-sub { display:none; }
.ml-bai.open > .ml-sub { display:block; }
.ml-sub a { display:flex; align-items:center; gap:8px; padding:6px 16px 6px 44px; font-size:.82rem; color:var(--ink-2); text-decoration:none; cursor:pointer; }
.ml-sub a:hover { background:var(--surface-2); color:var(--ink); }
.ml-sub a .tick { margin-left:auto; font-size:.82rem; color:var(--ink-3); }
.ml-sub a.done .tick { color:var(--ok, #28a745); }

/* Vùng làm việc */
.workspace { display:flex; flex:1; min-width:0; background:var(--surface-2); }
.pane { flex:1; display:flex; flex-direction:column; min-width:0; position:relative; background:var(--surface); }
.pane-video { border-right:1px solid var(--line); }
.video-wrapper { width:100%; height:100%; background:#000; display:flex; flex-direction:column; }
.video-wrapper iframe { flex:1; width:100%; border:none; }
.pane-control { position:absolute; top:10px; right:10px; z-index:10; display:flex; gap:6px; }
.ctrl-btn { background:rgba(0,0,0,.5); color:#fff; border:none; border-radius:6px; width:30px; height:30px; display:grid; place-items:center; cursor:pointer; font-size:.85rem; }
.ctrl-btn:hover { background:rgba(0,0,0,.8); }
.content-body { flex:1; display:flex; flex-direction:column; min-height:0; }
.pdf-frame { flex:1; width:100%; border:none; background:#f4f4f4; }
.no-content { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; text-align:center; color:var(--ink-3); height:100%; }
.no-content .ic { font-size:3rem; margin-bottom:14px; }
.no-content h3 { color:var(--ink); margin-bottom:8px; }

/* Chế độ không có video: chỉ hiển thị nội dung (tài liệu/bài tập/kiểm tra) toàn khung */
.workspace.no-video .pane-video { display:none !important; }
.workspace.no-video #workspaceResizer { display:none !important; }
.workspace.no-video .pane-content { display:flex !important; flex:1 1 100% !important; width:100% !important; border-right:none; }

/* Tabs di động */
.mobile-tabs { display:none; background:var(--surface); border-bottom:1px solid var(--line); height:46px; flex-shrink:0; }
.mobile-tab-btn { flex:1; border:none; background:transparent; font-family:inherit; font-size:.86rem; font-weight:600; color:var(--ink-2); cursor:pointer; border-bottom:2px solid transparent; }
.mobile-tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); }

@media (max-width:980px) {
  .sidebar { position:fixed; left:0; top:60px; bottom:0; z-index:50; transform:translateX(-100%); transition:transform .2s; box-shadow:var(--shadow); }
  .sidebar.open { transform:translateX(0); }
  .lesson-title { display:none; }
}
@media (max-width:820px) {
  .workspace { flex-direction:column; }
  .pane-video, .pane-content { display:none !important; }
  .workspace.show-video .pane-video { display:flex !important; }
  .workspace.show-content .pane-content { display:flex !important; }
  .mobile-tabs { display:flex; }
  .pane-control { display:none; }
  .switcher .sw-text { display:none; }
}

/* Quiz CSS */
.quiz-container { padding: 24px; overflow-y: auto; flex: 1; background: var(--surface); display: flex; flex-direction: column; gap: 24px; }
.quiz-q { padding-bottom: 20px; border-bottom: 1px dashed var(--line); }
.quiz-text { font-weight: 700; margin-bottom: 14px; font-size: 1.02rem; line-height: 1.5; }
.quiz-choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.quiz-choice { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); cursor: pointer; transition: all .15s; font-size: .92rem; }
.quiz-choice:hover { background: var(--surface-2); }
.quiz-choice.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.quiz-choice.correct { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.quiz-choice.incorrect { border-color: var(--err); background: var(--err-soft); color: var(--err); font-weight: 600; }
.quiz-choice-key { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 1px solid currentColor; font-weight: 700; font-size: .8rem; }
.quiz-sol { margin-top: 14px; padding: 16px; background: var(--surface-2); border-left: 3px solid var(--accent); border-radius: 4px; font-size: .9rem; line-height: 1.6; }

/* Gated Active Reading Styles */
.theory-reading-container { padding: 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 24px; background: var(--bg); }
.theory-section-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 24px; box-shadow: var(--shadow-sm); opacity: 0; transform: translateY(10px); animation: slideUp 0.3s forwards ease-out; }
@keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
.theory-content { font-size: 1.05rem; line-height: 1.7; color: var(--ink); }
.gate-box { border-top: 1px dashed var(--line-2); padding-top: 20px; margin-top: 20px; background: var(--surface-2); border-radius: var(--r-sm); padding: 16px; }
.gate-box.correct { border: 1px solid var(--ok); background: var(--ok-soft); }
.gate-title { font-weight: 700; margin-bottom: 12px; color: var(--accent); display: flex; align-items: center; gap: 8px; }

/* Giao diện Phần II (Đúng/Sai) */
.tf-container { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.tf-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); gap: 12px; }
.tf-statement { font-size: .92rem; flex: 1; }
.tf-btns { display: flex; gap: 6px; }
.tf-btn { border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); font-weight: 600; font-size: .82rem; padding: 6px 14px; border-radius: 6px; cursor: pointer; transition: all .15s; }
.tf-btn:hover { border-color: var(--accent); color: var(--accent); }
.tf-btn.selected-true { background: var(--ok); border-color: var(--ok); color: #fff; }
.tf-btn.selected-false { background: var(--err); border-color: var(--err); color: #fff; }
.tf-btn.correct-true { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.tf-btn.correct-false { background: var(--err-soft); border-color: var(--err); color: var(--err); }

/* Giao diện Phần III (Trả lời ngắn) */
.short-input-container { margin-top: 12px; display: flex; gap: 10px; align-items: center; }
.short-input { padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); color: var(--ink); font-size: .95rem; width: 220px; font-weight: 600; transition: all .15s; }
.short-input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px var(--accent-soft); }
.short-input.correct { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.short-input.incorrect { border-color: var(--err); background: var(--err-soft); color: var(--err); }

/* Sidebar transition & collapse */
.sidebar {
  transition: width 0.3s ease, padding 0.3s ease, border-color 0.3s ease;
}
.sidebar.collapsed {
  width: 0 !important;
  padding: 0 !important;
  border-right: none !important;
  overflow: hidden !important;
}

/* Workspace resizer */
.resizer {
  width: 8px;
  background: var(--line);
  cursor: col-resize;
  z-index: 10;
  flex-shrink: 0;
  transition: background 0.2s;
  position: relative;
}
.resizer::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 2px;
  height: 30px;
  background: rgba(0, 0, 0, 0.15);
  border-radius: 1px;
}
.resizer:hover, .resizer.dragging {
  background: var(--accent);
}
.resizer:hover::after, .resizer.dragging::after {
  background: rgba(255, 255, 255, 0.5);
}
.workspace.dragging {
  user-select: none;
  -webkit-user-select: none;
}
.workspace.dragging iframe {
  pointer-events: none;
}
@media (max-width:820px) {
  .resizer { display: none !important; }
  .pane { width: 100% !important; flex: 1 !important; }
}

/* ===== Hub quản lý buổi ===== */
.hub-tab { border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2); font-family:inherit; font-size:.85rem; font-weight:600; padding:8px 14px; border-radius:8px 8px 0 0; cursor:pointer; }
.hub-tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.hub-card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:14px 16px; margin-bottom:12px; }
.hub-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.hub-grade-row { display:grid; grid-template-columns:90px 1fr; gap:8px; margin-top:8px; }
@media (max-width:560px){ .hub-grade-row{ grid-template-columns:1fr; } }
.hub-table { width:100%; border-collapse:collapse; font-size:.88rem; }
.hub-table td, .hub-table th { padding:8px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
.hub-stat { display:inline-flex; flex-direction:column; align-items:center; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:6px 14px; min-width:64px; }
.hub-stat b { font-size:1.15rem; }
.hub-stat span { font-size:.72rem; color:var(--ink-3); }
/* ===== Theme CLB M.A.P ===== */
body.theme-map { --accent:#1B2644; --accent-soft:#EAEFF6; }
#mapWatermark { display:none; position:fixed; right:1.5vw; bottom:8vh; width:min(300px,30vw); opacity:.05; pointer-events:none; z-index:0; user-select:none; }
body.theme-map #mapWatermark { display:block; }
</style>
</head>
<body>

<div class="lesson-container">
  <header class="topbar-lesson">
    <div class="left">
      <button class="btn btn-ghost btn-sm" onclick="batTatMucLuc()" title="Mục lục">☰</button>
      <a href="lop-hoc" class="back-btn" id="nutBackLopHoc"><span>←</span><span class="sw-text">Lớp học</span></a>
      <div class="lesson-title" id="tieuDeBaiHoc">Đang tải bài giảng…</div>
      <div id="badgeGiaoVien" style="margin-left: 8px; flex-shrink: 0;"></div>
    </div>
    <div class="switcher" id="boChuyen" style="display:none">
      <button class="sw-btn" id="swLyThuyet" onclick="chonNoiDung('lythuyet')">📖 <span class="sw-text">Đọc lý thuyết</span></button>
      <button class="sw-btn" id="swTaiLieu" onclick="chonNoiDung('tailieu')">📄 <span class="sw-text">Tài liệu</span></button>
      <button class="sw-btn" id="swBang" onclick="chonNoiDung('bang')">🖼 <span class="sw-text">Bảng</span></button>
      <button class="sw-btn" id="swBTVN" onclick="chonNoiDung('btvn')" style="display:none">🏠 <span class="sw-text">Bài tập về nhà</span></button>
      <button class="sw-btn" id="swTest" onclick="chonNoiDung('test')">📝 <span class="sw-text">Kiểm tra</span></button>
    </div>
    <div style="display:flex; gap:8px; align-items:center; flex-shrink:0">
      <button class="btn btn-secondary btn-sm" id="nutBuoiHS" style="display:none" onclick="moBuoiHocHS()">📊 <span class="sw-text">Buổi học của em</span></button>
      <button class="btn btn-secondary btn-sm" id="nutQuanLyBuoi" style="display:none;background:var(--accent);border-color:var(--accent);color:#fff" onclick="moHubQuanLy()">🛠 <span class="sw-text">Quản lý buổi</span></button>
      <button class="btn btn-primary btn-sm" id="nutNopBai" style="display:none" onclick="moNopBai()">📤 <span class="sw-text">Nộp bài</span></button>
      <button class="btn btn-ghost btn-sm" id="themeBtn" onclick="toggleTheme()">🌙</button>
    </div>
  </header>
  
  <!-- Ghi chú nội bộ dành cho Giáo viên / Trợ giảng -->
  <div id="teacherNotesBanner" style="display:none; background:rgba(37,99,235,0.07); border-bottom:1px solid rgba(37,99,235,0.18); color:var(--ink); padding:12px 20px; font-size:0.9rem; align-items:center; gap:12px; flex-wrap:wrap; border-left:4px solid var(--accent); z-index: 10;">
    <div style="flex:1; min-width:300px">
      <span style="font-weight:700; color:var(--accent); display:inline-flex; align-items:center; gap:6px; margin-bottom:4px"><span style="font-size:1.1rem">👨‍🏫</span> Ghi chú bài giảng của Trợ giảng / GV dành riêng cho thầy:</span>
      <div id="teacherNotesContent" style="white-space:pre-wrap; line-height:1.45; font-weight:500"></div>
    </div>
  </div>

  <div id="coTeachBanner" style="display:none; background:rgba(217,119,6,0.08); border-bottom:1px solid rgba(217,119,6,0.2); color:var(--ink); padding:10px 16px; font-size:0.88rem; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap"></div>

  <!-- Hộp nộp bài -->
  <div id="modalNopBai" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:16px">
    <div style="background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);max-width:560px;width:100%;max-height:90vh;overflow-y:auto;padding:28px;position:relative">
      <button onclick="dongNopBai()" style="position:absolute;top:14px;right:16px;font-size:1.4rem;background:none;border:none;cursor:pointer;color:var(--ink-3)">×</button>
      <h2 style="margin-bottom:4px">📤 Nộp bài</h2>
      <p style="font-size:.9rem;color:var(--ink-2);margin-bottom:16px" id="nbTenBai"></p>
      <div id="nbDaNop"></div>
      <div class="field" style="margin-top:14px">
        <label style="display:block;font-size:.875rem;font-weight:500;margin-bottom:6px">Chọn ảnh bài làm hoặc file PDF (chọn được nhiều)</label>
        <input type="file" class="input" id="nbFiles" accept="image/*,application/pdf" multiple onchange="vmRenderFileList('nbFiles','nbFileList')" style="width:100%;padding:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm)">
        <div style="font-size:.78rem;color:var(--ink-3);margin-top:4px">📋 Em có thể <b>chụp màn hình rồi dán (Ctrl/⌘ + V)</b> ngay vào đây.</div>
        <div id="nbFileList"></div>
        <div id="nbDanAnhTrangThai" style="font-size:.8rem;color:var(--ok);margin-top:2px"></div>
      </div>
      <button class="btn btn-primary" id="nbGui" onclick="guiBaiNop()" style="width:100%;justify-content:center">Gửi bài cho thầy</button>
      <div id="nbThongBao" style="margin-top:12px;font-size:.875rem"></div>
    </div>
  </div>

  <!-- ===== HUB QUẢN LÝ BUỔI (thầy/admin) ===== -->
  <div id="modalHub" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:120;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto">
    <div style="background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);max-width:900px;width:100%;margin:auto;position:relative">
      <div style="position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;z-index:2">
        <div>
          <h2 style="margin:0;font-size:1.1rem">🛠 Quản lý buổi học</h2>
          <div id="hubTenBai" style="font-size:.82rem;color:var(--ink-2);margin-top:2px"></div>
        </div>

/* ===== Dán ảnh (Ctrl/⌘+V) vào ô chọn file ===== */
function vmPasteAnhVaoInput(inputId, statusId) {
  window.addEventListener('paste', function (e) {
    var inp = document.getElementById(inputId);
    if (!inp || inp.disabled) return;
    if (inp.offsetParent === null) return;
    var cd = e.clipboardData || (e.originalEvent && e.originalEvent.clipboardData);
    if (!cd) return;
    var imgs = [];
    if (cd.items) for (var i = 0; i < cd.items.length; i++) { var it = cd.items[i]; if (it.type && it.type.indexOf('image') !== -1) { var f = it.getAsFile(); if (f) imgs.push(f); } }
    if (!imgs.length && cd.files) for (var j = 0; j < cd.files.length; j++) { var ff = cd.files[j]; if (ff.type && ff.type.indexOf('image') !== -1) imgs.push(ff); }
    if (!imgs.length) return;
    e.preventDefault();
    var dt = new DataTransfer();
    if (inp.files) for (var a = 0; a < inp.files.length; a++) dt.items.add(inp.files[a]);
    for (var k = 0; k < imgs.length; k++) {
      var src = imgs[k]; var name = src.name;
      if (!name || /^image/i.test(name)) { var ext = (src.type.split('/')[1] || 'png'); name = 'dan-anh-' + Date.now() + '-' + k + '.' + ext; }
      dt.items.add(new File([src], name, { type: src.type }));
    }
    inp.files = dt.files;
    inp.dispatchEvent(new Event('change', { bubbles: true }));
    var st = statusId && document.getElementById(statusId);
    if (st) st.textContent = '✓ Đã thêm ' + imgs.length + ' ảnh dán · tổng ' + inp.files.length + ' tệp';
  });
}
vmPasteAnhVaoInput('nbFiles', 'nbDanAnhTrangThai');

function vmRenderFileList(inputId, listId) {
  var inp = document.getElementById(inputId), box = document.getElementById(listId);
  if (!box) return;
  var fs = inp ? inp.files : null;
  if (!fs || !fs.length) { box.innerHTML = ''; return; }
  var html = '';
  for (var i = 0; i < fs.length; i++) {
    var f = fs[i];
    var nm = String(f.name || 'tệp').replace(/[<>&"]/g, '');
    var icon = (f.type && f.type.indexOf('image') !== -1) ? '🖼' : '📄';
    html += '<span style="display:inline-flex;align-items:center;gap:6px;background:var(--surface-2,#eee);border:1px solid var(--line,#ddd);border-radius:6px;padding:3px 6px 3px 8px;margin:4px 6px 0 0;font-size:.78rem;max-width:240px">' +
      '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + icon + ' ' + nm + '</span>' +
      '<button type="button" title="Xoá" onclick="vmXoaFile(\'' + inputId + '\',' + i + ',\'' + listId + '\')" style="border:none;background:none;color:#c0392b;cursor:pointer;font-weight:800;font-size:1.05rem;line-height:1;padding:0 2px">×</button>' +
      '</span>';
  }
  box.innerHTML = html;
}
function vmXoaFile(inputId, idx, listId) {
  var inp = document.getElementById(inputId); if (!inp) return;
  var dt = new DataTransfer();
  for (var i = 0; i < inp.files.length; i++) { if (i !== idx) dt.items.add(inp.files[i]); }
  inp.files = dt.files;
  vmRenderFileList(inputId, listId);
}

async function taiBaiDaNop() {
  $('nbDaNop').innerHTML = '<div style="font-size:.85rem;color:var(--ink-3)">Đang tải…</div>';
  var r = await sb.from('submissions')
    .select('id, submitted_at, files, status, score, feedback, graded_files, kind')
    .eq('lesson_id', lessonId)
    .eq('student_id', nguoiDung.id)
    .eq('kind', nopBaiPhanLoai)
    .order('submitted_at', { ascending: false });
  var ds = r.data || [];
  if (!ds.length) { $('nbDaNop').innerHTML = ''; return; }
  $('nbDaNop').innerHTML = '<div style="font-size:.85rem;font-weight:600;margin-bottom:8px">Bài em đã nộp:</div>' +
    ds.map(function (s) {
      var ngay = new Date(s.submitted_at).toLocaleString('vi-VN');
      var links = (s.files || []).map(function (f) { return '<a href="' + f.link + '" target="_blank">' + f.name + '</a>'; }).join(' · ');
      var kq;
      if (s.status === 'graded') {
        kq = '<span class="badge badge-ok">Đã chấm' + (s.score != null ? ' · ' + s.score + ' điểm' : '') + '</span>' +
          (s.feedback ? '<div style="font-size:.85rem;margin-top:6px;color:var(--ink-2)">💬 ' + s.feedback + '</div>' : '') +
          ((s.graded_files || []).length
            ? '<div style="font-size:.85rem;margin-top:6px">📄 Bài thầy chấm: ' + s.graded_files.map(function (f) { return '<a href="' + f.link + '" target="_blank">' + f.name + '</a>'; }).join(' · ') + '</div>'
            : '');
      } else {
        kq = '<span class="badge badge-warn">Chờ thầy chấm</span>';
      }
      return '<div class="card" style="padding:12px 16px;margin-bottom:10px">' +
        '<div style="font-size:.8rem;color:var(--ink-3)">' + ngay + '</div>' +
        '<div style="font-size:.85rem;margin:6px 0">' + links + '</div>' + kq + '</div>';
    }).join('');
}

async function guiBaiNop() {
  var fs = $('nbFiles').files;
  var tb = $('nbThongBao');
  if (!fs.length) { tb.textContent = 'Em chưa chọn file nào.'; tb.style.color = 'var(--warn)'; return; }
  var nut = $('nbGui');
  nut.disabled = true; nut.textContent = '⏳ Đang gửi lên Drive của thầy…';
  try {
    var fd = new FormData();
    fd.append('kind', 'nop');
    fd.append('phanloai', nopBaiPhanLoai);
    fd.append('lesson_id', lessonId);
    for (var i = 0; i < fs.length; i++) fd.append('files', fs[i]);
    var r = await sb.functions.invoke('nop-bai', { body: fd });
    if (r.error) throw new Error(r.error.message || 'Trạm nộp bài lỗi');
    if (r.data && r.data.error) throw new Error(r.data.error);
    $('nbFiles').value = '';
    tb.textContent = '✓ Nộp bài thành công!';
    tb.style.color = 'var(--ok)';
    taiBaiDaNop();
  } catch (e) {
    tb.textContent = 'Lỗi: ' + e.message;
    tb.style.color = 'var(--err)';
  }
  nut.disabled = false; nut.textContent = 'Gửi bài cho thầy';
}

/* ===== MỤC LỤC BÊN TRÁI: accordion chuyên đề → bài → mục con + vòng % ===== */
var mlTopicMo = null, mlBaiMo = null;

function mlEsc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

async function taiMucLuc() {
  var rCur = await sb.from('lessons').select('class_id').eq('id', lessonId).maybeSingle();
  var classIdHienTai = rCur.data ? rCur.data.class_id : null;

  var q = sb.from('lessons')
    .select('id, title, sort, locked, class_id, youtube_url, latex_content, document_id, images, homework_text, homework_images, test_document_id, test_latex_content, theory_sections, created_at, topics(id, name, color, sort), documents!lessons_document_id_fkey(file_path)')
    .order('created_at', { ascending: true });
  if (classIdHienTai) q = q.eq('class_id', classIdHienTai);
  var r = await q;
  var ds = r.data || [];
  
  if (!window.newestLessonIds) {
    window.newestLessonIds = {};
    if (ds.length > 0) {
      var sorted = ds.slice().sort(function (a, b) {
        return new Date(b.created_at || 0) - new Date(a.created_at || 0);
      });
      window.newestLessonIds[sorted[0].id] = true;
    }
  }
  if (!ds.length) {
    $('dsMucLuc').innerHTML = '<div style="padding:8px 18px;color:var(--ink-3);font-size:.85rem">Chưa có bài giảng nào.</div>';
    return;
  }

  // Tiến độ của học sinh
  var viewedByLesson = {}, actionByLesson = {};
  if (nguoiDung) {
    var ids = ds.map(function (b) { return b.id; });
    try {
      var rv = await sb.from('lesson_item_progress').select('lesson_id, item').eq('student_id', nguoiDung.id).in('lesson_id', ids);
      (rv.data || []).forEach(function (x) { (viewedByLesson[x.lesson_id] = viewedByLesson[x.lesson_id] || new Set()).add(x.item); });
      var rs = await sb.from('submissions').select('lesson_id, kind').eq('student_id', nguoiDung.id).in('lesson_id', ids);
      (rs.data || []).forEach(function (x) { (actionByLesson[x.lesson_id] = actionByLesson[x.lesson_id] || new Set()).add(x.kind === 'homework' ? 'btvn' : 'test'); });
      var ra = await sb.from('attempts').select('lesson_id').eq('student_id', nguoiDung.id).in('lesson_id', ids).not('submitted_at', 'is', null);
      (ra.data || []).forEach(function (x) { (actionByLesson[x.lesson_id] = actionByLesson[x.lesson_id] || new Set()).add('test'); });
    } catch (e) {}
  }

  // Gom nhóm theo chuyên đề (giữ thứ tự topic.sort)
  var groups = {}, order = [], noTopic = [];
  ds.forEach(function (b) {
    if (b.topics) {
      var tid = b.topics.id || b.topics.name;
      if (!groups[tid]) { groups[tid] = { key: 'tp_' + tid, topic: b.topics, lessons: [] }; order.push(groups[tid]); }
      groups[tid].lessons.push(b);
    } else { noTopic.push(b); }
  });
  order.sort(function (a, b) { return (a.topic.sort || 0) - (b.topic.sort || 0); });
  if (noTopic.length) order.push({ key: 'tp_none', topic: { name: 'Bài giảng khác' }, lessons: noTopic });

  // Khởi tạo trạng thái mở: mở chuyên đề + bài đang học
  if (!mlTopicMo) {
    mlTopicMo = {}; mlBaiMo = {};
    order.forEach(function (g) {
      if (g.lessons.some(function (b) { return b.id === lessonId; })) { mlTopicMo[g.key] = true; }
    });
    mlBaiMo[lessonId] = true;
  }

  var html = '';
  var stt = 1;
  order.forEach(function (g) {
    var isNone = g.key === 'tp_none';
    var ten = isNone ? 'Bài giảng khác' : ('Chuyên đề ' + (stt++) + ': ' + g.topic.name);
    var mau = g.topic.color || 'var(--accent)';
    var openT = mlTopicMo[g.key] ? ' open' : '';
    html += '<div class="ml-topic' + openT + '" id="' + g.key + '">' +
      '<div class="ml-topic-hd" style="color:' + mau + '" onclick="mlToggleTopic(\'' + g.key + '\')">' +
        '<span>' + mlEsc(ten) + '</span>' +
        '<span class="tcount">' + g.lessons.length + '</span>' +
        '<span class="caret">▶</span>' +
      '</div>' +
      '<div class="ml-topic-body">' +
      g.lessons.map(function (b) {
        var td = vmTinhTienDoBai(b, viewedByLesson[b.id], actionByLesson[b.id]);
        var isNew = !!(window.newestLessonIds && window.newestLessonIds[b.id]);
        var dotClass = isNew ? 'lesson-dot glowing-dot' : 'lesson-dot';
        var dotHtml = '<div class="' + dotClass + '" style="background:' + mau + '; --glow-color:' + mau + '"></div>';
        var openB = mlBaiMo[b.id] ? ' open' : '';
        var cur = b.id === lessonId ? ' current' : '';
        var khoa = b.locked ? '<span class="lock" title="Đang khoá">🔒</span>' : '';
        var subs = td.items.map(function (it) {
          return '<a class="' + (it.done ? 'done' : '') + '" onclick="mlMoMuc(\'' + b.id + '\',\'' + it.tab + '\',\'' + it.key + '\',\'' + it.loai + '\')">' +
            '<span>' + it.icon + '</span><span>' + it.label + '</span>' +
            '<span class="tick">' + (it.done ? '✓' : '○') + '</span></a>';
        }).join('');
        if (!subs) subs = '<a onclick="window.location.href=\'bai-hoc?id=' + b.id + '\'"><span>📄</span><span>Mở bài giảng</span></a>';
        return '<div class="ml-bai' + cur + openB + '" id="mlbai_' + b.id + '">' +
          '<div class="ml-bai-hd" onclick="mlToggleBai(\'' + b.id + '\')">' +
            dotHtml + '<span class="ten">' + mlEsc(b.title) + (isNew ? ' <span class="new-lesson-badge" title="Mới nhất">MỚI ✨</span>' : '') + khoa + '</span><span class="caret2">▶</span>' +
          '</div>' +
          '<div class="ml-sub">' + subs + '</div>' +
        '</div>';
      }).join('') +
      '</div>';
  });
  $('dsMucLuc').innerHTML = html;
}

function mlToggleTopic(key) {
  mlTopicMo[key] = !mlTopicMo[key];
  var el = document.getElementById(key);
  if (el) el.classList.toggle('open', mlTopicMo[key]);
}
function mlToggleBai(id) {
  mlBaiMo[id] = !mlBaiMo[id];
  var el = document.getElementById('mlbai_' + id);
  if (el) el.classList.toggle('open', mlBaiMo[id]);
}
async function mlMoMuc(lid, tab, key, loai) {
  if (lid !== lessonId) {
    window.location.href = 'bai-hoc?id=' + lid + '&tab=' + tab;
    return;
  }
  if (tab === 'video') {
    if (window.innerWidth <= 820) hienMobilePane('video');
  } else {
    chonNoiDung(tab);
  }
  if (loai === 'view' && nguoiDung && !laQuanTriBaiHoc()) {
    await vmDanhDauDaXem(lessonId, key);
    taiMucLuc();
  }
  if (window.innerWidth <= 980) { var sb2 = $('mucLuc'); if (sb2) sb2.classList.remove('open'); }
}

function batTatMucLuc() {
  var sidebar = $('mucLuc');
  if (window.innerWidth > 980) {
    sidebar.classList.toggle('collapsed');
  } else {
    sidebar.classList.toggle('open');
    sidebar.classList.remove('collapsed');
  }
}

/* ===== CHI TIẾT BÀI HỌC ===== */
async function taiChiTietBaiHoc() {
  var r = await sb.from('lessons')
    .select('id, title, class_id, youtube_url, note, images, locked, latex_content, homework_text, homework_images, homework_latex_content, homework_document_id, homework_due, document_id, teacher_id, topic_id, test_document_id, test_active, test_started_at, test_duration_minutes, documents!lessons_document_id_fkey(title, file_path), bai_test:documents!lessons_test_document_id_fkey(title, file_path), bai_btvn:documents!lessons_homework_document_id_fkey(title, file_path)')
    .eq('id', lessonId)
    .single();

  if (r.error || !r.data) {
    alert('Bài giảng này đang bị khoá hoặc không tồn tại.');
    window.location.href = 'lop-hoc';
    return;
  }
  details = r.data;

  // Tải danh sách giáo viên
  try {
    var rT = await sb.from('profiles').select('id, full_name, role').in('role', ['teacher', 'admin']);
    (rT.data || []).forEach(function(u) { mapGiaoVien[u.id] = u.full_name; });
  } catch(e) { console.error("Lỗi tải danh sách giáo viên:", e); }

  // Tải thông tin lớp để kiểm tra đồng giảng dạy
  try {
    var rClass = await sb.from('classes').select('teacher_id, co_teacher_id, theme').eq('id', details.class_id).single();
    classInfo = rClass.data;
    apDungThemeLopBaiHoc(classInfo && classInfo.theme);
  } catch(e) { console.error("Lỗi tải thông tin lớp:", e); }

  // Tải bài học tương ứng của giáo viên kia (nếu có)

function extractYoutubeId(url) {
  if (!url) return null;
  var m = url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/);
  return m ? m[1] : null;
}
function extractDriveId(url) {
  if (!url) return null;
  var m1 = url.match(/\/file\/d\/([\w_-]+)/);
  if (m1) return m1[1];
  var m2 = url.match(/[?&]id=([\w_-]+)/);
  if (m2 && url.includes('drive.google.com')) return m2[1];
  return null;
}
function buildPdfUrl(p) {
  if (!p) return '';
  if (p.startsWith('http://') || p.startsWith('https://')) return p;
  return VM.SUPABASE_URL + '/storage/v1/object/public/tai-lieu/' + p;

// Tự động giải quyết các file phụ thuộc từ cautruc13/ hoặc bia13/ và chèn vào làm virtual files
async function processVirtualFiles(tex) {
  // 1. Resolve macro \\loaitailieu if present in \\input
  var loaiMatch = tex.match(/\\def\\loaitailieu\{([^}]+)\}/);
  var loaitailieu = loaiMatch ? loaiMatch[1].trim() : 'LT-3';
  tex = tex.replace(/\\input\{cautruc13\/\\loaitailieu\}/g, '\\input{cautruc13/' + loaitailieu + '}');

  // 2. Regex to find \\input{...} or \\include{...}
  var inputRegex = /\\(input|include)\{([^}]+)\}/g;
  var match;
  var virtualFiles = '';
  var processedPaths = new Set();

  var matches = [];
  while ((match = inputRegex.exec(tex)) !== null) {
    matches.push(match[2].trim());
  }

  for (var importPath of matches) {
    if (processedPaths.has(importPath)) continue;
    processedPaths.add(importPath);

    if (importPath.startsWith('cautruc13/') || importPath.startsWith('bia13/') || importPath.endsWith('.tex') || importPath.endsWith('.sty')) {
      var urlPath = importPath;
      if (!urlPath.endsWith('.tex') && !urlPath.endsWith('.sty')) {
        urlPath += '.tex';
      }
      
      try {
        var res = await fetch(urlPath);
        if (res.ok) {
          var content = await res.text();
          var baseName = importPath.substring(importPath.lastIndexOf('/') + 1);
          if (!baseName.endsWith('.tex') && !baseName.endsWith('.sty')) {
            baseName += '.tex';
          }
          
          if (baseName === 'bia-dynamic.tex') {
            content = content.replace(/\\includegraphics\[width=6\.0cm\]\{logo\/VinhMath_logo\.png\}/g, 
              `\\IfFileExists{logo/VinhMath_logo.png}{\\includegraphics[width=6.0cm]{logo/VinhMath_logo.png}}{%
\\node[anchor=center, align=center] at ([xshift=2.75cm, yshift=0.2cm]current page.center) {
    {\\color{brandNavy}\\fontsize{24}{28}\\selectfont\\bfseries\\sffamily VINH}\\\\[0.1cm]
    {\\color{brandGold}\\fontsize{20}{24}\\selectfont\\bfseries\\sffamily MATH}
};}`);
          }
          if (baseName === 'Khai-bao-minimal.tex') {
            content = content.replace(/\\includegraphics\[width=10\.5cm\]\{logo\/VinhMath_logo\.png\}/g,
              `\\IfFileExists{logo/VinhMath_logo.png}{\\includegraphics[width=10.5cm]{logo/VinhMath_logo.png}}{}`);
          }

          virtualFiles += '\\begin{filecontents*}{' + baseName + '}\n' + content + '\n\\end{filecontents*}\n';
          
          var escapeReg = importPath.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
          var replacer = new RegExp('\\\\input\\{' + escapeReg + '\\}', 'g');
          tex = tex.replace(replacer, '\\input{' + baseName + '}');
        } else {
          console.warn('Không thể tải file phụ thuộc: ' + urlPath);
        }
      } catch (e) {
        console.error('Lỗi khi tải file phụ thuộc ' + urlPath + ':', e);
      }
    }
  }

  if (virtualFiles) {
    tex = virtualFiles + tex;
  }
  return tex;
}

function renderPDFWithJS(pdfUrl, container) {
  container.innerHTML = '<div class="no-content"><div class="spinner"></div><h3>Đang chuẩn bị tài liệu...</h3></div>';
  
  if (!window.pdfjsLib) {
    var script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js';
    script.id = 'pdfjs-script';
    script.onload = function() {
      // Tạo Blob URL cho worker để vượt qua chính sách Same-Origin đối với Web Worker của trình duyệt
      var workerUrl = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
      try {
        var blob = new Blob(['importScripts("' + workerUrl + '");'], { type: 'application/javascript' });
        pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
      } catch (e) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = workerUrl;
      }
      startRendering();
    };
    script.onerror = function() {
      fallbackToIframe();
    };
    document.head.appendChild(script);
  } else {
    startRendering();
  }
  
  function fallbackToIframe() {
    container.innerHTML = '<iframe class="pdf-frame" src="' + pdfUrl + '#toolbar=1&navpanes=0"></iframe>';
  }
  
  function startRendering() {
    container.innerHTML = '<div style="flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:16px; background:var(--surface-2); align-items:center;" id="pdfCanvasContainer"></div>';
    var canvasContainer = document.getElementById('pdfCanvasContainer');
    
    // Thêm cache-busting cho URL của Supabase để tránh việc trình duyệt cache kết quả request không có CORS
    var fetchUrl = pdfUrl;
    if (fetchUrl.indexOf('blob:') !== 0 && fetchUrl.indexOf('data:') !== 0) {
      fetchUrl += (fetchUrl.indexOf('?') !== -1 ? '&' : '?') + 't=' + Date.now();
    }
    
    var loadingTask = pdfjsLib.getDocument(fetchUrl);
    loadingTask.promise.then(function(pdf) {
      for (var pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        (function(num) {
          var canvas = document.createElement('canvas');
          canvas.style.width = '100%';
          canvas.style.maxWidth = '800px';
          canvas.style.borderRadius = '8px';
          canvas.style.border = '1px solid var(--line)';
          canvas.style.boxShadow = 'var(--shadow)';
          canvas.style.background = '#fff';
          canvasContainer.appendChild(canvas);
          
          pdf.getPage(num).then(function(page) {
            // Vẽ theo mật độ điểm ảnh màn hình (Retina) để PDF sắc nét như xem trực tiếp
            var dpr = window.devicePixelRatio || 1;
            var scale = Math.min(4, Math.max(2.5, 2 * dpr));
            var viewport = page.getViewport({ scale: scale });
            canvas.height = Math.floor(viewport.height);
            canvas.width = Math.floor(viewport.width);

            var renderContext = {
              canvasContext: canvas.getContext('2d', { alpha: false }),
              viewport: viewport
            };
            page.render(renderContext);
          });
        })(pageNum);
      }
    }).catch(function(err) {
      console.error("PDF.js render error:", err);
      fallbackToIframe();
    });
  }
}

function btvnEsc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

async function nopBaiTracNghiem(isAuto) {
  if (testAttempt) { if (!isAuto) alert('Em đã nộp bài trắc nghiệm này rồi.'); return; }
  
  var qIds = interactiveQuestions.map(function (q) { return q.id; });
  var countAnswered = 0;
  qIds.forEach(function (qId) { if (selectedAnswers[qId]) countAnswered++; });
  
  if (!isAuto) {
    if (countAnswered === 0) { alert('Em vui lòng chọn ít nhất một đáp án trước khi nộp bài.'); return; }
    if (!confirm('Em chắc chắn muốn nộp bài kiểm tra trắc nghiệm này?')) return;
  }
  
  var correctCount = 0;
  var totalCount = interactiveQuestions.length;
  var answerPayloads = [];
  
  interactiveQuestions.forEach(function (q) {
    var chosen = selectedAnswers[q.id];
    var isCorrect = false;
    if (q.choices) {
      q.choices.forEach(function (c) {
        if (c.key === chosen && c.correct) {
          isCorrect = true;
          correctCount++;
        }
      });
    }
    answerPayloads.push({
      question_id: q.id,
      chosen_key: chosen || null,
      is_correct: chosen ? isCorrect : false
    });
  });
  
  var score = (correctCount / totalCount) * 10;
  
  var rAttempt = await sb.from('attempts').insert({
    student_id: nguoiDung.id,
    lesson_id: lessonId,
    score: parseFloat(score.toFixed(2)),
    correct_n: correctCount,
    total_n: totalCount,
    submitted_at: new Date().toISOString()
  }).select('id').single();
  
  if (rAttempt.error) {
    alert('Lỗi nộp bài: ' + rAttempt.error.message);
    return;
  }
  
  var attemptId = rAttempt.data.id;
  var answersToInsert = answerPayloads.map(function (ans) {
    return {
      attempt_id: attemptId,
      question_id: ans.question_id,
      chosen_key: ans.chosen_key,
      is_correct: ans.is_correct
    };
  });
  
  var rAns = await sb.from('attempt_answers').insert(answersToInsert);
  if (rAns.error) {
    alert('Lỗi lưu kết quả chi tiết: ' + rAns.error.message);
  }
  
  testAttempt = {
    id: attemptId,
    score: score,
    submitted_at: new Date().toISOString(),
    attempt_answers: answersToInsert
  };
  
  renderInteractiveQuiz();
}

function renderInteractiveQuiz() {
  var than = $('thanNoiDung');
  var html = thanhCongCu('📝 Bài test trắc nghiệm cuối giờ', null) +
    '<div class="quiz-container">';
    
  if (testAttempt) {
    var dt = new Date(testAttempt.submitted_at).toLocaleString('vi-VN');
    html += '<div class="card" style="margin-bottom: 20px; border-color: var(--ok); background: var(--ok-soft); color: var(--ok)">' +
      '<b>✓ Đã hoàn thành bài làm!</b><br>' +
      'Thời điểm nộp: ' + dt + ' · <b>Kết quả: ' + testAttempt.score.toFixed(1) + '/10 điểm (' +
      testAttempt.attempt_answers.filter(function (x) { return x.is_correct; }).length + '/' + interactiveQuestions.length + ' câu đúng)</b>' +
      '</div>';
  }
  
  interactiveQuestions.forEach(function (q, idx) {
    var selected = selectedAnswers[q.id];
    var isSubmitted = !!testAttempt;
    
    html += '<div class="quiz-q">' +
      '<div class="quiz-text">Câu ' + (idx + 1) + ': ' + q.content_latex + '</div>' +
      '<div class="quiz-choices">';
      
    q.choices.forEach(function (c) {
      var activeClass = '';
      if (isSubmitted) {
        var ansObj = testAttempt.attempt_answers.find(function (x) { return x.question_id === q.id; }) || {};
        if (c.correct) {
          activeClass = ' correct';
        } else if (ansObj.chosen_key === c.key) {
          activeClass = ' incorrect';
        }
      } else if (selected === c.key) {
        activeClass = ' selected';
      }
      
      html += '<div class="quiz-choice choice-' + q.id + activeClass + '" data-key="' + c.key + '" onclick="chonDapAn(\'' + q.id + '\', \'' + c.key + '\')">' +
        '<span class="quiz-choice-key">' + c.key + '</span>' +
        '<span>' + c.latex + '</span>' +
        '</div>';
    });
    
    html += '</div>';
    
    if (isSubmitted && q.solution_latex) {
      html += '<div class="quiz-sol">' +
        '<b>Lời giải chi tiết:</b><br>' +
        '<div>' + q.solution_latex + '</div>' +
        '</div>';
    }
    
    html += '</div>';
  });
  
  if (!testAttempt) {
    html += '<button class="btn btn-primary" onclick="nopBaiTracNghiem()" style="margin-top: 10px; width: 100%; justify-content: center">Nộp bài kiểm tra</button>';
  }
  
  html += '</div>';
  than.innerHTML = html;
  renderLatex(than);
}

var testTimerInterval = null;

function kiemTraVaChayTestTimer() {
  if (!details) return;
  
  var banner = document.getElementById('divTestTimer');
  
  if (!details.test_started_at) {
    if (testTimerInterval) {
      clearInterval(testTimerInterval);
      testTimerInterval = null;
    }
    $('boChuyen').style.display = 'flex';
    if (banner) banner.remove();
    return;
  }

  var start = new Date(details.test_started_at).getTime();
  var duration = (details.test_duration_minutes || 15) * 60 * 1000;
  var end = start + duration;
  var conLai = end - Date.now();

  if (conLai <= 0) {
    if (testTimerInterval) {
      clearInterval(testTimerInterval);
      testTimerInterval = null;
    }
    $('boChuyen').style.display = 'flex';
    if (banner) banner.remove();
    return;
  }

  if (!banner) {
    banner = document.createElement('div');
    banner.id = 'divTestTimer';
    banner.style.cssText = 'background:#c0392b; color:#fff; font-weight:700; text-align:center; padding:10px; font-size:1.05rem; position:sticky; top:0; z-index:99; display:flex; align-items:center; justify-content:center; gap:10px; border-bottom: 2px solid rgba(0,0,0,0.15);';
    document.body.insertBefore(banner, document.body.firstChild);
  }

  chonNoiDung('test');
  $('boChuyen').style.display = 'none';

  if (testTimerInterval) clearInterval(testTimerInterval);

  testTimerInterval = setInterval(function () {
    var conLaiReal = end - Date.now();
    if (conLaiReal <= 0) {
      clearInterval(testTimerInterval);
      testTimerInterval = null;
      banner.innerHTML = '⏱ HẾT GIỜ LÀM BÀI!';
      setTimeout(function () {
        banner.remove();
        $('boChuyen').style.display = 'flex';
        if (!testAttempt) {
          nopBaiTracNghiem(true);
        }
      }, 1500);
    } else {
      var p = Math.floor(conLaiReal / 60000);
      var g = Math.floor((conLaiReal % 60000) / 1000);
      banner.innerHTML = '⏱ BÀI KIỂM TRA ĐANG DIỄN RA! CÒN LẠI: ' + String(p).padStart(2, '0') + ':' + String(g).padStart(2, '0');
    }
  }, 1000);
}

function dangKyRealtimeTest() {
  try {
    sb.channel('lesson-test-' + lessonId)

function khoiTaoResizer() {
  var resizer = $('workspaceResizer');
  var leftPane = $('khungTrangVideo');
  var rightPane = $('khungTrangNoiDung');
  var workspace = $('khongGianHoc');
  
  if (!resizer || !leftPane || !rightPane || !workspace) return;
  
  var startX, startLeftWidth;
  
  resizer.addEventListener('mousedown', initDrag);
  resizer.addEventListener('touchstart', initTouchDrag);
  
  function initDrag(e) {
    startX = e.clientX;
    startLeftWidth = leftPane.getBoundingClientRect().width;
    
    workspace.classList.add('dragging');
    resizer.classList.add('dragging');
    
    document.addEventListener('mousemove', doDrag);
    document.addEventListener('mouseup', stopDrag);
    e.preventDefault();
  }
  
  function doDrag(e) {
    var deltaX = e.clientX - startX;
    var totalWidth = workspace.getBoundingClientRect().width;
    var newLeftWidth = startLeftWidth + deltaX;
    
    var minWidth = 150; // pixels
    if (newLeftWidth < minWidth) newLeftWidth = minWidth;
    if (newLeftWidth > totalWidth - minWidth) newLeftWidth = totalWidth - minWidth;
    
    leftPaneWidthPercent = (newLeftWidth / totalWidth) * 100;
    var rightPercent = 100 - leftPaneWidthPercent;
    
    leftPane.style.flex = 'none';
    leftPane.style.width = leftPaneWidthPercent + '%';
    rightPane.style.flex = 'none';
    rightPane.style.width = rightPercent + '%';
  }
  
  function stopDrag() {
    workspace.classList.remove('dragging');
    resizer.classList.remove('dragging');
    document.removeEventListener('mousemove', doDrag);
    document.removeEventListener('mouseup', stopDrag);
  }
  
  function initTouchDrag(e) {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startLeftWidth = leftPane.getBoundingClientRect().width;
    
    workspace.classList.add('dragging');
    resizer.classList.add('dragging');
    
    document.addEventListener('touchmove', doTouchDrag, { passive: false });
    document.addEventListener('touchend', stopTouchDrag);
  }
  
  function doTouchDrag(e) {
    if (e.touches.length !== 1) return;
    var deltaX = e.touches[0].clientX - startX;
    var totalWidth = workspace.getBoundingClientRect().width;
    var newLeftWidth = startLeftWidth + deltaX;
    
    var minWidth = 150;
    if (newLeftWidth < minWidth) newLeftWidth = minWidth;
    if (newLeftWidth > totalWidth - minWidth) newLeftWidth = totalWidth - minWidth;
    
    leftPaneWidthPercent = (newLeftWidth / totalWidth) * 100;
    var rightPercent = 100 - leftPaneWidthPercent;
    
    leftPane.style.flex = 'none';
    leftPane.style.width = leftPaneWidthPercent + '%';
    rightPane.style.flex = 'none';
    rightPane.style.width = rightPercent + '%';
    
    e.preventDefault();
  }
  
  function stopTouchDrag() {
    workspace.classList.remove('dragging');
    resizer.classList.remove('dragging');
    document.removeEventListener('touchmove', doTouchDrag);
    document.removeEventListener('touchend', stopTouchDrag);
  }
}

/* ----- TIẾN TRÌNH ĐỌC LÝ THUYẾT & CÂU HỎI CHẶN (ACTIVE READING) ----- */
var currentProgress = { unlocked_section: 0, completed_at: null, answers: {} };
var gatedQuestionsMap = {};
var currentGateSelection = {};

function isShortAnswerCorrect(studentAns, correctAns) {
  if (studentAns === undefined || studentAns === null || correctAns === undefined || correctAns === null) return false;
  var s = studentAns.toString().trim().replace(/,/g, '.').replace(/\s+/g, '');
  var c = correctAns.toString().trim().replace(/,/g, '.').replace(/\s+/g, '');
  return s === c;
}

async function taiTienTrinhDoc() {
  try {
    var r = await sb.from('student_lesson_progress')
      .select('unlocked_section, completed_at, answers')
      .eq('lesson_id', lessonId)
      .eq('student_id', nguoiDung.id)
      .maybeSingle();
      
    if (r.data) {
      currentProgress = r.data;
      if (typeof currentProgress.answers === 'string') {
        try { currentProgress.answers = JSON.parse(currentProgress.answers); } catch(e) {}
      }
      currentProgress.answers = currentProgress.answers || {};
    } else {
      currentProgress = { unlocked_section: 0, completed_at: null, answers: {} };
    }
  } catch (e) {
    console.error('Lỗi tải tiến trình đọc:', e);
  }
}

async function luuTienTrinhDoc() {
  try {
    await sb.from('student_lesson_progress').upsert({
      student_id: nguoiDung.id,
      lesson_id: lessonId,
      unlocked_section: currentProgress.unlocked_section,
      completed_at: currentProgress.completed_at,
      answers: currentProgress.answers
    });
  } catch (e) {
    console.error('Lỗi lưu tiến trình đọc:', e);
  }
}

async function taiCauHoiChanData() {
  var qIds = (details.theory_sections || [])
    .map(function (s) { return s.question_id; })
    .filter(Boolean);
    
  if (qIds.length > 0) {
    try {
      var r = await sb.from('questions')
        .select('id, content_latex, choices, solution_latex')
        .in('id', qIds);
      
      gatedQuestionsMap = {};
      (r.data || []).forEach(function (q) {
        gatedQuestionsMap[q.id] = q;
      });
    } catch (e) {
      console.error('Lỗi tải câu hỏi chặn:', e);
    }
  }
}

async function autoUnlockProgress() {
  var unlocked = currentProgress.unlocked_section || 0;
  var total = (details.theory_sections || []).length;
  
  while (unlocked < total) {
    var currentSec = details.theory_sections[unlocked];
    if (!currentSec.question_id) {
      unlocked++;
    } else {
      break;
    }
  }
  
  if (unlocked !== (currentProgress.unlocked_section || 0)) {
    currentProgress.unlocked_section = unlocked;
    if (unlocked === total) {
      currentProgress.completed_at = new Date().toISOString();
    }
    await luuTienTrinhDoc();
  }
}

function chonDapAnGate(qId, key) {

  if (box) {
    var choices = box.querySelectorAll('.quiz-choice');
    choices.forEach(function (el) {
      if (el.getAttribute('onclick').includes(key)) el.classList.add('selected');
      else el.classList.remove('selected');
    });

}

function chonDapAnGateTF(qId, key, val) {
  currentGateSelection[qId] = currentGateSelection[qId] || {};
  currentGateSelection[qId][key] = val;
  renderTheoryReading();
}

function capNhatGateShortValue(qId, val) {
  currentGateSelection[qId] = val;
}

async function kiemTraDapAnGate(qId, idx) {
  var q = gatedQuestionsMap[qId];
  if (!q) return;
  
  var studentAns = currentGateSelection[qId];
  var isCorrect = false;
  
  var isPartI = q.choices && q.choices.length === 4 && ['A', 'B', 'C', 'D'].includes(q.choices[0].key);
  var isPartII = q.choices && q.choices.length === 4 && ['a', 'b', 'c', 'd'].includes(q.choices[0].key);
  var isPartIII = !q.choices || q.choices.length === 1 || q.choices[0].key === 'short';
  
  if (isPartI) {
    var correctChoice = q.choices.find(function (c) { return c.correct; });
    if (correctChoice && correctChoice.key === studentAns) isCorrect = true;
  } else if (isPartII) {
    var tfAns = studentAns || {};
    var allCorrect = true;
    q.choices.forEach(function (c) {
      var correctVal = c.correct ? 'D' : 'S';
      if (tfAns[c.key] !== correctVal) allCorrect = false;
    });
    isCorrect = allCorrect;
  } else if (isPartIII) {
    var correctVal = q.choices[0] ? q.choices[0].latex : '';
    isCorrect = isShortAnswerCorrect(studentAns, correctVal);
  }
  
  if (isCorrect) {
    currentProgress.answers[qId] = studentAns;
    currentProgress.unlocked_section = idx + 1;
    if (idx + 1 === details.theory_sections.length) {
      currentProgress.completed_at = new Date().toISOString();
    }
    
    await luuTienTrinhDoc();
    await autoUnlockProgress();
    renderTheoryReading();
    
    setTimeout(function () {
      var nextCard = $('secCard-' + (idx + 1));
      if (nextCard) {
        nextCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }, 100);
  } else {
    alert('Câu trả lời chưa chính xác. Em hãy đọc kỹ lý thuyết bên trên và chọn lại nhé!');
  }
}

function renderTheoryReading() {
  var than = $('thanNoiDung');
  var sections = details.theory_sections || [];
  
  var html = thanhCongCu('📖 Đọc lý thuyết bài học', null) +
    '<div class="theory-reading-container" id="readingContainer">';
    
  var unlocked = currentProgress.unlocked_section || 0;
  
  if (currentProgress.completed_at) {
    var dt = new Date(currentProgress.completed_at).toLocaleString('vi-VN');
    html += '<div class="card" style="border-color: var(--ok); background: var(--ok-soft); color: var(--ok); padding: 14px; margin-bottom: 10px;">' +
      '<b>🎉 Chúc mừng em đã hoàn thành đọc lý thuyết bài học này!</b><br>' +
      'Đã ghi nhận chuyên cần lúc: ' + dt +
      '</div>';
  }
  
  sections.forEach(function (sec, idx) {
    if (idx < unlocked) {
      var gateHTML = '';
      if (sec.question_id) {
        gateHTML = '<div class="gate-box correct">' +
          '<div class="gate-title">✓ Đã vượt qua câu hỏi chặn</div>' +
          '</div>';
      }
      html += '<div class="theory-section-card" id="secCard-' + idx + '">' +
        '<div class="theory-content">' + sec.content_latex + '</div>' +
        gateHTML +
        '</div>';
    } else if (idx === unlocked) {
      var gateHTML = '';
      if (sec.question_id) {
        var q = gatedQuestionsMap[sec.question_id];
        if (q) {
          var isPartI = q.choices && q.choices.length === 4 && ['A', 'B', 'C', 'D'].includes(q.choices[0].key);
          var isPartII = q.choices && q.choices.length === 4 && ['a', 'b', 'c', 'd'].includes(q.choices[0].key);
          var isPartIII = !q.choices || q.choices.length === 1 || q.choices[0].key === 'short';
          
          var questionChoicesHTML = '';
          if (isPartI) {
            var selected = currentGateSelection[q.id];
            questionChoicesHTML = '<div class="quiz-choices">';
            q.choices.forEach(function (c) {
              var activeClass = (selected === c.key) ? ' selected' : '';
              questionChoicesHTML += '<div class="quiz-choice' + activeClass + '" onclick="chonDapAnGate(\'' + q.id + '\', \'' + c.key + '\')">' +
                '<span class="quiz-choice-key">' + c.key + '</span>' +
                '<span>' + c.latex + '</span>' +
                '</div>';
            });
            questionChoicesHTML += '</div>';
          } else if (isPartII) {
            var tfAns = currentGateSelection[q.id] || {};
            questionChoicesHTML = '<div class="tf-container">';
            q.choices.forEach(function (c) {
              var studentChoice = tfAns[c.key] || '';
              var btnTrueClass = 'tf-btn' + (studentChoice === 'D' ? ' selected-true' : '');
              var btnFalseClass = 'tf-btn' + (studentChoice === 'S' ? ' selected-false' : '');
              
              questionChoicesHTML += '<div class="tf-row">' +
                '<div class="tf-statement"><b>' + c.key.toUpperCase() + '.</b> ' + c.latex + '</div>' +
                '<div class="tf-btns">' +
                  '<button class="' + btnTrueClass + '" onclick="chonDapAnGateTF(\'' + q.id + '\', \'' + c.key + '\', \'D\')">Đúng</button>' +
                  '<button class="' + btnFalseClass + '" onclick="chonDapAnGateTF(\'' + q.id + '\', \'' + c.key + '\', \'S\')">Sai</button>' +
                '</div>' +
              '</div>';
            });
            questionChoicesHTML += '</div>';
          } else if (isPartIII) {
            var textVal = currentGateSelection[q.id] || '';
            questionChoicesHTML = '<div class="short-input-container">' +
              '<span>Nhập câu trả lời: </span>' +
              '<input type="text" class="short-input" value="' + textVal + '" placeholder="Đáp số..." onchange="capNhatGateShortValue(\'' + q.id + '\', this.value)" oninput="capNhatGateShortValue(\'' + q.id + '\', this.value)">' +
            '</div>';
          }
          
          gateHTML = '<div class="gate-box">' +
            '<div class="gate-title">🔒 Câu hỏi chặn: Trả lời đúng để đọc tiếp</div>' +
            '<div style="font-weight: 600; margin-bottom: 12px;">' + q.content_latex + '</div>' +
            questionChoicesHTML +
            '<button class="btn btn-primary btn-sm" onclick="kiemTraDapAnGate(\'' + q.id + '\', ' + idx + ')" style="margin-top: 14px;">Xác nhận câu trả lời</button>' +
            '</div>';
        } else {
          gateHTML = '<div class="gate-box">Đang tải câu hỏi chặn...</div>';
        }
      }
      
      html += '<div class="theory-section-card" id="secCard-' + idx + '">' +
        '<div class="theory-content">' + sec.content_latex + '</div>' +
        gateHTML +
        '</div>';
    } else {
      if (idx === unlocked + 1) {
        html += '<div class="theory-section-card locked" id="secCard-' + idx + '" style="text-align:center; padding:20px; border:1px dashed var(--line); color:var(--ink-3); font-size:.9rem;">' +
          '🔒 Đoạn lý thuyết tiếp theo đang được khóa. Hãy hoàn thành câu hỏi chặn phía trên để mở khóa.' +
          '</div>';
      }
    }
  });
  
  html += '</div>';
  than.innerHTML = html;
  renderLatex(than);
}

/* ========================================================================
   HUB QUẢN LÝ BUỔI HỌC (gắn theo từng bài giảng)
   ======================================================================== */
function hubEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var hubRoster = [];
var hubSession = null;
var hubSubs = [];
var HUBMAP = { cham:'Cham', nop:'Nop', dd:'DD' };

async function hubTaiRoster(){
  if (hubRoster.length) return hubRoster;
  try {
    var r = await sb.from('class_students')
      .select('student_id, profiles(id, full_name, username)')
      .eq('class_id', details.class_id);
    hubRoster = (r.data||[]).map(function(x){return x.profiles;}).filter(Boolean)
      .sort(function(a,b){return (a.full_name||'').localeCompare(b.full_name||'','vi');});
  } catch(e){ hubRoster = []; }
  return hubRoster;
}

async function hubGetOrCreateSession(taoNeuChua){
  var r = await sb.from('class_sessions')
    .select('id, title, held_on, lesson_id')
    .eq('class_id', details.class_id).eq('lesson_id', lessonId)
    .order('created_at',{ascending:false}).limit(1).maybeSingle();
  if (r.data){ hubSession = r.data; return hubSession; }
  if (!taoNeuChua){ hubSession = null; return null; }
  var d = new Date();
  var iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  var ins = await sb.from('class_sessions')
    .insert({ class_id: details.class_id, lesson_id: lessonId, title: details.title, held_on: iso, teacher_id: nguoiDung.id })
    .select('id, title, held_on, lesson_id').single();
  if (ins.error){ alert('Không tạo được buổi: '+ins.error.message); return null; }
  hubSession = ins.data; return hubSession;
}

function moHubQuanLy(){
  $('modalHub').style.display='flex';
  $('hubTenBai').textContent = details ? details.title : '';
  chonHubTab('cham');
}
function dongHub(){
  $('modalHub').style.display='none';
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ action: 'closeHub' }, '*');
  }
}
function chonHubTab(tab){
  ['cham','nop','dd'].forEach(function(t){
    $('hubTab'+HUBMAP[t]).classList.toggle('active', t===tab);
    $('hubPane'+HUBMAP[t]).style.display = (t===tab)?'':'none';
  });
  if (tab==='cham') hubRenderCham();
  else if (tab==='nop') hubRenderNop();
  else hubRenderDD();
}

    '</div>'+

      '<button class="btn btn-primary btn-sm" id="hluu-'+s.id+'" onclick="hubLuuCham(\''+s.id+'\')">💾 Lưu & trả bài</button>'+

function hubChenY(id){var ta=$('hphe-'+id);if(!ta)return;var c=ta.value;ta.value=c+(c&&!c.endsWith('\n')?'\n':'')+'• ';ta.focus();ta.selectionStart=ta.selectionEnd=ta.value.length;}
function hubChenCau(id){var ta=$('hphe-'+id);if(!ta)return;var c=ta.value;var n=(c.match(/(^|\n)\s*Câu\s*\d/gi)||[]).length+1;ta.value=c+(c&&!c.endsWith('\n')?'\n':'')+'Câu '+n+': ';ta.focus();ta.selectionStart=ta.selectionEnd=ta.value.length;}
async function hubLuuCham(id){
  var nut=$('hluu-'+id); nut.disabled=true; nut.textContent='⏳ Đang lưu…';
  try{
    var fs=$('hfile-'+id).files;
    if(fs.length){
      nut.textContent='⏳ Đang tải file chấm…';
      var fd=new FormData(); fd.append('kind','cham'); fd.append('submission_id',id);
      for(var i=0;i<fs.length;i++) fd.append('files',fs[i]);
      var r1=await sb.functions.invoke('nop-bai',{body:fd});
      if(r1.error) throw new Error(r1.error.message||'Trạm lỗi');
      if(r1.data&&r1.data.error) throw new Error(r1.data.error);
    }
    var diem=$('hdiem-'+id).value;
    var r2=await sb.from('submissions').update({score:diem===''?null:parseFloat(diem),feedback:$('hphe-'+id).value.trim()||null,status:'graded',graded_at:new Date().toISOString()}).eq('id',id);
    if(r2.error) throw new Error(r2.error.message);
    await hubRenderCham();
  }catch(e){ alert('Lỗi khi lưu: '+e.message); nut.disabled=false; nut.textContent='💾 Lưu & trả bài'; }
}

      '<td><input class="input" id="hnxd-'+s.id+'" type="number" min="0" max="10" step="0.25" value="'+dVal+'" placeholder="đ" style="font-size:.82rem;padding:5px 8px;width:60px"></td>'+

        '<div class="hub-stat"><b style="color:var(--err)">'+(hubRoster.length-present)+'</b><span>Vắng</span></div>'+

async function hubToggleDD(studentId,present){
  var sid=hubSession.id;
  if(present){
    var r=await sb.from('attendance').upsert({session_id:sid,student_id:studentId,status:'present',checked_at:new Date().toISOString()},{onConflict:'session_id,student_id'});
    if(r.error){alert('Lỗi điểm danh: '+r.error.message);return;}
  }else{
    var r2=await sb.from('attendance').delete().eq('session_id',sid).eq('student_id',studentId);
    if(r2.error){alert('Lỗi: '+r2.error.message);return;}
  }
  hubVeRoster();
}
async function hubLuuNX(studentId){
  var remark=$('hnx-'+studentId).value.trim();
  var d=$('hnxd-'+studentId).value;
  if(!remark&&!d){alert('Nhập nhận xét hoặc điểm thái độ trước nhé.');return;}
  var rec={class_id:details.class_id,student_id:studentId,ngay:hubSession.held_on,remark:remark,attitude_score:d?parseFloat(d):null,author_id:nguoiDung.id,author_name:(mapGiaoVien[nguoiDung.id]||nguoiDung.full_name||'Giáo viên'),updated_at:new Date().toISOString()};
  var r=await sb.from('session_remarks').upsert(rec,{onConflict:'class_id,student_id,ngay'});
  if(r.error){alert('Lỗi lưu nhận xét: '+r.error.message);return;}
  hubVeRoster();
}

/* ---- Dán ảnh trong hub (chấm bài + nộp hộ) ---- */
window.addEventListener('paste',function(e){
  if(!$('modalHub') || $('modalHub').style.display==='none') return;
  var ae=document.activeElement;
  var card=ae&&ae.closest?ae.closest('.sub-card'):null;
  var inp=null;
  if(card){ inp=card.querySelector('input[type=file]'); }
  else if($('hubPaneNop') && $('hubPaneNop').style.display!=='none'){ inp=$('hnopFile'); }
  if(!inp) return;
  var cd=e.clipboardData||(e.originalEvent&&e.originalEvent.clipboardData); if(!cd) return;
  var imgs=[];
  if(cd.items) for(var i=0;i<cd.items.length;i++){var it=cd.items[i];if(it.type&&it.type.indexOf('image')!==-1){var f=it.getAsFile();if(f)imgs.push(f);}}
  if(!imgs.length&&cd.files) for(var j=0;j<cd.files.length;j++){var ff=cd.files[j];if(ff.type&&ff.type.indexOf('image')!==-1)imgs.push(ff);}
  if(!imgs.length) return;
  e.preventDefault();
  var dt=new DataTransfer();
  if(inp.files) for(var a=0;a<inp.files.length;a++) dt.items.add(inp.files[a]);
  for(var k=0;k<imgs.length;k++){var src=imgs[k];var name=src.name;if(!name||/^image/i.test(name)){var ext=(src.type.split('/')[1]||'png');name='hub-dan-'+Date.now()+'-'+k+'.'+ext;}dt.items.add(new File([src],name,{type:src.type}));}
  inp.files=dt.files;
  if(card){ var id=card.id.replace('hsub-',''); var st=$('hcham-tt-'+id); if(st) st.textContent='✓ Đã thêm '+imgs.length+' ảnh dán · tổng '+inp.files.length+' tệp'; vmRenderFileList('hfile-'+id,'hflist-'+id); }
  else { vmRenderFileList('hnopFile','hnopList'); }
});

/* ========================================================================
   BUỔI HỌC CỦA EM (học sinh xem trong từng bài giảng)
   ======================================================================== */
async function moBuoiHocHS(){
  $('modalBuoiHS').style.display='flex';
  $('bhsTenBai').textContent=details?details.title:'';
  var box=$('bhsNoiDung');
  box.innerHTML='<div class="no-content" style="padding:20px"><div class="spinner"></div><h3>Đang tải…</h3></div>';
  var html='';
  try{
    var rS=await sb.from('class_sessions').select('id, title, held_on').eq('class_id', details.class_id).eq('lesson_id', lessonId).order('created_at',{ascending:false}).limit(1).maybeSingle();
    if(rS.data){
      var sid=rS.data.id; var ngay=rS.data.held_on;
      var rA=await sb.from('attendance').select('status').eq('session_id',sid).eq('student_id',nguoiDung.id).maybeSingle();
      var rN=await sb.from('session_remarks').select('remark, attitude_score').eq('class_id',details.class_id).eq('student_id',nguoiDung.id).eq('ngay',ngay).maybeSingle();
      var ddTxt = rA.data ? '<span style="color:var(--ok);font-weight:700">🟢 Có mặt</span>' : '<span style="color:var(--err);font-weight:700">🔴 Chưa ghi nhận có mặt</span>';
      html+='<div class="hub-card"><div style="font-weight:700;margin-bottom:6px">✅ Điểm danh & nhận xét buổi</div>'+
        '<div style="font-size:.88rem">Điểm danh: '+ddTxt+'</div>';
      if(rN.data&&(rN.data.remark||rN.data.attitude_score!=null)){
        if(rN.data.attitude_score!=null) html+='<div style="font-size:.88rem;margin-top:6px">Điểm thái độ: <b style="color:var(--accent)">'+rN.data.attitude_score+'/10</b></div>';
        if(rN.data.remark) html+='<div style="font-size:.88rem;margin-top:6px;white-space:pre-wrap;padding:8px;background:var(--surface-2);border-radius:6px">💬 '+hubEsc(rN.data.remark)+'</div>';
      } else {
        html+='<div style="font-size:.84rem;color:var(--ink-3);margin-top:6px">Chưa có nhận xét cho buổi này.</div>';
      }
      html+='</div>';
    } else {
      html+='<div class="hub-card" style="color:var(--ink-3);font-size:.85rem">Thầy chưa mở điểm danh cho bài giảng này.</div>';
    }
  }catch(e){}
  try{
    var rB=await sb.from('submissions').select('id, submitted_at, files, status, score, feedback, graded_files').eq('lesson_id',lessonId).eq('student_id',nguoiDung.id).order('submitted_at',{ascending:false});
    var ds=rB.data||[];
    html+='<div class="hub-card"><div style="font-weight:700;margin-bottom:6px">📝 Bài làm & kết quả chấm</div>';
    if(!ds.length){
      html+='<div style="font-size:.85rem;color:var(--ink-3)">Em chưa nộp bài cho bài giảng này. <a href="javascript:void(0)" onclick="dongBuoiHocHS();moNopBai()" style="color:var(--accent);text-decoration:underline">Nộp bài ngay</a></div>';
    } else {
      html+=ds.map(function(s){
        var ngay=new Date(s.submitted_at).toLocaleString('vi-VN');
        var links=(s.files||[]).map(function(f){return '<a href="'+f.link+'" target="_blank">'+hubEsc(f.name)+'</a>';}).join(' · ');
        var kq;
        if(s.status==='graded'){
          kq='<span class="badge badge-ok">Đã chấm'+(s.score!=null?' · '+s.score+' điểm':'')+'</span>'+
            (s.feedback?'<div style="font-size:.85rem;margin-top:6px;white-space:pre-wrap">💬 '+hubEsc(s.feedback)+'</div>':'')+
            ((s.graded_files||[]).length?'<div style="font-size:.85rem;margin-top:6px">📄 Bài thầy chấm: '+s.graded_files.map(function(f){return '<a href="'+f.link+'" target="_blank">'+hubEsc(f.name)+'</a>';}).join(' · ')+'</div>':'');
        } else { kq='<span class="badge badge-warn">Chờ thầy chấm</span>'; }
        return '<div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px">'+
          '<div style="font-size:.78rem;color:var(--ink-3)">'+ngay+'</div>'+
          '<div style="font-size:.85rem;margin:4px 0">'+links+'</div>'+kq+'</div>';
      }).join('');
    }
    html+='</div>';
  }catch(e){}
  box.innerHTML=html;
}
function dongBuoiHocHS(){ $('modalBuoiHS').style.display='none'; }
</script>
