<!doctype html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/vinhmath-192.png">
  <meta name="theme-color" content="#d89200"><title>Cổng thi đối tác — VinhMath</title>
  <link rel="stylesheet" href="css/tokens.css?v=8.2"><link rel="stylesheet" href="css/vinhmath.css?v=8.1">
  <style>
    .portal-admin{max-width:1180px;margin:0 auto;padding:36px 22px 90px}.pa-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:24px}.pa-head h1{margin:5px 0}.pa-layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:18px}.pa-list,.pa-editor{padding:18px}.pa-list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.pa-list-head h2,.pa-section h2{font-size:1.05rem;margin:0}.pa-item{width:100%;display:block;text-align:left;padding:12px;margin:7px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer}.pa-item.active{border-color:var(--accent);background:var(--accent-soft)}.pa-item b,.pa-item small{display:block}.pa-item small{color:var(--ink-3);margin-top:3px}.pa-section{border-top:1px solid var(--line);padding-top:20px;margin-top:22px}.pa-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.pa-field{display:grid;gap:5px}.pa-field.full{grid-column:1/-1}.pa-field label{font-size:.78rem;font-weight:700;color:var(--ink-2)}.pa-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.pa-exams{display:grid;gap:8px;margin-top:12px}.pa-exam{display:flex;gap:10px;align-items:flex-start;padding:11px;border:1px solid var(--line);border-radius:10px}.pa-exam input{margin-top:4px}.pa-table{width:100%;border-collapse:collapse;margin-top:12px}.pa-table th,.pa-table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:.82rem}.pa-note{font-size:.8rem;color:var(--ink-3);line-height:1.55}.pa-result{margin-top:10px;padding:10px;border-radius:10px;background:var(--ok-soft);color:var(--ok);display:none}.pa-empty{padding:35px;text-align:center;color:var(--ink-3)}
    @media(max-width:820px){.portal-admin{padding:24px 14px 72px}.pa-layout{grid-template-columns:1fr}.pa-grid{grid-template-columns:1fr}.pa-field.full{grid-column:auto}.pa-head{align-items:stretch;flex-direction:column}}
  </style>
</head>
<body>
<header class="topbar"><div class="nav"><a class="logo" href="quan-tri"><img src="img/logo.png" alt="VinhMath"><span><b>Vinh</b>Math</span></a><nav class="navlinks"></nav><button class="btn btn-ghost btn-sm" id="themeBtn" onclick="vmDoiTheme()">☼</button><button class="btn btn-secondary btn-sm" onclick="dangXuat()">Đăng xuất</button></div></header>
<main class="portal-admin">
  <div class="pa-head"><div><div class="sec-label">Thương hiệu & đối tác</div><h1>Cổng thi đối tác</h1><p>Quản lý portal, kỳ thi và tài khoản riêng mà không cấp quyền giáo viên toàn hệ thống.</p></div><a class="btn btn-secondary" href="quan-tri">← Trung tâm quản trị</a></div>
  <div class="pa-layout">
    <aside class="card pa-list"><div class="pa-list-head"><h2>Danh sách portal</h2><button class="btn btn-primary btn-sm" onclick="paTaoMoi()">+ Tạo</button></div><div id="paPortalList"><div class="pa-empty">Đang tải…</div></div></aside>
    <section class="card pa-editor" id="paEditor"><div class="pa-empty">Chọn một portal hoặc bấm “Tạo”.</div></section>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="js/config.js"></script><script src="js/vinhmath.js?v=8.4"></script><script src="js/menu-v5.js?v=8.5"></script>
<script>
var paMe=null,paPortals=[],paBrands=[],paExams=[],paCurrent=null,paAssigned={};
function paEsc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function paSlug(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48);}
function paLoginSuffix(v){var s=String(v||'').toLowerCase().replace(/^@/,'').replace(/[^a-z0-9]/g,'');if(s&&!s.startsWith('hs'))s='hs'+s;return s.slice(0,22);}
function paTeacherSuffix(v){var s=String(v||'').toLowerCase().replace(/^@/,'').replace(/[^a-z0-9]/g,'');if(s&&!s.startsWith('gv'))s='gv'+s;return s.slice(0,22);}
function paMsg(text,ok){var el=document.getElementById('paMessage');if(!el)return;el.textContent=text;el.style.color=ok?'var(--ok)':'var(--err)';}
async function paTaiNen(){var results=await Promise.all([sb.from('exam_portals').select('id,slug,login_suffix,teacher_login_suffix,name,short_name,description,brand_id,support_text,is_active').order('name'),sb.from('brand_templates').select('id,name,slug,is_active').order('name'),sb.from('exams').select('id,title,published,created_at').eq('published',true).order('created_at',{ascending:false}).limit(250)]);if(results[0].error)throw results[0].error;paPortals=results[0].data||[];paBrands=results[1].data||[];paExams=results[2].data||[];paVeList();if(paCurrent){var found=paPortals.find(function(x){return x.id===paCurrent.id;});if(found)await paChon(found.id);}else if(paPortals[0])await paChon(paPortals[0].id);}
function paVeList(){document.getElementById('paPortalList').innerHTML=paPortals.length?paPortals.map(function(p){return '<button class="pa-item'+(paCurrent&&paCurrent.id===p.id?' active':'')+'" onclick="paChon(\''+p.id+'\')"><b>'+paEsc(p.name)+'</b><small>@'+paEsc(p.login_suffix)+' / @'+paEsc(p.teacher_login_suffix)+' · '+(p.is_active?'Đang hoạt động':'Đã tạm dừng')+'</small></button>';}).join(''):'<div class="pa-empty">Chưa có portal.</div>';}
function paBrandOptions(selected){return paBrands.filter(function(b){return b.is_active||b.id===selected;}).map(function(b){return '<option value="'+b.id+'"'+(b.id===selected?' selected':'')+'>'+paEsc(b.name)+'</option>';}).join('');}
function paEditorHtml(p,isNew){return '<form onsubmit="paLuu(event)"><div class="pa-grid"><div class="pa-field full"><label>Tên portal</label><input class="input" id="paName" required value="'+paEsc(p.name||'')+'"></div><div class="pa-field"><label>Slug portal</label><input class="input" id="paSlug" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*" value="'+paEsc(p.slug||'')+'"><small class="pa-note">Dùng trong địa chỉ portal.</small></div><div class="pa-field"><label>Hậu tố học sinh</label><input class="input" id="paLoginSuffix" required pattern="hs[a-z0-9]{2,20}" value="'+paEsc(p.login_suffix||'')+'" placeholder="hstt"><small class="pa-note">Đăng nhập tên@<span id="paSuffixHint">'+paEsc(p.login_suffix||'hstt')+'</span></small></div><div class="pa-field"><label>Hậu tố giáo viên portal</label><input class="input" id="paTeacherSuffix" required pattern="gv[a-z0-9]{2,20}" value="'+paEsc(p.teacher_login_suffix||'')+'" placeholder="gvtt"><small class="pa-note">Đăng nhập tên@<span id="paTeacherSuffixHint">'+paEsc(p.teacher_login_suffix||'gvtt')+'</span></small></div><div class="pa-field"><label>Tên ngắn</label><input class="input" id="paShort" value="'+paEsc(p.short_name||'')+'"></div><div class="pa-field"><label>Thương hiệu</label><select class="input" id="paBrand"><option value="">VinhMath mặc định</option>'+paBrandOptions(p.brand_id)+'</select></div><div class="pa-field"><label>Trạng thái</label><select class="input" id="paActive"><option value="true"'+(p.is_active!==false?' selected':'')+'>Hoạt động</option><option value="false"'+(p.is_active===false?' selected':'')+'>Tạm dừng</option></select></div><div class="pa-field full"><label>Mô tả</label><textarea class="input" id="paDescription" rows="2">'+paEsc(p.description||'')+'</textarea></div><div class="pa-field full"><label>Thông tin hỗ trợ</label><input class="input" id="paSupport" value="'+paEsc(p.support_text||'')+'" placeholder="Ví dụ: Liên hệ giáo viên phụ trách"></div></div><div class="pa-actions"><button class="btn btn-primary" type="submit">💾 '+(isNew?'Tạo portal':'Lưu thay đổi')+'</button>'+(isNew?'':'<a class="btn btn-secondary" href="thi?portal='+encodeURIComponent(p.slug)+'">Xem portal</a>')+'</div><div id="paMessage" class="pa-note" aria-live="polite"></div></form>'+(isNew?'':paPortalSections());}
function paPortalSections(){return '<section class="pa-section"><h2>🧪 Kỳ thi được giao</h2><p class="pa-note">Học sinh portal chỉ thấy những đề bật bên dưới; dữ liệu được chặn thêm bằng RLS.</p><div class="pa-exams" id="paExamList">'+(paExams.length?paExams.map(function(e){return '<label class="pa-exam"><input type="checkbox" '+(paAssigned[e.id]?'checked':'')+' onchange="paGanDe(\''+e.id+'\',this.checked)"><span><b>'+paEsc(e.title)+'</b><small class="pa-note">'+new Date(e.created_at).toLocaleDateString('vi-VN')+'</small></span></label>';}).join(''):'<div class="pa-empty">Chưa có đề đã xuất bản.</div>')+'</div></section><section class="pa-section"><h2>👤 Tạo tài khoản portal</h2><p class="pa-note">Học sinh dùng <b>username@'+paEsc(paCurrent.login_suffix)+'</b>; giáo viên portal dùng <b>username@'+paEsc(paCurrent.teacher_login_suffix)+'</b>. Giáo viên chỉ quản lý portal này, không có quyền trên VinhMath chung.</p><form class="pa-grid" onsubmit="paTaoHocSinh(event)"><div class="pa-field"><label>Loại tài khoản</label><select class="input" id="paAccountType"><option value="portal_hs">Học sinh portal</option><option value="portal_gv">Giáo viên portal</option></select></div><div class="pa-field"><label>Họ tên</label><input class="input" id="paStudentName" required></div><div class="pa-field"><label>Username</label><input class="input" id="paStudentUser" required pattern="[A-Za-z0-9._-]+"></div><div class="pa-field"><label>Mật khẩu ban đầu</label><input class="input" id="paStudentPass" type="password" minlength="8" required autocomplete="new-password"></div><div class="pa-field" style="align-self:end"><button class="btn btn-primary" id="paStudentBtn">Tạo tài khoản</button></div></form><div class="pa-result" id="paStudentResult"></div></section><section class="pa-section"><h2>👥 Thành viên</h2><form class="pa-grid" onsubmit="paThemThanhVien(event)"><div class="pa-field"><label>Username hiện có</label><input class="input" id="paMemberUser" required></div><div class="pa-field"><label>Vai trò trong portal</label><select class="input" id="paMemberRole"><option value="student">Học sinh</option><option value="manager">Quản lý đối tác</option><option value="owner">Chủ portal</option></select></div><div class="pa-field"><button class="btn btn-secondary">Thêm thành viên</button></div></form><div id="paMemberList"><div class="pa-empty">Đang tải…</div></div></section>';}
function paTaoMoi(){paCurrent={id:null,slug:'',login_suffix:'',teacher_login_suffix:'',name:'',short_name:'',description:'',brand_id:'',support_text:'',is_active:true};paAssigned={};paVeList();document.getElementById('paEditor').innerHTML=paEditorHtml(paCurrent,true);document.getElementById('paName').addEventListener('input',function(){if(!document.getElementById('paSlug').dataset.edited)document.getElementById('paSlug').value=paSlug(this.value);if(!document.getElementById('paLoginSuffix').dataset.edited){var hs=paLoginSuffix(paSlug(this.value));document.getElementById('paLoginSuffix').value=hs;document.getElementById('paSuffixHint').textContent=hs||'hstt';if(!document.getElementById('paTeacherSuffix').dataset.edited){var gv=paTeacherSuffix(hs.replace(/^hs/,''));document.getElementById('paTeacherSuffix').value=gv;document.getElementById('paTeacherSuffixHint').textContent=gv||'gvtt';}}});document.getElementById('paSlug').addEventListener('input',function(){this.dataset.edited='1';this.value=paSlug(this.value);});document.getElementById('paLoginSuffix').addEventListener('input',function(){this.dataset.edited='1';this.value=paLoginSuffix(this.value);document.getElementById('paSuffixHint').textContent=this.value||'hstt';if(!document.getElementById('paTeacherSuffix').dataset.edited){var gv=paTeacherSuffix(this.value.replace(/^hs/,''));document.getElementById('paTeacherSuffix').value=gv;document.getElementById('paTeacherSuffixHint').textContent=gv||'gvtt';}});document.getElementById('paTeacherSuffix').addEventListener('input',function(){this.dataset.edited='1';this.value=paTeacherSuffix(this.value);document.getElementById('paTeacherSuffixHint').textContent=this.value||'gvtt';});}
async function paChon(id){paCurrent=paPortals.find(function(x){return x.id===id;});if(!paCurrent)return;var a=await sb.from('exam_portal_exams').select('exam_id,published').eq('portal_id',id);paAssigned={};(a.data||[]).forEach(function(x){paAssigned[x.exam_id]=x;});paVeList();document.getElementById('paEditor').innerHTML=paEditorHtml(paCurrent,false);await paTaiThanhVien();}
async function paLuu(e){e.preventDefault();var payload={name:document.getElementById('paName').value.trim(),slug:paSlug(document.getElementById('paSlug').value),login_suffix:paLoginSuffix(document.getElementById('paLoginSuffix').value),teacher_login_suffix:paTeacherSuffix(document.getElementById('paTeacherSuffix').value),short_name:document.getElementById('paShort').value.trim()||null,description:document.getElementById('paDescription').value.trim()||null,brand_id:document.getElementById('paBrand').value||null,support_text:document.getElementById('paSupport').value.trim()||null,is_active:document.getElementById('paActive').value==='true',updated_at:new Date().toISOString()};if(!/^hs[a-z0-9]{2,20}$/.test(payload.login_suffix)||payload.login_suffix==='hs'||!/^gv[a-z0-9]{2,20}$/.test(payload.teacher_login_suffix)||payload.teacher_login_suffix==='gv'){paMsg('Hậu tố phải là cặp hs… / gv… có thêm 2–20 chữ hoặc số, ví dụ hstt / gvtt.',false);return;}var result;if(paCurrent.id)result=await sb.from('exam_portals').update(payload).eq('id',paCurrent.id).select().single();else{payload.created_by=paMe.id;result=await sb.from('exam_portals').insert(payload).select().single();}if(result.error){paMsg('Không lưu được: '+result.error.message,false);return;}paCurrent=result.data;await paTaiNen();}
async function paGanDe(examId,checked){var result=checked?await sb.from('exam_portal_exams').upsert({portal_id:paCurrent.id,exam_id:examId,published:true},{onConflict:'portal_id,exam_id'}):await sb.from('exam_portal_exams').delete().eq('portal_id',paCurrent.id).eq('exam_id',examId);if(result.error){alert('Không cập nhật được đề: '+result.error.message);await paChon(paCurrent.id);}}
async function paTaoHocSinh(e){e.preventDefault();var btn=document.getElementById('paStudentBtn'),box=document.getElementById('paStudentResult');btn.disabled=true;btn.textContent='Đang tạo…';box.style.display='none';var response=await sb.functions.invoke('tao-tai-khoan',{body:{type:document.getElementById('paAccountType').value,portalId:paCurrent.id,fullName:document.getElementById('paStudentName').value.trim(),username:document.getElementById('paStudentUser').value.trim(),password:document.getElementById('paStudentPass').value}});btn.disabled=false;btn.textContent='Tạo tài khoản';document.getElementById('paStudentPass').value='';if(response.error||!response.data||!response.data.ok){alert('Không tạo được tài khoản: '+((response.data&&response.data.error)||response.error&&response.error.message||'Lỗi không xác định'));return;}box.style.display='block';box.textContent='Đã tạo: '+response.data.login+' — hãy chuyển mật khẩu ban đầu qua kênh riêng.';await paTaiThanhVien();}
async function paThemThanhVien(e){e.preventDefault();var username=document.getElementById('paMemberUser').value.trim().replace(/^@/,'');var p=await sb.from('profiles').select('id,username').ilike('username',username).maybeSingle();if(p.error||!p.data){alert('Không tìm thấy username này.');return;}var role=document.getElementById('paMemberRole').value;/* Tài khoản có sẵn vẫn thuộc VinhMath; chỉ Edge Function được tạo tài khoản portal_only mới. */var result=await sb.from('exam_portal_members').upsert({portal_id:paCurrent.id,user_id:p.data.id,member_role:role,portal_only:false},{onConflict:'portal_id,user_id'});if(result.error){alert(result.error.message);return;}document.getElementById('paMemberUser').value='';await paTaiThanhVien();}
async function paTaiThanhVien(){var box=document.getElementById('paMemberList');if(!box||!paCurrent)return;var r=await sb.from('exam_portal_members').select('user_id,member_role,portal_only,profile:profiles(full_name,username)').eq('portal_id',paCurrent.id).order('created_at');var rows=r.data||[];box.innerHTML=rows.length?'<table class="pa-table"><thead><tr><th>Thành viên</th><th>Vai trò</th><th>Phạm vi</th></tr></thead><tbody>'+rows.map(function(m){var p=m.profile||{};return '<tr><td><b>'+paEsc(p.full_name||p.username||m.user_id)+'</b><br><small>@'+paEsc(p.username||'')+'</small></td><td>'+paEsc(m.member_role)+'</td><td>'+(m.portal_only?'Chỉ portal':'Portal + VinhMath')+'</td></tr>';}).join('')+'</tbody></table>':'<div class="pa-empty">Chưa có thành viên.</div>';}
(async function(){if(!daKetNoi())return;paMe=await yeuCauDangNhap();if(!paMe)return;if(paMe.role!=='admin'){location.replace('trang-chu');return;}try{await paTaiNen();}catch(e){document.getElementById('paEditor').innerHTML='<div class="pa-empty">Không tải được cổng thi: '+paEsc(e.message)+'</div>';}})();
</script>
</body></html>
