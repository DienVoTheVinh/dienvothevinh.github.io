<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bảng Vàng Vinh Danh — VinhMath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="vinhmath.css">
<style>
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px 96px; }

/* ===== HERO ===== */
.bv-hero {
  position: relative; overflow: hidden; text-align: center;
  padding: 56px 24px 48px; margin: 24px 0 28px;
  border-radius: var(--r-lg);
  background:
    radial-gradient(circle at 20% 0%, rgba(241,196,15,0.22), transparent 55%),
    radial-gradient(circle at 80% 10%, rgba(181,72,58,0.20), transparent 55%),
    linear-gradient(160deg, #2a2622, #1c1916);
  border: 1px solid rgba(241,196,15,0.35);
  box-shadow: 0 18px 50px rgba(0,0,0,.35);
}
.bv-hero .crown { font-size: 3rem; filter: drop-shadow(0 4px 10px rgba(241,196,15,.5)); animation: floaty 3s ease-in-out infinite; }
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.bv-hero h1 {
  font-size: 2.4rem; font-weight: 900; letter-spacing: .5px; margin: 8px 0 6px;
  background: linear-gradient(90deg, #F39C12, #F1C40F, #FFF3B0, #F1C40F, #F39C12);
  background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; animation: shimmer 4s linear infinite;
}
@keyframes shimmer { to { background-position: 200% center; } }
.bv-hero p { color: #e8e2d8; font-size: 1rem; max-width: 56ch; margin: 0 auto; opacity: .92; }
.bv-spark { position: absolute; pointer-events: none; opacity: .5; font-size: 1.1rem; animation: twinkle 2.4s infinite; }
@keyframes twinkle { 0%,100% { opacity: .2; transform: scale(.8); } 50% { opacity: .9; transform: scale(1.15); } }

/* ===== FILTER BAR ===== */
.bv-filter { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; margin-bottom: 32px; }
.bv-filter .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; padding: 4px; gap: 4px; }
.bv-seg-btn { padding: 8px 18px; border-radius: 99px; font-size: .88rem; font-weight: 700; background: transparent; border: none; color: var(--ink-2); cursor: pointer; transition: all .2s ease; }
.bv-seg-btn.active { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(181,72,58,.35); }
.bv-select { padding: 9px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: .88rem; font-weight: 600; font-family: inherit; cursor: pointer; min-width: 180px; }

/* ===== PODIUM (TOP 3) ===== */
.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 16px; align-items: end; margin-bottom: 36px; }
@media(max-width: 720px){ .podium { grid-template-columns: 1fr; } }
.pod { position: relative; border-radius: var(--r-lg); padding: 24px 16px 22px; text-align: center; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); transition: transform .25s ease; }
.pod:hover { transform: translateY(-5px); }
.pod .medal { font-size: 2rem; line-height: 1; }
.pod .pavatar { width: 78px; height: 78px; border-radius: 50%; margin: 10px auto 8px; object-fit: cover; display: grid; place-items: center; font-weight: 900; font-size: 1.6rem; color: #fff; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
.pod .pname { font-weight: 800; font-size: 1rem; margin-bottom: 2px; }
.pod .pclass { font-size: .76rem; color: var(--ink-3); margin-bottom: 10px; }
.pod .pscore { font-size: 1.9rem; font-weight: 900; line-height: 1; }
.pod .pscore small { font-size: .72rem; font-weight: 700; color: var(--ink-3); }
.pod .ptier { display: inline-block; margin-top: 8px; }
.pod-1 { border-color: #F1C40F; background: linear-gradient(180deg, rgba(241,196,15,.16), var(--surface)); transform: translateY(-14px); }
.pod-1:hover { transform: translateY(-19px); }
.pod-1 .pscore { color: #D68910; }
.pod-1 .pavatar { width: 92px; height: 92px; font-size: 1.9rem; border: 3px solid #F1C40F; }
.pod-2 { border-color: #BDC3C7; background: linear-gradient(180deg, rgba(189,195,199,.18), var(--surface)); }
.pod-2 .pscore { color: #7F8C8D; }
.pod-3 { border-color: #CD7F32; background: linear-gradient(180deg, rgba(205,127,50,.16), var(--surface)); }
.pod-3 .pscore { color: #B9722C; }
.pod .crown-top { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 1.8rem; filter: drop-shadow(0 3px 6px rgba(241,196,15,.6)); }

/* ===== RANK TIER BADGE ===== */
.tier { display: inline-flex; align-items: center; gap: 5px; padding: 3px 11px; border-radius: 99px; font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .4px; color: #fff; }
.t-bronze { background: linear-gradient(135deg, #8D5B4C, #CD7F32, #E6A15C); }
.t-silver { background: linear-gradient(135deg, #7F8C8D, #BDC3C7); }
.t-gold { background: linear-gradient(135deg, #F39C12, #F1C40F, #D68910); }
.t-platinum { background: linear-gradient(135deg, #00C9FF, #92FE9D); color: #1F1D1A; }
.t-diamond { background: linear-gradient(135deg, #fbc2eb, #a6c1ee, #fbc2eb); color: #4A148C; }

/* ===== RANKED LIST ===== */
.bv-list { display: flex; flex-direction: column; gap: 8px; }
.bv-row { display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); transition: all .2s ease; }
.bv-row:hover { transform: translateX(4px); border-color: var(--accent); }
.bv-row.me { border-left: 4px solid var(--accent); background: var(--accent-soft); }
.bv-rk { font-size: 1.1rem; font-weight: 900; width: 34px; text-align: center; color: var(--ink-2); }
.bv-av { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; display: grid; place-items: center; font-weight: 800; color: #fff; flex-shrink: 0; }
.bv-info { flex: 1; min-width: 0; }
.bv-nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bv-cl { font-size: .76rem; color: var(--ink-3); margin-top: 1px; }
.bv-sc { font-size: 1.2rem; font-weight: 900; color: var(--accent); }
.bv-empty { text-align: center; padding: 56px 24px; color: var(--ink-3); }
.bv-note { text-align:center; font-size:.8rem; color:var(--ink-3); margin-top:22px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="nav">
    <a class="logo" href="index.html"><span class="dot">V</span>VinhMath <small>· Lớp Toán Thầy Vinh</small></a>
    <nav class="navlinks"><!-- menu.js --></nav>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="btn btn-ghost btn-sm" id="themeBtn" onclick="toggleTheme()">🌙</button>
      <button class="btn btn-secondary btn-sm" onclick="dangXuat()">Đăng xuất</button>
    </div>
  </div>
</div>

<div class="wrap">
  <section class="bv-hero">
    <span class="bv-spark" style="top:18%;left:12%">✨</span>
    <span class="bv-spark" style="top:30%;right:14%;animation-delay:.6s">⭐</span>
    <span class="bv-spark" style="bottom:22%;left:22%;animation-delay:1.1s">✨</span>
    <span class="bv-spark" style="bottom:28%;right:20%;animation-delay:1.6s">🌟</span>
    <div class="crown">👑</div>
    <h1>BẢNG VÀNG VINH DANH</h1>
    <p>Nơi gọi tên những chiến binh VinhMath chăm chỉ, kỷ luật và bứt phá nhất. Hãy luyện tập mỗi ngày để khắc tên mình lên bảng vàng! 🚀</p>
  </section>

  <div class="bv-filter">
    <div class="seg">
      <button class="bv-seg-btn active" id="segAll" onclick="chonToanBo()">🌍 Toàn hệ thống</button>
      <button class="bv-seg-btn" id="segClass" onclick="document.getElementById('bvClassSelect').focus()">🏫 Theo lớp</button>
    </div>
    <select class="bv-select" id="bvClassSelect" onchange="chonLop(this.value)">
      <option value="">— Chọn lớp để xem —</option>
    </select>
  </div>

  <div id="podiumWrap"></div>
  <div id="listWrap" class="bv-list"></div>
  <p class="bv-note" id="bvNote"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="vinhmath.js"></script>
<script src="menu.js"></script>
<script src="analytics.js"></script>
<script>
var MAU = ['#B5483A', '#5E7B5E', '#A8842C', '#4A6FA5', '#7B5EA7', '#C26B4E', '#3E8E7E', '#9C5570'];
var myId = null;
var dangLoc = null; // null = toàn bộ, hoặc class_id

function escHtml(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function getRankInfo(score){
  if (score >= 9) return { title: 'Học thần', badge: '👑 Kim cương', cls: 't-diamond' };
  if (score >= 8) return { title: 'Đại sư', badge: '💎 Bạch kim', cls: 't-platinum' };
  if (score >= 6.5) return { title: 'Bứt phá', badge: '🥇 Vàng', cls: 't-gold' };
  if (score >= 5) return { title: 'Kiên trì', badge: '🥈 Bạc', cls: 't-silver' };
  return { title: 'Khởi đầu', badge: '🥉 Đồng', cls: 't-bronze' };
}

function chuCai(ten){ var p = (ten||'?').trim().split(/\s+/); return (p[p.length-1]||'?').charAt(0).toUpperCase(); }
function avatarHTML(s, cls, idx){
  if (s.avatar_url) return '<img class="'+cls+'" src="'+escHtml(s.avatar_url)+'" alt="">';
  return '<span class="'+cls+'" style="background:'+MAU[idx % MAU.length]+'">'+chuCai(s.full_name)+'</span>';
}

async function taiBangVang(){
  var pod = document.getElementById('podiumWrap');
  var list = document.getElementById('listWrap');
  var note = document.getElementById('bvNote');
  pod.innerHTML = '';
  list.innerHTML = '<div class="bv-empty">Đang tải bảng vàng…</div>';
  note.textContent = '';

  if (!daKetNoi()){ list.innerHTML = '<div class="bv-empty">Web đang ở chế độ xem thử.</div>'; return; }

  var r = await sb.rpc('get_leaderboard', { p_class_id: dangLoc });
  if (r.error){ list.innerHTML = '<div class="bv-empty">Không tải được bảng vàng: '+escHtml(r.error.message)+'</div>'; return; }
  var ds = r.data || [];
  if (!ds.length){
    list.innerHTML = '<div class="bv-empty">🏅 Chưa có học sinh nào trên bảng vàng ở phạm vi này.<br>Hãy chăm chỉ học tập để trở thành người đầu tiên!</div>';
    return;
  }

  var top3 = ds.slice(0, 3);
  var rest = ds.slice(3, 30);

  // ----- PODIUM -----
  var medal = ['🥇','🥈','🥉'];
  var order = top3.length === 3 ? [1,0,2] : top3.map(function(_,i){return i;}); // giữa là số 1
  pod.className = 'podium';
  pod.innerHTML = order.map(function(pos){
    var s = top3[pos]; if (!s) return '';
    var rankNo = pos + 1;
    var tier = getRankInfo(Number(s.score));
    var crown = rankNo === 1 ? '<div class="crown-top">👑</div>' : '';
    var meTag = (s.student_id === myId) ? ' <small style="color:var(--accent);font-weight:800">(Tôi)</small>' : '';
    return '<div class="pod pod-'+rankNo+'">'+crown+
      '<div class="medal">'+medal[pos]+'</div>'+
      avatarHTML(s, 'pavatar', pos)+
      '<div class="pname">'+escHtml(s.full_name)+meTag+'</div>'+
      '<div class="pclass">'+escHtml(s.class_names||'')+'</div>'+
      '<div class="pscore">'+Number(s.score).toFixed(1)+'<small> /10</small></div>'+
      '<div class="ptier"><span class="tier '+tier.cls+'">'+tier.badge+'</span></div>'+
    '</div>';
  }).join('');

  // ----- DANH SÁCH CÒN LẠI -----
  if (!rest.length){ list.innerHTML = ''; }
  else {
    list.innerHTML = rest.map(function(s, i){
      var rankNo = i + 4;
      var tier = getRankInfo(Number(s.score));
      var me = (s.student_id === myId);
      var meTag = me ? ' <small style="color:var(--accent);font-weight:800">(Tôi)</small>' : '';
      return '<div class="bv-row'+(me?' me':'')+'">'+
        '<div class="bv-rk">'+rankNo+'</div>'+
        avatarHTML(s, 'bv-av', i+3)+
        '<div class="bv-info"><div class="bv-nm">'+escHtml(s.full_name)+meTag+
          ' <span class="tier '+tier.cls+'" style="font-size:.62rem;padding:1px 7px;vertical-align:middle">'+tier.badge+'</span></div>'+
          '<div class="bv-cl">Lớp: '+escHtml(s.class_names||'—')+'</div></div>'+
        '<div class="bv-sc">'+Number(s.score).toFixed(1)+'</div>'+
      '</div>';
    }).join('');
  }
  note.textContent = 'Điểm tổng hợp từ chuyên cần, giờ tự học, điểm trắc nghiệm và luyện đề. Bảng cập nhật theo hoạt động học tập thực tế.';
}

function chonToanBo(){
  dangLoc = null;
  document.getElementById('segAll').classList.add('active');
  document.getElementById('segClass').classList.remove('active');
  document.getElementById('bvClassSelect').value = '';
  taiBangVang();
}
function chonLop(classId){
  if (!classId){ chonToanBo(); return; }
  dangLoc = classId;
  document.getElementById('segAll').classList.remove('active');
  document.getElementById('segClass').classList.add('active');
  taiBangVang();
}

(async function(){
  if (daKetNoi()){
    try {
      var u = await sb.auth.getUser();
      if (u && u.data && u.data.user) myId = u.data.user.id;
    } catch(e){}
    // Nạp danh sách lớp cho bộ lọc
    try {
      var rc = await sb.from('classes').select('id, name').order('name');
      var sel = document.getElementById('bvClassSelect');
      (rc.data||[]).forEach(function(c){
        var o = document.createElement('option');
        o.value = c.id; o.textContent = c.name;
        sel.appendChild(o);
      });
    } catch(e){}
  }
  taiBangVang();
})();
</script>
</body>
</html>
