<!DOCTYPE html>
<html lang="vi">
<head>
<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="favicon.png?v=3">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chấm bài — VinhMath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css?v=5.2">
<link rel="stylesheet" href="css/vinhmath.css?v=5.2">
<!-- KaTeX for math rendering in quiz viewer -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
<style>
.wrap { max-width: 1000px; margin: 0 auto; padding: 0 24px 96px; }
.head { padding: 40px 0 20px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
.tab-btn { background: transparent; border: 1px solid var(--line-2); padding: 7px 16px; font-family: inherit; font-size: .88rem; font-weight: 500; color: var(--ink-2); cursor: pointer; border-radius: 99px; }
.tab-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.sub-card { margin-bottom: 16px; }
.sub-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.sub-files a { font-size: .88rem; }
.grade-row { display: grid; grid-template-columns: 110px 1fr; gap: 12px; margin-top: 14px; align-items: start; }
@media(max-width:640px) { .grade-row { grid-template-columns: 1fr; } }
.empty { text-align: center; padding: 64px 24px; color: var(--ink-3); }
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.modal-content { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-lg); width: 100%; max-width: 640px; padding: 28px; max-height: 88vh; overflow-y: auto; position: relative; }
/* ===== Ảnh nộp / ảnh chấm dạng thumbnail ===== */
.chb-label { font-size:.76rem; font-weight:700; color:var(--ink-3); text-transform:uppercase; letter-spacing:.03em; margin:10px 0 4px; }
.chb-thumbs { display:flex; flex-wrap:wrap; gap:8px; }
.chb-thumb { position:relative; width:88px; height:88px; border-radius:8px; overflow:hidden; border:1px solid var(--line-2); cursor:pointer; background:var(--surface-2); flex:none; }
.chb-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.chb-thumb .idx { position:absolute; top:2px; left:2px; background:rgba(0,0,0,.68); color:#fff; font-size:.64rem; font-weight:800; padding:0 5px; border-radius:5px; z-index:1; }
.chb-thumb.file { display:flex; align-items:center; justify-content:center; font-size:1.7rem; text-decoration:none; color:var(--ink-2); }
.chb-thumb:hover { border-color:var(--accent); transform:scale(1.03); transition:.12s; }
/* Khu dán/chọn ảnh chấm */
.chb-stage-zone { border:2px dashed var(--line-2); border-radius:10px; padding:12px; text-align:center; color:var(--ink-3); font-size:.84rem; cursor:pointer; outline:none; }
.chb-stage-zone:hover, .chb-stage-zone:focus, .chb-stage-zone.drag { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
.chb-cham-thumb { position:relative; width:94px; height:94px; border-radius:8px; overflow:hidden; border:1px solid var(--ok); flex:none; }
.chb-cham-thumb > img { width:100%; height:100%; object-fit:cover; cursor:zoom-in; display:block; }
.chb-cham-thumb .idx { position:absolute; top:2px; left:2px; background:rgba(16,185,129,.92); color:#fff; font-size:.64rem; font-weight:800; padding:0 5px; border-radius:5px; }
.chb-cham-thumb .ops { position:absolute; bottom:0; left:0; right:0; display:flex; background:rgba(0,0,0,.58); }
.chb-cham-thumb .ops button { flex:1; border:none; background:none; color:#fff; cursor:pointer; font-size:.72rem; padding:2px 0; line-height:1.4; }
.chb-cham-thumb .ops button:hover { background:rgba(255,255,255,.22); }
/* Lightbox modal overlay */
#chbLightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100000;
  background: rgba(0, 0, 0, 0.75);
  align-items: center;
  justify-content: center;
  padding: 20px;
  cursor: default;
}
/* Modal window container */
#chbLightbox .lb-modal {
  background: var(--bg, #fff);
  border: 1px solid var(--line, #e4e4e7);
  border-radius: 16px;
  width: 90vw;
  max-width: 960px;
  height: 85vh;
  max-height: 800px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  overflow: hidden;
  position: relative;
  animation: lbZoomIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes lbZoomIn {
  from { transform: scale(0.92); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
/* Header styling */
#chbLightbox .lb-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--line, #e4e4e7);
  background: var(--surface, #f4f4f5);
}
#chbLightbox .lb-title {
  font-weight: 800;
  font-size: 0.95rem;
  color: var(--ink, #18181b);
}
#chbLightbox #chbLbCount {
  font-weight: 700;
  font-size: 0.88rem;
  color: var(--accent, #d97706);
  background: var(--accent-soft, rgba(217, 119, 6, 0.1));
  padding: 2px 10px;
  border-radius: 99px;
  user-select: none;
}
#chbLightbox .lb-close-btn {
  background: none;
  border: none;
  font-size: 1.3rem;
  color: var(--ink-3, #71717a);
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
#chbLightbox .lb-close-btn:hover {
  background: rgba(0,0,0,0.06);
  color: #ef4444;
}
/* Body styling: holds arrows and image container */
#chbLightbox .lb-body {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px;
  background: var(--surface-2, #fafafa);
  overflow: hidden;
  position: relative;
}
/* Image wrapper with auto overflow when rotated */
#chbLightbox .lb-img-container {
  flex: 1;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
  position: relative;
}
#chbLightbox img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 6px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  transition: transform 0.25s cubic-bezier(0.1, 0.8, 0.3, 1);
}
/* Arrow buttons */
#chbLightbox .lb-arrow {
  background: var(--surface, #f4f4f5);
  border: 1px solid var(--line, #e4e4e7);
  color: var(--ink, #18181b);
  width: 52px;
  height: 52px;
  border-radius: 50%;
  font-size: 2rem;
  font-weight: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  line-height: 1;
  user-select: none;
  z-index: 10;
  margin: 0 12px;
}
#chbLightbox .lb-arrow:hover {
  background: var(--accent, #d97706);
  border-color: var(--accent, #d97706);
  color: #fff;
  transform: scale(1.1);
  box-shadow: 0 6px 15px rgba(217, 119, 6, 0.3);
}
#chbLightbox .lb-arrow:active {
  transform: scale(0.95);
}
/* Footer control bar */
#chbLightbox .lb-footer {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 14px 20px;
  border-top: 1px solid var(--line, #e4e4e7);
  background: var(--surface, #f4f4f5);
}
#chbLightbox .lb-btn {
  background: var(--bg, #fff);
  border: 1px solid var(--line, #e4e4e7);
  color: var(--ink-2, #3f3f46);
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 20px;
  transition: all 0.15s ease;
  text-decoration: none;
  line-height: 1;
  user-select: none;
}
#chbLightbox .lb-btn:hover {
  background: var(--surface-2, #fafafa);
  color: var(--ink, #18181b);
  border-color: var(--ink-3, #71717a);
}
#chbLightbox .lb-btn:active {
  transform: scale(0.97);
}
#chbLightbox .lb-btn-primary {
  background: var(--accent, #d97706);
  color: #fff !important;
  border-color: var(--accent, #d97706);
  box-shadow: 0 4px 10px rgba(217,119,6,0.25);
}
#chbLightbox .lb-btn-primary:hover {
  background: #f59e0b;
  border-color: #f59e0b;
  box-shadow: 0 6px 15px rgba(217,119,6,0.4);
}
#chbLightbox .lb-btn-drive {
  background: #10b981;
  color: #fff !important;
  border-color: #10b981;
  box-shadow: 0 4px 10px rgba(16,185,129,0.25);
}
#chbLightbox .lb-btn-drive:hover {
  background: #34d399;
  border-color: #34d399;
  box-shadow: 0 6px 15px rgba(16,185,129,0.4);
}
#chbLightbox .lb-divider {
  width: 1px;
  height: 20px;
  background: var(--line, #e4e4e7);
  margin: 0 4px;
}
/* Mobile responsive adjustments */
@media (max-width: 768px) {
  #chbLightbox {
    padding: 8px;
  }
  #chbLightbox .lb-modal {
    width: 100vw;
    height: 100vh;
    max-height: 100%;
    border-radius: 0;
    border: none;
  }
  #chbLightbox .lb-arrow {
    display: none !important;
  }
  #chbLightbox .lb-body {
    padding: 8px;
  }
  #chbLightbox .lb-footer {
    padding: 10px;
    gap: 8px;
    flex-wrap: wrap;
  }
  #chbLightbox .lb-btn {
    padding: 8px 12px;
    font-size: 0.8rem;
  }
  #chbLightbox .lb-divider {
    display: none;
  }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="nav">
    <a class="logo" href="index"><img src="img/logo.png" alt="VinhMath"><span style="display: inline-flex; align-items: center; gap: 0;"><span class="brand-vinh" style="color: var(--accent) !important;">Vinh</span><span class="brand-math" style="color: var(--topbar-text, #ffffff) !important;">Math</span></span> <small>· Quản trị</small></a>
    <nav class="navlinks">
      <!-- Sẽ được điền tự động bằng menu.js -->
    </nav>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="btn btn-ghost btn-sm" id="themeBtn" onclick="toggleTheme()">🌙</button>
      <button class="btn btn-secondary btn-sm" onclick="dangXuat()">Đăng xuất</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="head">
    <div class="sec-label">Khu vực của thầy</div>
    <h1>Chấm bài học sinh nộp</h1>
    <p style="margin-top:6px">Bài nộp nằm trong Drive của thầy (thư mục <b>VINHMATH NOP BAI</b>). Chấm xong nhập điểm + lời phê, đính kèm file chấm nếu cần — học sinh thấy ngay.</p>
  </div>

  <div class="filters" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center">
    <button class="tab-btn active" id="loc-cho" onclick="locTheo('submitted')">🕐 Chờ chấm (<span id="demCho">0</span>)</button>
    <button class="tab-btn" id="loc-xong" onclick="locTheo('graded')">✓ Đã chấm (<span id="demXong">0</span>)</button>
    <button class="tab-btn" id="loc-tatca" onclick="locTheo('tatca')">Tất cả</button>
    <button class="tab-btn" id="loc-test" onclick="locTheo('test')">📝 Trắc nghiệm cuối giờ (<span id="demTest">0</span>)</button>
    <button class="tab-btn" id="loc-luyende" onclick="locTheo('luyende')">🎯 Luyện đề (<span id="demLuyenDe">0</span>)</button>
    
    <div style="display:flex; gap:10px; margin-left:auto; align-items:center; flex-wrap:wrap">
      <select class="input" id="selLop" onchange="capNhatDropdownBoLoc(); locDuLieu();" style="width:160px; padding:6px 12px; font-size:0.85rem">
        <option value="">-- Tất cả các lớp --</option>
      </select>
      <select class="input" id="selBai" onchange="locDuLieu()" style="width:200px; padding:6px 12px; font-size:0.85rem">
        <option value="">-- Tất cả các bài giảng --</option>
      </select>
    </div>
  </div>

  <div id="dsBaiNop"><div class="empty card">Đang tải…</div></div>
</div>

<!-- Modal chi tiết bài trắc nghiệm -->
<div class="modal" id="modalTest" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:16px">
  <div class="modal-content">
    <button onclick="$('modalTest').style.display='none'" style="position:absolute;top:16px;right:18px;font-size:1.4rem;background:none;border:none;cursor:pointer;color:var(--ink-3)">×</button>
    <h2 style="font-size:1.2rem;margin-bottom:4px;" id="mtTieuDe">Chi tiết bài trắc nghiệm</h2>
    <p style="font-size:.9rem;color:var(--ink-3);margin-bottom:14px;" id="mtThongTin"></p>
    <div id="mtDanhSach" style="display:flex;flex-direction:column;gap:12px"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/vinhmath.js?v=7.1"></script>
<script src="js/menu-v5.js"></script>
<script src="js/analytics.js"></script>
<script>
var tatCa = [];
var dsTestAttempts = [];
var dsLuyenDeAttempts = [];
var dsLop = [];
var dsBai = [];
var dsDe = [];
var dangLoc = 'submitted';
var myClassIds = [];
var hoSoNguoiDung = null;

(async function () {
  if (!daKetNoi()) { $('dsBaiNop').innerHTML = '<div class="empty card">Chưa kết nối Supabase.</div>'; return; }
  var hoSo = await yeuCauDangNhap();
  if (!hoSo) return;
  if (!['admin', 'teacher', 'assistant'].includes(hoSo.role)) { window.location.href = 'lop-hoc'; return; }
  hoSoNguoiDung = hoSo;
  
  // Lấy các lớp phụ trách
  if (hoSo.role !== 'admin') {
    var rC = await sb.from('classes').select('id').or('teacher_id.eq.' + hoSo.id + ',co_teacher_id.eq.' + hoSo.id);
    myClassIds = (rC.data || []).map(function (x) { return x.id; });
    
    var rA = await sb.from('class_assistants').select('class_id').eq('assistant_id', hoSo.id);
    (rA.data || []).forEach(function (x) {
      if (myClassIds.indexOf(x.class_id) === -1) myClassIds.push(x.class_id);
    });
  }
  
  try {
    var rLop = await sb.from('classes').select('id, name, is_specialized, teacher_id, co_teacher_id').order('grade').order('name');
    dsLop = rLop.data || [];
    
    var rBai = await sb.from('lessons').select('id, title, class_id').order('title');
    dsBai = rBai.data || [];
    
    var rDe = await sb.from('exams').select('id, title, class_id').order('title');
    dsDe = rDe.data || [];

    // Phân quyền cho GV/TG
    if (hoSo.role !== 'admin') {
      var myAssistantIds = [];
      try {
        var ra = await sb.from('class_assistants').select('class_id').eq('assistant_id', hoSo.id);
        myAssistantIds = (ra.data || []).map(function (x) { return x.class_id; });
      } catch (e) {}
      
      dsLop = dsLop.filter(function (l) {
        return l.teacher_id === hoSo.id || l.co_teacher_id === hoSo.id || myAssistantIds.indexOf(l.id) !== -1;
      });
      dsBai = dsBai.filter(function (b) {
        return myClassIds.indexOf(b.class_id) !== -1;
      });
      dsDe = dsDe.filter(function (d) {
        return d.class_id === null || myClassIds.indexOf(d.class_id) !== -1;
      });
    }
    
    $('selLop').innerHTML = '<option value="">-- Tất cả các lớp --</option>' + 
      dsLop.map(function (l) { return '<option value="' + l.id + '">' + l.name + (l.is_specialized ? ' (Chuyên)' : ' (Đại trà)') + '</option>'; }).join('');
      
    capNhatDropdownBoLoc();
  } catch (e) {
    console.error('Lỗi tải dữ liệu bộ lọc:', e);
  }
  
  await taiDanhSach();
  // Lọc sẵn theo link "Chấm ngay" từ bài giảng (?lop=&lesson=)
  try {
    var _p = new URLSearchParams(location.search);
    var _lop = _p.get('lop'), _bai = _p.get('lesson');
    if (_lop) { $('selLop').value = _lop; capNhatDropdownBoLoc(); }
    if (_bai) { $('selBai').value = _bai; }
    if (_lop || _bai) veDanhSach();
  } catch (e) {}
})();

function capNhatDropdownBoLoc() {
  var selLopVal = $('selLop').value;
  var selBai = $('selBai');
  
  if (dangLoc === 'luyende') {
    var dsDeLoc = dsDe;
    if (selLopVal) {
      dsDeLoc = dsDe.filter(function (d) { return d.class_id === selLopVal || d.class_id === null; });
    }
    selBai.innerHTML = '<option value="">-- Tất cả đề thi --</option>' +
      dsDeLoc.map(function (d) { return '<option value="' + d.id + '">' + d.title + '</option>'; }).join('');
  } else {
    var dsBaiLoc = dsBai;
    if (selLopVal) {
      dsBaiLoc = dsBai.filter(function (b) { return b.class_id === selLopVal; });
    }
    selBai.innerHTML = '<option value="">-- Tất cả bài giảng --</option>' +
      dsBaiLoc.map(function (b) { return '<option value="' + b.id + '">' + b.title + '</option>'; }).join('');
  }
}

function locDuLieu() {
  veDanhSach();
}

function matchLopMyClassIds(lessonOrExam, studentProfiles) {
  if (lessonOrExam && lessonOrExam.class_id) {
    return myClassIds.indexOf(lessonOrExam.class_id) !== -1;
  }
  if (studentProfiles && studentProfiles.class_students) {
    return studentProfiles.class_students.some(function (cs) {
      return myClassIds.indexOf(cs.class_id) !== -1;
    });
  }
  return false;
}

async function taiAttempts() {
  var r = await sb.from('attempts')
    .select('id, submitted_at, score, correct_n, total_n, lesson_id, lessons(title, class_id), profiles(full_name, username, class_students(class_id, classes(name)))')
    .not('lesson_id', 'is', null)
    .not('submitted_at', 'is', null)
    .order('submitted_at', { ascending: false });
  var data = r.data || [];
  if (hoSoNguoiDung.role !== 'admin') {
    data = data.filter(function (a) {
      return matchLopMyClassIds(a.lessons || a.exams, a.profiles);
    });
  }
  return data;
}

async function taiAttemptsLuyenDe() {
  var r = await sb.from('attempts')
    .select('id, submitted_at, score, correct_n, total_n, exam_id, exams(title, class_id), profiles(full_name, username, class_students(class_id, classes(name)))')
    .not('exam_id', 'is', null)
    .not('submitted_at', 'is', null)
    .order('submitted_at', { ascending: false });
  var data = r.data || [];
  if (hoSoNguoiDung.role !== 'admin') {
    data = data.filter(function (a) {
      return matchLopMyClassIds(a.exams || a.lessons, a.profiles);
    });
  }
  return data;
}

async function taiDanhSach() {
  var r = await sb.from('submissions')
    .select('id, submitted_at, files, status, score, feedback, graded_files, is_late, kind, lesson_id, lessons(title, class_id), exam_id, exams(title, class_id), profiles(full_name, username, class_students(class_id, classes(name)))')
    .order('submitted_at', { ascending: false });
  if (r.error) { $('dsBaiNop').innerHTML = '<div class="empty card">Lỗi: ' + r.error.message + '</div>'; return; }
  
  var data = r.data || [];
  if (hoSoNguoiDung.role !== 'admin') {
    data = data.filter(function (s) {
      return matchLopMyClassIds(s.lessons || s.exams, s.profiles);
    });
  }
  tatCa = data;
  
  $('demCho').textContent = tatCa.filter(function (s) { return s.status === 'submitted'; }).length;
  $('demXong').textContent = tatCa.filter(function (s) { return s.status === 'graded'; }).length;
  
  // Nạp thống kê trắc nghiệm và luyện đề chính xác
  var allTest = await taiAttempts();
  var allLuyenDe = await taiAttemptsLuyenDe();
  
  $('demTest').textContent = allTest.length;
  $('demLuyenDe').textContent = allLuyenDe.length;
  
  if (dangLoc === 'test') {
    dsTestAttempts = allTest;
  } else if (dangLoc === 'luyende') {
    dsLuyenDeAttempts = allLuyenDe;
  }
  veDanhSach();
}

async function locTheo(loai) {
  dangLoc = loai;
  ['cho', 'xong', 'tatca', 'test', 'luyende'].forEach(function (k) { $('loc-' + k).classList.remove('active'); });
  var mapping = { submitted: 'cho', graded: 'xong', tatca: 'tatca', test: 'test', luyende: 'luyende' };
  $('loc-' + mapping[loai]).classList.add('active');
  
  capNhatDropdownBoLoc();
  $('selBai').value = '';
  
  if (loai === 'test') {
    $('dsBaiNop').innerHTML = '<div class="empty card">Đang tải kết quả trắc nghiệm…</div>';
    dsTestAttempts = await taiAttempts();
  } else if (loai === 'luyende') {
    $('dsBaiNop').innerHTML = '<div class="empty card">Đang tải kết quả luyện đề…</div>';
    dsLuyenDeAttempts = await taiAttemptsLuyenDe();
  }
  veDanhSach();
}

function veDanhSach() {
  var selectedLop = $('selLop').value;
  var selectedSub = $('selBai').value;
  
  function matchLop(lessonOrExam, studentProfiles) {
    if (!selectedLop) return true;
    if (lessonOrExam && lessonOrExam.class_id) {
      return lessonOrExam.class_id === selectedLop;
    }
    // Fallback nếu bài học / đề thi không gán lớp học nào
    if (studentProfiles && studentProfiles.class_students) {
      var studentClassIds = (studentProfiles.class_students || []).map(function (cs) { return cs.class_id; });
      return studentClassIds.includes(selectedLop);
    }
    return false;
  }
  
  if (dangLoc === 'test') {
    var ds = dsTestAttempts.filter(function (s) {
      if (!matchLop(s.lessons || s.exams, s.profiles)) return false;
      if (selectedSub && s.lesson_id !== selectedSub) return false;
      return true;
    });
    if (!ds.length) {
      $('dsBaiNop').innerHTML = '<div class="empty card">Chưa có kết quả trắc nghiệm cuối giờ nào phù hợp bộ lọc.</div>';
      return;
    }
    $('dsBaiNop').innerHTML = ds.map(function (s) {
      var hs = s.profiles || {};
      var classNames = (hs.class_students || []).map(function (c) { return c.classes ? c.classes.name : ''; }).filter(Boolean).join(', ');
      var lop = classNames || '—';
      var ngay = new Date(s.submitted_at).toLocaleString('vi-VN');
      return '<div class="card sub-card">' +
        '<div class="sub-head">' +
          '<div><b>' + (hs.full_name || '?') + '</b> <span style="color:var(--ink-3);font-size:.85rem">(' + (hs.username || '') + ' · ' + lop + ')</span></div>' +
          '<span class="badge badge-ok">' + s.score.toFixed(1) + 'đ (' + s.correct_n + '/' + s.total_n + ' câu)</span>' +
        '</div>' +
        '<div style="font-size:.85rem;color:var(--ink-2);margin-top:4px">' + (s.lessons ? s.lessons.title : (s.exams ? '📝 Đề (tự luận): ' + s.exams.title : 'Bài đã xoá')) + ' · ' + ngay + '</div>' +
        '<div style="display:flex;justify-content:flex-end;margin-top:10px">' +
          '<button class="btn btn-secondary btn-sm" onclick="xemChiTietTest(\'' + s.id + '\', \'' + (hs.full_name || '?').replace(/'/g, "\\'") + '\', \'' + (s.lessons ? s.lessons.title : '').replace(/'/g, "\\'") + '\')">👁 Xem chi tiết bài làm</button>' +
        '</div>' +
        '</div>';
    }).join('');
    return;
  }

  if (dangLoc === 'luyende') {
    var ds = dsLuyenDeAttempts.filter(function (s) {
      if (!matchLop(s.exams || s.lessons, s.profiles)) return false;
      if (selectedSub && s.exam_id !== selectedSub) return false;
      return true;
    });
    if (!ds.length) {
      $('dsBaiNop').innerHTML = '<div class="empty card">Chưa có kết quả luyện đề nào phù hợp bộ lọc.</div>';
      return;
    }
    $('dsBaiNop').innerHTML = ds.map(function (s) {
      var hs = s.profiles || {};
      var classNames = (hs.class_students || []).map(function (c) { return c.classes ? c.classes.name : ''; }).filter(Boolean).join(', ');
      var lop = classNames || '—';
      var ngay = new Date(s.submitted_at).toLocaleString('vi-VN');
      return '<div class="card sub-card">' +
        '<div class="sub-head">' +
          '<div><b>' + (hs.full_name || '?') + '</b> <span style="color:var(--ink-3);font-size:.85rem">(' + (hs.username || '') + ' · ' + lop + ')</span></div>' +
          '<span class="badge badge-ok">' + s.score.toFixed(1) + 'đ (' + s.correct_n + '/' + s.total_n + ' câu)</span>' +
        '</div>' +
        '<div style="font-size:.85rem;color:var(--ink-2);margin-top:4px">' + (s.exams ? s.exams.title : 'Đề thi đã xoá') + ' · ' + ngay + '</div>' +
        '<div style="display:flex;justify-content:flex-end;margin-top:10px">' +
          '<button class="btn btn-secondary btn-sm" onclick="xemChiTietTest(\'' + s.id + '\', \'' + (hs.full_name || '?').replace(/'/g, "\\'") + '\', \'' + (s.exams ? s.exams.title : '').replace(/'/g, "\\'") + '\')">👁 Xem chi tiết bài làm</button>' +
        '</div>' +
        '</div>';
    }).join('');
    return;
  }

  var ds = dangLoc === 'tatca' ? tatCa : tatCa.filter(function (s) { return s.status === dangLoc; });
  ds = ds.filter(function (s) {
    if (!matchLop(s.lessons || s.exams, s.profiles)) return false;
    if (selectedSub && s.lesson_id !== selectedSub) return false;
    return true;
  });
  if (!ds.length) {
    $('dsBaiNop').innerHTML = '<div class="empty card">' + (dangLoc === 'submitted' ? 'Không có bài nào chờ chấm 🎉' : 'Trống.') + '</div>';
    return;
  }
  // Gom theo Học sinh + Bài + loại — mỗi HS/1 bài là 1 thẻ, các lần nộp xếp bên trong
  var groups = {}, order = [];
  ds.forEach(function (s) {
    var akey = s.lesson_id || s.exam_id || 'x';
    var gkey = (s.student_id || s.id) + '|' + akey + '|' + (s.kind || '');
    if (!groups[gkey]) { groups[gkey] = { subs: [] }; order.push(groups[gkey]); }
    groups[gkey].subs.push(s);
  });
  order.forEach(function (g) { g.subs.sort(function (a, b) { return new Date(b.submitted_at) - new Date(a.submitted_at); }); });

  function chbGradeForm(s) {
    var links = chbThumbs(s.files);
    var linksCham = chbThumbs(s.graded_files);
    var badge = s.status === 'graded'
      ? '<span class="badge badge-ok">Đã chấm' + (s.score != null ? ' · ' + s.score + 'đ' : '') + '</span>'
      : '<span class="badge badge-warn">Chờ chấm</span>';
    var lateChip = s.is_late ? '<span class="badge" style="background:#e74c3c;color:#fff;margin-left:6px">⏰ Nộp trễ</span>' : '';
    var ngay = new Date(s.submitted_at).toLocaleString('vi-VN');
    return '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px">' +
        '<div style="font-size:.82rem;color:var(--ink-3)">🕐 ' + ngay + '</div>' +
        '<div style="display:flex;align-items:center;flex-wrap:wrap">' + badge + lateChip + '</div>' +
      '</div>' +
      '<div class="chb-label">📎 Ảnh học sinh nộp (' + (s.files || []).length + ') — bấm để xem lớn</div>' +
      '<div class="chb-thumbs">' + links + '</div>' +
      (linksCham ? ('<div class="chb-label">✏️ Ảnh thầy đã chấm trả</div><div class="chb-thumbs">' + linksCham + '</div>') : '') +
      '<div class="grade-row">' +
        '<input class="input" type="number" min="0" max="10" step="0.25" placeholder="Điểm /10" id="diem-' + s.id + '" value="' + (s.score != null ? s.score : '') + '">' +
        '<textarea class="input" rows="4" placeholder="Lời phê cho học sinh… (nhấn Enter để xuống dòng — mỗi câu/ý một dòng cho dễ đọc)" id="phe-' + s.id + '" style="resize:vertical;line-height:1.5">' + (s.feedback || '') + '</textarea>' +
      '</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center">' +
        '<button type="button" class="btn btn-ghost btn-sm" style="padding:3px 8px;font-size:.8rem" onclick="chenYPhe(\'' + s.id + '\')">• Thêm dòng ý</button>' +
        '<button type="button" class="btn btn-ghost btn-sm" style="padding:3px 8px;font-size:.8rem" onclick="chenCauPhe(\'' + s.id + '\')">➕ Thêm “Câu …”</button>' +
        '<button type="button" class="btn btn-ghost btn-sm" style="padding:3px 8px;font-size:.8rem" id="btnxem-' + s.id + '" onclick="xemPheNhuHS(\'' + s.id + '\')">👁 Xem như HS</button>' +
      '</div>' +
      '<div id="preview-' + s.id + '" style="display:none;margin-top:8px;padding:12px 14px;border:1px solid var(--ok);border-radius:8px;background:var(--ok-soft)"></div>' +
      '<div class="chb-label">✏️ Ảnh chấm trả cho học sinh — dán (Ctrl/⌘+V) hoặc chọn tệp, ◀▶ đổi thứ tự, ✕ xoá, bấm ảnh để xem lớn</div>' +
      '<div class="chb-stage-zone" id="stagezone-' + s.id + '" tabindex="0" onclick="document.getElementById(\'filecham-' + s.id + '\').click()">📤 Bấm chọn ảnh · hoặc bấm vào đây rồi <b>dán (Ctrl/⌘ + V)</b></div>' +
      '<input type="file" id="filecham-' + s.id + '" accept="image/*,application/pdf" multiple style="display:none" onchange="chamThemFile(\'' + s.id + '\', this.files); this.value=String()">' +
      '<div class="chb-thumbs" id="chamstage-' + s.id + '" style="margin-top:8px"></div>' +
      '<div id="danchamtt-' + s.id + '" style="font-size:.8rem;color:var(--ok);margin-top:4px"></div>' +
      '<div style="margin-top:10px"><button class="btn btn-primary btn-sm" id="luu-' + s.id + '" onclick="luuCham(\'' + s.id + '\')">💾 Lưu & trả bài</button></div>';
  }

  $('dsBaiNop').innerHTML = order.map(function (g) {
    var s0 = g.subs[0];
    var hs = s0.profiles || {};
    var classNames = (hs.class_students || []).map(function (c) { return c.classes ? c.classes.name : ''; }).filter(Boolean).join(', ');
    var lop = classNames || '—';
    var tenBai = s0.lessons ? s0.lessons.title : (s0.exams ? '📝 Đề (tự luận): ' + s0.exams.title : 'Bài đã xoá');
    var kindChip = s0.kind === 'homework_bonus'
      ? '<span class="badge" style="background:linear-gradient(135deg,#ffd76a,#f39c12);color:#3a2560;font-weight:800;margin-right:6px">🎁 BT thưởng thêm</span>'
      : s0.kind === 'homework'
      ? '<span class="badge" style="background:var(--accent-soft);color:var(--accent);font-weight:700;margin-right:6px">🏠 BTVN bắt buộc</span>'
      : s0.kind === 'test'
      ? '<span class="badge" style="background:rgba(124,58,237,.14);color:#7c3aed;font-weight:700;margin-right:6px">📝 Kiểm tra</span>' : '';
    var soLan = g.subs.length > 1 ? '<span class="badge" style="background:#7c3aed;color:#fff">📥 ' + g.subs.length + ' lần nộp</span>' : '';
    var nhieu = g.subs.length > 1;
    var body = g.subs.map(function (s, i) {
      var inner = '<div id="sub-' + s.id + '"' + (nhieu ? ' style="border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;margin-top:10px;background:var(--surface-2)"' : '') + '>' +
        (nhieu ? '<div style="font-weight:800;font-size:.85rem;color:var(--accent);margin-bottom:6px">Lần ' + (g.subs.length - i) + (i === 0 ? ' (mới nhất)' : '') + '</div>' : '') +
        chbGradeForm(s) + '</div>';
      return inner;
    }).join('');
    return '<div class="card sub-card">' +
      '<div class="sub-head">' +
        '<div><b>' + (hs.full_name || '?') + '</b> <span style="color:var(--ink-3);font-size:.85rem">(' + (hs.username || '') + ' · ' + lop + ')</span></div>' + soLan +
      '</div>' +
      '<div style="font-size:.85rem;color:var(--ink-2);margin-top:2px;margin-bottom:2px">' + kindChip + tenBai + '</div>' +
      body +
      '</div>';
  }).join('');
}

async function luuCham(id) {
  var nut = $('luu-' + id);
  nut.disabled = true; nut.textContent = '⏳ Đang lưu…';
  try {
    // 1. Nếu có ảnh chấm (staging, đúng thứ tự): gửi lên Drive qua trạm nop-bai — chỉ lưu link, không tốn dung lượng DB
    var arr = chamStaged[id] || [];
    if (arr.length) {
      nut.textContent = '⏳ Đang tải ảnh chấm lên Drive…';
      var fd = new FormData();
      fd.append('kind', 'cham');
      fd.append('submission_id', id);
      arr.forEach(function (it) { fd.append('files', it.file); });
      var r1 = await sb.functions.invoke('nop-bai', { body: fd });
      if (r1.error) throw new Error(r1.error.message || 'Trạm lỗi');
      if (r1.data && r1.data.error) throw new Error(r1.data.error);
      arr.forEach(function (it) { try { URL.revokeObjectURL(it.url); } catch (e) {} });
      delete chamStaged[id];
    }
    // 2. Lưu điểm + lời phê
    var diem = $('diem-' + id).value;
    var r2 = await sb.from('submissions').update({
      score: diem === '' ? null : parseFloat(diem),
      feedback: $('phe-' + id).value.trim() || null,
      status: 'graded',
      graded_at: new Date().toISOString()
    }).eq('id', id);
    if (r2.error) throw new Error(r2.error.message);
    await taiDanhSach();
  } catch (e) {
    alert('Lỗi khi lưu: ' + e.message);
    nut.disabled = false; nut.textContent = '💾 Lưu & trả bài';
  }
}

/* ===== Lời phê: hỗ trợ xuống dòng, ngắt ý/câu, xem thử như HS ===== */
function chamEsc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
}
function chenYPhe(id) {
  var ta = document.getElementById('phe-' + id); if (!ta) return;
  var cur = ta.value;
  ta.value = cur + (cur && !cur.endsWith('\n') ? '\n' : '') + '• ';
  ta.focus(); ta.selectionStart = ta.selectionEnd = ta.value.length;
}
function chenCauPhe(id) {
  var ta = document.getElementById('phe-' + id); if (!ta) return;
  var cur = ta.value;
  var n = (cur.match(/(^|\n)\s*Câu\s*\d/gi) || []).length + 1;
  ta.value = cur + (cur && !cur.endsWith('\n') ? '\n' : '') + 'Câu ' + n + ': ';
  ta.focus(); ta.selectionStart = ta.selectionEnd = ta.value.length;
}
function xemPheNhuHS(id) {
  var ta = document.getElementById('phe-' + id), box = document.getElementById('preview-' + id), btn = document.getElementById('btnxem-' + id);
  if (!ta || !box) return;
  if (box.style.display === 'none' || !box.style.display) {
    var txt = ta.value.trim();
    box.innerHTML = txt
      ? ('<div style="font-weight:700;color:var(--ok);margin-bottom:6px">💬 Lời phê — HS sẽ thấy như sau:</div><div style="white-space:pre-wrap;line-height:1.6;color:var(--ink)">' + chamEsc(txt) + '</div>')
      : '<i style="color:var(--ink-3)">Chưa có lời phê.</i>';
    box.style.display = 'block'; if (btn) btn.textContent = '🙈 Ẩn xem thử';
  } else {
    box.style.display = 'none'; if (btn) btn.textContent = '👁 Xem như HS';
  }
}

/* ===== Ảnh nộp / ảnh chấm: thumbnail Drive + lightbox ===== */
function chbThumbs(files) {
  files = files || [];
  var gid = 'g' + (window._chbGid = (window._chbGid || 0) + 1);
  var imgs = [];
  var html = files.map(function (f) {
    var isImg = /\.(jpe?g|png|gif|webp|bmp|heic)$/i.test(f.name || '');
    if (isImg && f.id) {
      imgs.push({ id: f.id, name: f.name });
      var idx = imgs.length - 1;
      return '<div class="chb-thumb" onclick="chbXemGallery(\'' + gid + '\',' + idx + ')" title="' + chamEsc(f.name) + '">' +
        '<span class="idx">' + (idx + 1) + '</span>' +
        '<img loading="lazy" src="https://drive.google.com/thumbnail?id=' + f.id + '&sz=w300" onerror="chbImgLoi(this)"></div>';
    }
    return '<a class="chb-thumb file" href="' + f.link + '" target="_blank" title="' + chamEsc(f.name) + '">📄</a>';
  }).join('');
  window._chbGalleries = window._chbGalleries || {};
  window._chbGalleries[gid] = imgs;
  return html || '<span style="font-size:.82rem;color:var(--ink-3)">Không có ảnh.</span>';
}
function chbImgLoi(img) { img.onerror = null; var p = img.parentNode; p.classList.add('file'); img.remove(); p.insertAdjacentText('beforeend', '🖼'); }
function chbLightboxEl() {
  var lb = document.getElementById('chbLightbox');
  if (!lb) {
    lb = document.createElement('div'); lb.id = 'chbLightbox';
    lb.setAttribute('data-vm-popup-position', 'click');
    lb.innerHTML =
      '<div class="lb-modal" data-vm-popup-content onclick="event.stopPropagation()">' +
        '<div class="lb-header">' +
          '<span class="lb-title">🖼️ Chi tiết ảnh bài làm</span>' +
          '<span id="chbLbCount"></span>' +
          '<button class="lb-close-btn" onclick="document.getElementById(\'chbLightbox\').style.display=\'none\'" title="Đóng (Esc)">✕</button>' +
        '</div>' +
        '<div class="lb-body">' +
          '<button id="chbLbPrev" class="lb-arrow" onclick="chbLbNav(-1)" title="Ảnh trước">‹</button>' +
          '<div class="lb-img-container">' +
            '<img id="chbLbImg" alt="">' +
          '</div>' +
          '<button id="chbLbNext" class="lb-arrow" onclick="chbLbNav(1)" title="Ảnh sau">›</button>' +
        '</div>' +
        '<div class="lb-footer">' +
          '<button id="chbLbFooterPrev" onclick="chbLbNav(-1)" class="lb-btn" title="Ảnh trước">◀ Trước</button>' +
          '<button id="chbLbRot" onclick="chbLbXoay()" class="lb-btn lb-btn-primary" title="Xoay ảnh 90°">⟳ Xoay ảnh</button>' +
          '<button id="chbLbFooterNext" onclick="chbLbNav(1)" class="lb-btn" title="Ảnh sau">Sau ▶</button>' +
          '<div class="lb-divider"></div>' +
          '<a id="chbLbOpen" target="_blank" class="lb-btn lb-btn-drive" title="Mở ảnh gốc trong Drive">📂 Drive gốc</a>' +
        '</div>' +
      '</div>';
    lb.addEventListener('click', function (e) { lb.style.display = 'none'; });
    document.body.appendChild(lb);
    document.addEventListener('keydown', function (e) {
      if (!lb.style.display || lb.style.display === 'none') return;
      if (e.key === 'Escape') lb.style.display = 'none';
      else if (e.key === 'ArrowLeft') chbLbNav(-1);
      else if (e.key === 'ArrowRight') chbLbNav(1);
    });
  }
  return lb;
}
function chbApplyRot() {
  var img = document.getElementById('chbLbImg'); if (!img) return;
  var r = window._chbRot || 0;
  img.style.transform = 'rotate(' + r + 'deg)';
  if (r % 180 === 90) {
    img.style.maxWidth = '58vh';
    img.style.maxHeight = '70vw';
  } else {
    img.style.maxWidth = '100%';
    img.style.maxHeight = '100%';
  }
}
function chbLbXoay() { window._chbRot = ((window._chbRot || 0) + 90) % 360; chbApplyRot(); }
function chbLbShow() {
  var c = window._chbCur; if (!c) return;
  var g = (window._chbGalleries || {})[c.gid]; if (!g || !g.length) return;
  if (c.idx < 0) c.idx = g.length - 1;
  if (c.idx >= g.length) c.idx = 0;
  var it = g[c.idx];
  var lb = chbLightboxEl();
  window._chbRot = 0;
  document.getElementById('chbLbImg').src = 'https://drive.google.com/thumbnail?id=' + it.id + '&sz=w1600';
  var op = document.getElementById('chbLbOpen'); op.href = 'https://drive.google.com/file/d/' + it.id + '/view'; op.style.display = '';
  var cnt = document.getElementById('chbLbCount'); if (cnt) cnt.textContent = (c.idx + 1) + ' / ' + g.length;
  var multi = g.length > 1;
  var pv = document.getElementById('chbLbPrev'), nx = document.getElementById('chbLbNext');
  if (pv) pv.style.display = multi ? '' : 'none';
  if (nx) nx.style.display = multi ? '' : 'none';
  var fpv = document.getElementById('chbLbFooterPrev'), fnx = document.getElementById('chbLbFooterNext');
  if (fpv) fpv.style.display = multi ? '' : 'none';
  if (fnx) fnx.style.display = multi ? '' : 'none';
  chbApplyRot();
  var dangAn = !lb.style.display || lb.style.display === 'none';
  lb.style.display = 'flex';
  if (dangAn && window.vmCanhPopup) window.vmCanhPopup(lb, { position: 'click' });
}
function chbXemGallery(gid, idx) { window._chbCur = { gid: gid, idx: idx }; chbLbShow(); }
function chbLbNav(dir) { if (!window._chbCur) return; window._chbCur.idx += dir; chbLbShow(); }
function chbXemDrive(id) { window._chbGalleries = window._chbGalleries || {}; window._chbGalleries['_single'] = [{ id: id }]; window._chbCur = { gid: '_single', idx: 0 }; chbLbShow(); }
function chbXemUrl(url) {
  var lb = chbLightboxEl();
  window._chbRot = 0; chbApplyRot();
  document.getElementById('chbLbImg').src = url;
  document.getElementById('chbLbOpen').style.display = 'none';
  var cnt = document.getElementById('chbLbCount'); if (cnt) cnt.textContent = '';
  var pv = document.getElementById('chbLbPrev'), nx = document.getElementById('chbLbNext');
  if (pv) pv.style.display = 'none'; if (nx) nx.style.display = 'none';
  var fpv = document.getElementById('chbLbFooterPrev'), fnx = document.getElementById('chbLbFooterNext');
  if (fpv) fpv.style.display = 'none'; if (fnx) fnx.style.display = 'none';
  lb.style.display = 'flex';
}

/* ===== Ảnh chấm trả (staging): dán / chọn, sắp thứ tự, đổi vị trí, xoá ===== */
var chamStaged = {};
function chamThemFile(subId, fileList) {
  chamStaged[subId] = chamStaged[subId] || [];
  var them = 0;
  for (var i = 0; i < fileList.length; i++) {
    var f = fileList[i]; if (!f) continue;
    chamStaged[subId].push({ file: f, url: URL.createObjectURL(f) }); them++;
  }
  chamRenderStage(subId);
  var st = document.getElementById('danchamtt-' + subId);
  if (st && them) st.textContent = '✓ Đã thêm ' + them + ' ảnh · tổng ' + chamStaged[subId].length + ' ảnh chấm (sẽ lưu vào Drive theo thứ tự này)';
}
function chamRenderStage(subId) {
  var box = document.getElementById('chamstage-' + subId); if (!box) return;
  var arr = chamStaged[subId] || [];
  box.innerHTML = arr.map(function (it, i) {
    var isImg = it.file.type.indexOf('image') !== -1;
    var inner = isImg
      ? '<img src="' + it.url + '" onclick="chbXemUrl(\'' + it.url + '\')">'
      : '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:1.7rem">📄</div>';
    return '<div class="chb-cham-thumb"><span class="idx">' + (i + 1) + '</span>' + inner +
      '<div class="ops">' +
        '<button title="Sang trái" onclick="chamDoi(\'' + subId + '\',' + i + ',-1)">◀</button>' +
        '<button title="Xoá" onclick="chamXoa(\'' + subId + '\',' + i + ')">✕</button>' +
        '<button title="Sang phải" onclick="chamDoi(\'' + subId + '\',' + i + ',1)">▶</button>' +
      '</div></div>';
  }).join('');
}
function chamXoa(subId, i) { var arr = chamStaged[subId] || []; if (arr[i]) { try { URL.revokeObjectURL(arr[i].url); } catch (e) {} arr.splice(i, 1); } chamRenderStage(subId); }
function chamDoi(subId, i, dir) { var arr = chamStaged[subId] || []; var j = i + dir; if (j < 0 || j >= arr.length) return; var t = arr[i]; arr[i] = arr[j]; arr[j] = t; chamRenderStage(subId); }

/* Dán ảnh (Ctrl/⌘+V) khi con trỏ trong thẻ chấm bài đang thao tác */
window.addEventListener('paste', function (e) {
  var ae = document.activeElement;
  // Mỗi bài nộp được bọc trong <div id="sub-<id>"> — tìm đúng bài đang thao tác
  var card = ae && ae.closest ? ae.closest('[id^="sub-"]') : null;
  if (!card) return;
  var cd = e.clipboardData || (e.originalEvent && e.originalEvent.clipboardData);
  if (!cd) return;
  var imgs = [];
  if (cd.items) for (var i = 0; i < cd.items.length; i++) { var it = cd.items[i]; if (it.type && it.type.indexOf('image') !== -1) { var f = it.getAsFile(); if (f) imgs.push(f); } }
  if (!imgs.length && cd.files) for (var j = 0; j < cd.files.length; j++) { var ff = cd.files[j]; if (ff.type && ff.type.indexOf('image') !== -1) imgs.push(ff); }
  if (!imgs.length) return;
  e.preventDefault();
  var named = imgs.map(function (src, k) {
    var name = src.name;
    if (!name || /^image/i.test(name)) { var ext = (src.type.split('/')[1] || 'png'); name = 'cham-dan-' + Date.now() + '-' + k + '.' + ext; }
    return new File([src], name, { type: src.type });
  });
  chamThemFile(card.id.replace('sub-', ''), named);
});

function vmRenderFileList(inputId, listId) {
  var inp = document.getElementById(inputId), box = document.getElementById(listId);
  if (!box) return;
  var fs = inp ? inp.files : null;
  if (!fs || !fs.length) { box.innerHTML = ''; return; }
  var html = '';
  for (var i = 0; i < fs.length; i++) {
    var f = fs[i];
    var nm = String(f.name || 'tệp').replace(/[<>&"]/g, '');
    var icon = (f.type && f.type.indexOf('image') !== -1) ? '🖼' : '📄';
    html += '<span style="display:inline-flex;align-items:center;gap:6px;background:var(--surface-2,#eee);border:1px solid var(--line,#ddd);border-radius:6px;padding:3px 6px 3px 8px;margin:4px 6px 0 0;font-size:.78rem;max-width:240px">' +
      '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + icon + ' ' + nm + '</span>' +
      '<button type="button" title="Xoá" onclick="vmXoaFile(\'' + inputId + '\',' + i + ',\'' + listId + '\')" style="border:none;background:none;color:#c0392b;cursor:pointer;font-weight:800;font-size:1.05rem;line-height:1;padding:0 2px">×</button>' +
      '</span>';
  }
  box.innerHTML = html;
}
function vmXoaFile(inputId, idx, listId) {
  var inp = document.getElementById(inputId); if (!inp) return;
  var dt = new DataTransfer();
  for (var i = 0; i < inp.files.length; i++) { if (i !== idx) dt.items.add(inp.files[i]); }
  inp.files = dt.files;
  vmRenderFileList(inputId, listId);
}

async function xemChiTietTest(attemptId, hsName, title) {
  $('mtTieuDe').textContent = 'Chi tiết bài trắc nghiệm — ' + hsName;
  $('mtThongTin').textContent = 'Nội dung: ' + title;
  $('mtDanhSach').innerHTML = '<p style="color:var(--ink-3)">Đang tải chi tiết bài làm…</p>';
  $('modalTest').style.display = 'flex';
  
  try {
    var r = await sb.from('attempts')
      .select('id, score, correct_n, total_n, attempt_answers(chosen_key, is_correct, questions(content_latex, choices, solution_latex))')
      .eq('id', attemptId)
      .single();
      
    var data = r.data;
    if (!data) {
      $('mtDanhSach').innerHTML = '<p style="color:var(--err)">Không tải được chi tiết bài làm.</p>';
      return;
    }
    
    var listHtml = (data.attempt_answers || []).map(function (ans, idx) {
      var q = ans.questions || {};
      var correctAns = (q.choices || []).find(function (c) { return c.correct; }) || {};
      
      var resBadge = ans.is_correct 
        ? '<span style="color:var(--ok);font-weight:700">✓ Đúng</span>' 
        : '<span style="color:var(--err);font-weight:700">✗ Sai</span>';
        
      return '<div style="border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;font-size:.88rem;background:var(--surface)">' +
        '<div style="line-height:1.4"><b>Câu ' + (idx + 1) + ': </b>' + q.content_latex + '</div>' +
        '<div style="margin-top:8px;display:flex;gap:12px;align-items:center;font-size:.85rem">' +
          '<span>Đã chọn: <b style="color:' + (ans.is_correct ? 'var(--ok)' : 'var(--err)') + '">' + (ans.chosen_key || '—') + '</b></span>' +
          '<span>Đáp án đúng: <b style="color:var(--ok)">' + (correctAns.key || '—') + '</b></span>' +
          resBadge +
        '</div>' +
        (q.solution_latex ? '<div style="margin-top:8px;color:var(--ink-3);padding-top:8px;border-top:1px dashed var(--line);font-size:.82rem;line-height:1.4"><b>Lời giải: </b>' + q.solution_latex + '</div>' : '') +
        '</div>';
    }).join('');
    
    $('mtDanhSach').innerHTML = listHtml || '<p style="color:var(--ink-3)">Không tìm thấy câu trả lời nào.</p>';
    if (window.renderMathInElement) {
      window.renderMathInElement($('mtDanhSach'), {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false },
          { left: "\\(", right: "\\)", display: false },
          { left: "\\[", right: "\\]", display: true }
        ],
        throwOnError: false
      });
    }
  } catch (err) {
    $('mtDanhSach').innerHTML = '<p style="color:var(--err)">Lỗi: ' + err.message + '</p>';
  }
}
</script>
