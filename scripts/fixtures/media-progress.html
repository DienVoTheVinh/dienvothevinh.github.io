<!doctype html>
<html lang="vi" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiểm tra ngày và tiến độ tệp</title>
<link rel="stylesheet" href="/css/vm-date-inputs.css"><script src="/js/vm-progress.js"></script><script defer src="/js/vm-date-inputs.js"></script>
<style>
:root{--surface:#18202b;--ink:#eef1f6;--ink-3:#a9b3c2;--line-2:#354052;--accent:#f3ad16;--err:#ff8088;font:16px/1.6 system-ui}body{margin:0;background:#0c1118;color:var(--ink);padding:30px}main{max-width:700px;margin:40px auto}section{padding:24px;border:1px solid var(--line-2);border-radius:16px;background:var(--surface)}h1{font-size:25px}h2{font-size:18px;margin-top:0}label{display:block;margin-bottom:8px}input,button{font:inherit}input{border:1px solid var(--line-2);border-radius:7px;background:#0c1118;color:inherit}button{padding:9px 15px;border:1px solid var(--line-2);border-radius:8px;color:inherit;background:#283446;cursor:pointer;margin:8px 6px 0 0}small{color:var(--ink-3)}#payload{overflow-wrap:anywhere}dialog{border:1px solid var(--line-2);border-radius:14px;padding:24px;background:var(--surface);color:inherit}dialog::backdrop{background:#0007}[data-theme=light]{--surface:#fff;--ink:#172033;--ink-3:#627086;--line-2:#dce1e8;--accent:#b77900}[data-theme=light] body{background:#f4f6f9}[data-theme=light] input{background:#fff}[data-theme=light] button{background:#f4f6f9;color:#172033}
</style></head><body><main><h1>Ngày nộp bài và tiến độ tệp</h1><p>Giao diện kiểm tra độc lập · không dùng dữ liệu học sinh.</p><section><h2>Hạn nộp bài tập</h2><form id="form"><label for="due">Ngày và giờ nộp</label><input id="due" name="due" type="datetime-local"><p><small>Gõ liền số: 12102026 và 2030.</small></p><button id="save">Kiểm tra ngày</button><output id="payload"></output></form></section><p><button id="upload">Thử tải tệp</button><button id="download">Thử nhận tệp</button><button id="render">Thử dựng ảnh</button><button id="theme">Đổi nền sáng/tối</button><button id="modal">Mở cửa sổ thử</button></p><dialog id="dialog"><h2>Cửa sổ chỉnh sửa</h2><p>Thanh tiến độ vẫn hiển thị khi mở cửa sổ.</p><button id="dialogUpload">Thử tải trong cửa sổ</button><button onclick="this.closest('dialog').close()">Đóng</button></dialog></main>
<script>
form.onsubmit=function(e){e.preventDefault();payload.textContent='ISO: '+due.value;};
async function uploadFixture(){var fd=new FormData();fd.append('file',new Blob([new Uint8Array(2*1024*1024)]),'minh-hoa.pdf');try{await fetch('/upload',{method:'POST',body:fd,headers:{'X-Fixture':'safe'}});}catch(_){} }
document.getElementById('upload').onclick=uploadFixture;dialogUpload.onclick=uploadFixture;
document.getElementById('download').onclick=async function(){try{await (await fetch('/download')).blob();}catch(_){}};
document.getElementById('render').onclick=function(){VMProgress.run('Dựng ảnh minh họa',async function(task){task.update(25,'Đang dựng hình toán học…');var canvas=document.createElement('canvas');canvas.width=canvas.height=1400;canvas.getContext('2d').fillRect(0,0,1400,1400);task.update(70,'Đang mã hóa ảnh…');await new Promise(function(resolve){canvas.toBlob(resolve);});});};
theme.onclick=function(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';};modal.onclick=function(){dialog.showModal();};
</script></body></html>
