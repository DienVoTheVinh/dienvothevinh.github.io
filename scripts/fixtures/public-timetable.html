<!doctype html><html lang="vi" data-theme="dark"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiểm tra thời khóa biểu — dữ liệu mẫu</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../css/tokens.css"><link rel="stylesheet" href="../../css/vinhmath.css"><link rel="stylesheet" href="../../css/public-home.css"><body class="vm-public-home"><main class="home-shell" style="padding-top:32px"><h2>Thời khóa biểu · dữ liệu mẫu kiểm tra</h2><button id="theme" type="button">Đổi sáng / tối</button><div id="bangLichCongKhai" class="public-timetable"></div></main><script>
const rows=[];
function add(name,grade,days,start,end,mode='online'){days.forEach(weekday=>rows.push({weekday,start_time:start,end_time:end,mode,recurrence:'weekly',classes:{name,grade,is_specialized:name==='Toán 9'}}));}
add('8A1 – Duy Minh',8,[1,3,5],'17:45','19:15','offline');add('9A1 – Duy Minh',9,[1,3],'19:15','20:45','offline');add('Toán 7 – Q5',7,[2,5,6],'19:00','20:30','offline');add('Toán 8 – Q5',8,[2,4],'19:15','20:45','offline');add('Toán 9',9,[7],'09:00','10:30');add('Toán 9',9,[7],'13:00','14:30');add('Toán 7',7,[7],'14:30','16:30');add('ĐGNL ĐHQG TPHCM',12,[6],'16:00','18:00');add('Toán 12 Gò Dầu',12,[2,4,6],'13:00','14:30');
function daKetNoi(){return true}const sb={from(){return {select(){return {order(){return {order(){return Promise.resolve({data:rows})}}}}}}}};
document.getElementById('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';};
</script><script src="../../js/public-timetable.js"></script></body></html>
